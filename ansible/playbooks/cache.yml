---
- name: Apply cache host baseline
  hosts: cache
  become: true
  roles:
    - baseline
    - cache_proxy

- name: Validate cache VIP from cache hosts
  hosts: cache
  gather_facts: false
  vars:
    cache_validation_proxy_port: "{{ cache_proxy_port | default(cache_squid_http_port | default(3128)) }}"
    cache_validation_port_timeout: "{{ cache_validation_connect_timeout | default(5) }}"

  tasks:
    - name: Validate cache VIP ownership and failover from cache hosts
      ansible.builtin.include_role:
        name: shared
        tasks_from: keepalived_vip_validation
      vars:
        shared_keepalived_validation_enabled: "{{ cache_validation_enabled | default(true) }}"
        shared_keepalived_failover_enabled: "{{ cache_validation_failover_enabled | default(true) }}"
        shared_keepalived_group: "{{ cache_keepalived_group | default('cache') }}"
        shared_keepalived_vip: "{{ cache_proxy_vip }}"
        shared_keepalived_vip_label: Cache VIP
        shared_keepalived_port: "{{ cache_validation_proxy_port }}"
        shared_keepalived_port_timeout: "{{ cache_validation_port_timeout }}"
        shared_keepalived_failover_settle_seconds: >-
          {{ cache_validation_failover_settle_seconds | default(8) }}
      when:
        - cache_validation_enabled | default(true) | bool
        - cache_keepalived_enabled | default(true) | bool
        - cache_proxy_vip | default('') | length > 0

- name: Validate cache service from deployment host
  hosts: cache
  gather_facts: false
  vars:
    cache_validation_cache_hosts: "{{ groups.get(cache_keepalived_group | default('cache'), []) }}"
    cache_validation_proxy_port: "{{ cache_proxy_port | default(cache_squid_http_port | default(3128)) }}"
    cache_validation_port_timeout: "{{ cache_validation_connect_timeout | default(5) }}"

  tasks:
    - name: Run cache validation from the deployment host
      delegate_to: localhost
      run_once: true
      when:
        - cache_validation_enabled | default(true) | bool
      block:
        - name: Validate cache test inputs
          ansible.builtin.assert:
            that:
              - cache_validation_cache_hosts | length > 0
              - cache_validation_url | default('') | length > 0
              - cache_proxy_vip | default('') | length > 0
              - >-
                cache_validation_cache_hosts
                | difference((platform_host_ips | default({})).keys() | list)
                | length == 0
            fail_msg: >-
              Cache validation requires cache hosts, cache_validation_url,
              cache_proxy_vip, and platform_host_ips entries for every cache
              host.

        - name: Test cache proxy port on each cache node
          ansible.builtin.wait_for:
            host: "{{ platform_host_ips[item] }}"
            port: "{{ cache_validation_proxy_port }}"
            state: started
            timeout: "{{ cache_validation_port_timeout }}"
          loop: "{{ cache_validation_cache_hosts }}"
          changed_when: false

        - name: Test proxy request through each cache node
          ansible.builtin.uri:
            url: "{{ cache_validation_url }}"
            follow_redirects: all
            timeout: "{{ cache_validation_timeout | default(20) }}"
            use_proxy: true
          environment:
            http_proxy: "http://{{ platform_host_ips[item] }}:{{ cache_validation_proxy_port }}"
            https_proxy: "http://{{ platform_host_ips[item] }}:{{ cache_validation_proxy_port }}"
          loop: "{{ cache_validation_cache_hosts }}"
          changed_when: false

        - name: Test cache VIP proxy port
          ansible.builtin.wait_for:
            host: "{{ cache_proxy_vip }}"
            port: "{{ cache_validation_proxy_port }}"
            state: started
            timeout: "{{ cache_validation_port_timeout }}"
          changed_when: false

        - name: Test proxy request through the cache VIP
          ansible.builtin.uri:
            url: "{{ cache_validation_url }}"
            follow_redirects: all
            timeout: "{{ cache_validation_timeout | default(20) }}"
            use_proxy: true
          environment:
            http_proxy: "http://{{ cache_proxy_vip }}:{{ cache_validation_proxy_port }}"
            https_proxy: "http://{{ cache_proxy_vip }}:{{ cache_validation_proxy_port }}"
          changed_when: false

        - name: Test proxy request through the cache VIP FQDN
          ansible.builtin.uri:
            url: "{{ cache_validation_url }}"
            follow_redirects: all
            timeout: "{{ cache_validation_timeout | default(20) }}"
            use_proxy: true
          environment:
            http_proxy: "http://{{ cache_proxy_fqdn }}:{{ cache_validation_proxy_port }}"
            https_proxy: "http://{{ cache_proxy_fqdn }}:{{ cache_validation_proxy_port }}"
          register: cache_validation_vip_fqdn_test
          failed_when: false
          changed_when: false
          when: cache_proxy_fqdn | default('') | length > 0

        - name: Warn when cache VIP FQDN validation fails
          ansible.builtin.debug:
            msg: >-
              WARNING: cache VIP works by IP, but {{ cache_proxy_fqdn }} did
              not complete a proxy request from the deployment host. Check DNS
              or temporary hosts entries before using the cache by name.
          when:
            - cache_proxy_fqdn | default('') | length > 0
            - cache_validation_vip_fqdn_test.status | default(0) != 200

        - name: Warn when cache proxy FQDN is not set
          ansible.builtin.debug:
            msg: >-
              WARNING: cache_proxy_fqdn is not set, so the cache VIP DNS
              validation was skipped.
          when: cache_proxy_fqdn | default('') | length == 0
