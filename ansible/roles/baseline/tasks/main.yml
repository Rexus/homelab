---
- name: Manage host-wide repository proxy settings
  ansible.builtin.include_tasks: repository_proxy.yml
  when: baseline_manage_repository_proxy | bool

- name: Manage optional shell proxy environment
  ansible.builtin.include_tasks: shell_proxy.yml
  when: baseline_manage_shell_proxy | bool

- name: Ensure timezone is configured when enabled
  ansible.builtin.timezone:
    name: "{{ baseline_timezone }}"
  when: baseline_manage_timezone

- name: Validate NetworkManager profiles are listed for IPv6 policy
  ansible.builtin.assert:
    that:
      - baseline_networkmanager_ipv6_connections | length > 0
    fail_msg: >-
      baseline_disable_ipv6 is true and NetworkManager IPv6 management is
      enabled, but no NetworkManager connection profiles are listed. Set
      baseline_networkmanager_ipv6_connections to the existing profile name,
      such as "System eth0", or set baseline_manage_networkmanager_ipv6: false
      and baseline_manage_ipv6_sysctl: true for a non-NetworkManager host.
  when:
    - baseline_manage_networkmanager_ipv6 | bool
    - baseline_disable_ipv6 | bool

- name: Show NetworkManager profiles selected for IPv6 policy
  ansible.builtin.debug:
    msg: >-
      Applying IPv6 policy to NetworkManager profile {{ item.conn_name }} on
      interface {{ item.ifname | default(item.conn_name) }}.
  loop: "{{ baseline_networkmanager_ipv6_connections }}"
  loop_control:
    label: "{{ item.conn_name }}"
  when:
    - baseline_manage_networkmanager_ipv6 | bool
    - baseline_disable_ipv6 | bool

- name: Disable IPv6 on NetworkManager Ethernet connections
  community.general.nmcli:
    conn_name: "{{ item.conn_name }}"
    ifname: "{{ item.ifname | default(omit) }}"
    type: ethernet
    method6: disabled
    conn_reload: true
    state: present
  loop: "{{ baseline_networkmanager_ipv6_connections }}"
  loop_control:
    label: "{{ item.conn_name }}"
  register: baseline_networkmanager_ipv6_profiles
  when:
    - baseline_manage_networkmanager_ipv6 | bool
    - baseline_disable_ipv6 | bool

- name: Configure fallback baseline network sysctl settings
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "{{ '1' if baseline_disable_ipv6 | bool else '0' }}"
    sysctl_file: "{{ baseline_network_sysctl_file }}"
    state: present
    sysctl_set: true
    reload: true
  loop: >-
    {{
      [
        'net.ipv6.conf.all.disable_ipv6',
        'net.ipv6.conf.default.disable_ipv6'
      ]
      + (
        ['net.ipv6.conf.' ~ ansible_default_ipv4.interface ~ '.disable_ipv6']
        if ansible_default_ipv4.interface is defined
        else []
      )
    }}
  loop_control:
    label: "{{ item }}"
  when:
    - baseline_manage_ipv6_sysctl | bool
    - baseline_disable_ipv6 | bool
