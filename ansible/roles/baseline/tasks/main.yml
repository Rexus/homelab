---
- name: Configure package proxy host entry when requested
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} HOMELAB BASELINE PACKAGE PROXY HOST"
    block: |
      {{ baseline_package_proxy_ip }} {{ baseline_package_proxy_fqdn }}
  when:
    - baseline_manage_package_proxy | bool
    - baseline_manage_package_proxy_hosts_entry | bool
    - baseline_package_proxy_fqdn | length > 0
    - baseline_package_proxy_ip | length > 0

- name: Remove managed package proxy host entry when unset
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} HOMELAB BASELINE PACKAGE PROXY HOST"
    state: absent
  when:
    - baseline_manage_package_proxy | bool
    - baseline_manage_package_proxy_hosts_entry | bool
    - >-
      baseline_package_proxy_fqdn | length == 0
      or baseline_package_proxy_ip | length == 0

- name: Check DNF package manager configuration
  ansible.builtin.stat:
    path: /etc/dnf/dnf.conf
  register: baseline_dnf_config
  when: baseline_manage_package_proxy | bool

- name: Fail when a package proxy is requested but DNF is unavailable
  ansible.builtin.fail:
    msg: >-
      baseline_package_proxy_url is set, but /etc/dnf/dnf.conf was not found.
      This baseline proxy hook currently targets Enterprise Linux guests that
      use DNF. Use direct package access, configure the host manually, or add a
      distro-specific baseline task before enabling the proxy for this host.
  when:
    - baseline_manage_package_proxy | bool
    - baseline_package_proxy_url | length > 0
    - not baseline_dnf_config.stat.exists | default(false)

- name: Configure DNF package proxy when requested
  ansible.builtin.blockinfile:
    path: /etc/dnf/dnf.conf
    marker: "# {mark} HOMELAB BASELINE PACKAGE PROXY"
    insertafter: '^\[main\]'
    block: |
      proxy={{ baseline_package_proxy_url }}
  when:
    - baseline_manage_package_proxy | bool
    - baseline_package_proxy_url | length > 0
    - baseline_dnf_config.stat.exists | default(false)

- name: Remove managed DNF package proxy when unset
  ansible.builtin.blockinfile:
    path: /etc/dnf/dnf.conf
    marker: "# {mark} HOMELAB BASELINE PACKAGE PROXY"
    state: absent
  when:
    - baseline_manage_package_proxy | bool
    - baseline_package_proxy_url | length == 0
    - baseline_dnf_config.stat.exists | default(false)

- name: Ensure timezone is configured when enabled
  ansible.builtin.timezone:
    name: "{{ baseline_timezone }}"
  when: baseline_manage_timezone
