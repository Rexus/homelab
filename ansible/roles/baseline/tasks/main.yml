---
- name: Manage host-wide repository proxy settings
  ansible.builtin.include_tasks: repository_proxy.yml
  when: baseline_manage_repository_proxy | bool

- name: Manage optional shell proxy environment
  ansible.builtin.include_tasks: shell_proxy.yml
  when: baseline_manage_shell_proxy | bool

- name: Ensure timezone is configured when enabled
  ansible.builtin.timezone:
    name: "{{ baseline_timezone }}"
  when: baseline_manage_timezone

- name: Resolve NetworkManager connections for IPv6 policy
  ansible.builtin.set_fact:
    baseline_resolved_networkmanager_ipv6_connections: >-
      {{
        baseline_networkmanager_ipv6_connections
        if baseline_networkmanager_ipv6_connections | length > 0
        else [
          {
            'conn_name': ansible_default_ipv4.interface,
            'ifname': ansible_default_ipv4.interface
          }
        ]
      }}
  when:
    - baseline_manage_networkmanager_ipv6 | bool
    - baseline_disable_ipv6 | bool
    - ansible_default_ipv4.interface is defined

- name: Disable IPv6 on NetworkManager Ethernet connections
  community.general.nmcli:
    conn_name: "{{ item.conn_name }}"
    ifname: "{{ item.ifname | default(item.conn_name) }}"
    type: ethernet
    method6: disabled
    state: present
  loop: "{{ baseline_resolved_networkmanager_ipv6_connections | default([]) }}"
  loop_control:
    label: "{{ item.conn_name }}"
  register: baseline_networkmanager_ipv6_profiles
  when:
    - baseline_manage_networkmanager_ipv6 | bool
    - baseline_disable_ipv6 | bool

- name: Reapply NetworkManager Ethernet connections after IPv6 changes
  community.general.nmcli:
    conn_name: "{{ item.item.conn_name }}"
    ifname: "{{ item.item.ifname | default(item.item.conn_name) }}"
    type: ethernet
    state: up
  loop: "{{ baseline_networkmanager_ipv6_profiles.results | default([]) }}"
  loop_control:
    label: "{{ item.item.conn_name }}"
  when:
    - baseline_manage_networkmanager_ipv6 | bool
    - baseline_disable_ipv6 | bool
    - item.changed | default(false)

- name: Configure baseline network sysctl settings
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "{{ '1' if baseline_disable_ipv6 | bool else '0' }}"
    sysctl_file: "{{ baseline_network_sysctl_file }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
  loop_control:
    label: "{{ item }}"
