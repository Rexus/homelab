---
- name: Validate cache proxy inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - cache_keepalived_vip_cidr is defined
      - cache_keepalived_vip_cidr | length > 0
      - cache_squid_http_port is defined
      - cache_squid_allowed_cidrs | length > 0
      - groups.get(cache_keepalived_group, []) | length >= 1
      - not cache_squid_data_disk_enabled | bool or cache_squid_data_device | length > 0
      - >-
        groups.get(cache_keepalived_group, [])
        | difference(platform_host_ips.keys() | list)
        | length == 0
    fail_msg: >-
      The cache proxy role currently targets Enterprise Linux guests and
      requires a keepalived VIP, allowed CIDRs, and static platform_host_ips
      for every cache host.

- name: Install cache proxy packages
  ansible.builtin.package:
    name:
      - "{{ cache_squid_package_name }}"
      - "{{ cache_keepalived_package_name }}"
    state: "{{ cache_squid_package_state }}"

- name: Stop Squid before preparing the cache data disk
  ansible.builtin.service:
    name: squid
    state: stopped
  when: cache_squid_data_disk_enabled | bool

- name: Ensure Squid cache directory exists
  ansible.builtin.file:
    path: "{{ cache_squid_cache_dir }}"
    state: directory
    owner: squid
    group: squid
    mode: "0750"

- name: Install cache filesystem tooling
  ansible.builtin.package:
    name: "{{ cache_squid_data_fstype_package }}"
    state: present
  when:
    - cache_squid_data_disk_enabled | bool
    - cache_squid_data_fstype_package | length > 0

- name: Wait for Squid cache data disk to appear
  ansible.builtin.wait_for:
    path: "{{ cache_squid_data_device }}"
    timeout: "{{ cache_squid_data_device_wait_timeout }}"
  when: cache_squid_data_disk_enabled | bool

- name: Create filesystem on Squid cache data disk
  community.general.filesystem:
    dev: "{{ cache_squid_data_device }}"
    fstype: "{{ cache_squid_data_fstype }}"
  when: cache_squid_data_disk_enabled | bool

- name: Mount Squid cache data disk
  ansible.posix.mount:
    path: "{{ cache_squid_cache_dir }}"
    src: "{{ cache_squid_data_device }}"
    fstype: "{{ cache_squid_data_fstype }}"
    opts: "{{ cache_squid_data_mount_opts }}"
    state: mounted
  when: cache_squid_data_disk_enabled | bool

- name: Ensure Squid owns the mounted cache directory
  ansible.builtin.file:
    path: "{{ cache_squid_cache_dir }}"
    state: directory
    owner: squid
    group: squid
    mode: "0750"

- name: Install Squid health check for keepalived
  ansible.builtin.copy:
    dest: "{{ cache_squid_check_script_path }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      systemctl is-active --quiet squid
  notify: Restart keepalived

- name: Render Squid configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ cache_squid_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart squid

- name: Initialize Squid cache directory
  ansible.builtin.command:
    argv:
      - "{{ cache_squid_binary }}"
      - -z
      - -f
      - "{{ cache_squid_config_path }}"
    creates: "{{ cache_squid_cache_dir }}/00"
  when: cache_squid_initialize_cache | bool

- name: Render keepalived configuration for the cache VIP
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ cache_keepalived_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart keepalived
  when: cache_keepalived_enabled | bool

- name: Apply pending cache service handler changes
  ansible.builtin.meta: flush_handlers

- name: Ensure Squid service is enabled and started
  ansible.builtin.service:
    name: squid
    enabled: "{{ cache_squid_service_enabled }}"
    state: "{{ cache_squid_service_state }}"

- name: Ensure keepalived service is enabled and started
  ansible.builtin.service:
    name: keepalived
    enabled: true
    state: started
  when: cache_keepalived_enabled | bool
