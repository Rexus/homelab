---
- name: Validate cache proxy inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - cache_keepalived_vip_cidr is defined
      - cache_keepalived_vip_cidr | length > 0
      - cache_squid_http_port is defined
      - cache_squid_allowed_cidrs | length > 0
      - groups.get(cache_keepalived_group, []) | length >= 1
      - not cache_squid_data_disk_enabled | bool or cache_squid_data_device | length > 0
      - >-
        groups.get(cache_keepalived_group, [])
        | difference(platform_host_ips.keys() | list)
        | length == 0
    fail_msg: >-
      The cache proxy role currently targets Enterprise Linux guests and
      requires a keepalived VIP, allowed CIDRs, and static platform_host_ips
      for every cache host.

- name: Install cache proxy packages
  ansible.builtin.package:
    name:
      - "{{ cache_squid_package_name }}"
      - "{{ cache_keepalived_package_name }}"
    state: "{{ cache_squid_package_state }}"

- name: Install cache validation client
  ansible.builtin.package:
    name: "{{ cache_validation_client_package }}"
    state: present
  when:
    - cache_validation_enabled | default(true) | bool
    - cache_validation_client_package | length > 0

- name: Ensure Squid systemd override directory exists
  ansible.builtin.file:
    path: "{{ cache_squid_systemd_override_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cache_squid_manage_systemd_limits | bool

- name: Configure Squid file descriptor limit
  ansible.builtin.copy:
    dest: "{{ cache_squid_systemd_override_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      LimitNOFILE={{ cache_squid_limit_nofile }}
  notify:
    - Reload systemd
    - Restart squid
  when: cache_squid_manage_systemd_limits | bool

- name: Write cache proxy sysctl settings
  ansible.builtin.copy:
    dest: "{{ cache_squid_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible cache_proxy role.
      {% for key, value in cache_squid_sysctl_settings | dictsort %}
      {{ key }} = {{ value }}
      {% endfor %}
  register: cache_squid_sysctl_config
  when: cache_squid_manage_sysctl | bool

- name: Apply cache proxy sysctl settings
  ansible.builtin.command:
    argv:
      - sysctl
      - -p
      - "{{ cache_squid_sysctl_file }}"
  changed_when: cache_squid_sysctl_config.changed
  when:
    - cache_squid_manage_sysctl | bool
    - cache_squid_sysctl_config.changed | default(false)

- name: Check firewalld service state
  ansible.builtin.command:
    argv:
      - "{{ cache_systemctl_binary }}"
      - is-active
      - firewalld
  register: cache_firewalld_state
  failed_when: false
  changed_when: false
  when: cache_manage_firewalld | bool

- name: Ensure firewalld allows the Squid proxy port
  ansible.posix.firewalld:
    port: "{{ cache_squid_http_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  notify: Reload firewalld
  when:
    - cache_manage_firewalld | bool
    - cache_firewalld_open_proxy_port | bool
    - cache_firewalld_state.rc | default(1) == 0

- name: Ensure firewalld allows keepalived VRRP
  ansible.posix.firewalld:
    rich_rule: "{{ cache_firewalld_vrrp_rich_rule }}"
    permanent: true
    immediate: true
    state: enabled
  notify: Reload firewalld
  when:
    - cache_manage_firewalld | bool
    - cache_firewalld_open_keepalived_vrrp | bool
    - cache_keepalived_enabled | bool
    - cache_firewalld_state.rc | default(1) == 0

- name: Ensure Squid cache directory exists
  ansible.builtin.file:
    path: "{{ cache_squid_cache_dir }}"
    state: directory
    owner: squid
    group: squid
    mode: "0750"

- name: Install cache filesystem tooling
  ansible.builtin.package:
    name: "{{ cache_squid_data_fstype_package }}"
    state: present
  when:
    - cache_squid_data_disk_enabled | bool
    - cache_squid_data_fstype_package | length > 0

- name: Check whether Squid cache data disk is present
  ansible.builtin.wait_for:
    path: "{{ cache_squid_data_device }}"
    timeout: "{{ cache_squid_data_device_wait_timeout }}"
  when: cache_squid_data_disk_enabled | bool

- name: Check Squid cache data disk filesystem
  ansible.builtin.command:
    argv:
      - blkid
      - -o
      - value
      - -s
      - TYPE
      - "{{ cache_squid_data_device }}"
  register: cache_squid_data_device_blkid
  failed_when: false
  changed_when: false
  when: cache_squid_data_disk_enabled | bool

- name: Check whether Squid cache data disk is mounted
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --target
      - "{{ cache_squid_cache_dir }}"
      - --source
      - "{{ cache_squid_data_device }}"
  register: cache_squid_data_mount_check
  failed_when: false
  changed_when: false
  when: cache_squid_data_disk_enabled | bool

- name: Fail when Squid cache data disk has an unexpected filesystem
  ansible.builtin.fail:
    msg: >-
      {{ cache_squid_data_device }} already has filesystem
      {{ cache_squid_data_device_blkid.stdout }}. Expected
      {{ cache_squid_data_fstype }}. Refusing to reformat automatically.
  when:
    - cache_squid_data_disk_enabled | bool
    - cache_squid_data_device_blkid.rc == 0
    - cache_squid_data_device_blkid.stdout != cache_squid_data_fstype

- name: Stop Squid before changing cache data disk state
  ansible.builtin.service:
    name: squid
    state: stopped
  when:
    - cache_squid_data_disk_enabled | bool
    - >-
      cache_squid_data_device_blkid.rc != 0
      or cache_squid_data_mount_check.rc != 0

- name: Create filesystem on Squid cache data disk when empty
  ansible.builtin.command:
    argv:
      - mkfs
      - -t
      - "{{ cache_squid_data_fstype }}"
      - "{{ cache_squid_data_device }}"
  when:
    - cache_squid_data_disk_enabled | bool
    - cache_squid_data_device_blkid.rc != 0

- name: Ensure Squid cache data disk is mounted
  ansible.posix.mount:
    path: "{{ cache_squid_cache_dir }}"
    src: "{{ cache_squid_data_device }}"
    fstype: "{{ cache_squid_data_fstype }}"
    opts: "{{ cache_squid_data_mount_opts }}"
    state: mounted
  register: cache_squid_data_mount
  when: cache_squid_data_disk_enabled | bool

- name: Check Squid cache data disk size
  ansible.builtin.command:
    argv:
      - blockdev
      - --getsize64
      - "{{ cache_squid_data_device }}"
  register: cache_squid_data_device_size
  changed_when: false
  when:
    - cache_squid_data_disk_enabled | bool
    - cache_squid_data_fstype == "xfs"

- name: Check Squid cache filesystem size
  ansible.builtin.command:
    argv:
      - findmnt
      - --bytes
      - --noheadings
      - --output
      - SIZE
      - --target
      - "{{ cache_squid_cache_dir }}"
  register: cache_squid_data_filesystem_size
  changed_when: false
  when:
    - cache_squid_data_disk_enabled | bool
    - cache_squid_data_fstype == "xfs"

- name: Grow Squid cache XFS filesystem when the data disk expanded
  ansible.builtin.command:
    argv:
      - xfs_growfs
      - "{{ cache_squid_cache_dir }}"
  when:
    - cache_squid_data_disk_enabled | bool
    - cache_squid_data_fstype == "xfs"
    - >-
      (cache_squid_data_device_size.stdout | trim | int)
      > (cache_squid_data_filesystem_size.stdout | trim | int)

- name: Ensure Squid owns the mounted cache directory
  ansible.builtin.file:
    path: "{{ cache_squid_cache_dir }}"
    state: directory
    owner: squid
    group: squid
    mode: "0750"

- name: Install SELinux restore tooling for Squid cache path
  ansible.builtin.package:
    name: "{{ cache_squid_selinux_package }}"
    state: present
  when:
    - cache_squid_restore_selinux_context | bool
    - ansible_selinux.status | default('disabled') == 'enabled'

- name: Ensure keepalived helper script directory exists
  ansible.builtin.file:
    path: "{{ cache_keepalived_script_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Squid health check for keepalived
  ansible.builtin.copy:
    dest: "{{ cache_squid_check_script_path }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      exec {{ cache_systemctl_binary }} is-active --quiet squid
  notify: Restart keepalived

- name: Check SELinux context drift on keepalived files
  ansible.builtin.command:
    argv:
      - restorecon
      - -nRFv
      - "{{ cache_keepalived_script_dir }}"
  register: cache_keepalived_selinux_context_check
  changed_when: false
  when:
    - cache_squid_restore_selinux_context | bool
    - ansible_selinux.status | default('disabled') == 'enabled'

- name: Restore SELinux context on keepalived files when needed
  ansible.builtin.command:
    argv:
      - restorecon
      - -RF
      - "{{ cache_keepalived_script_dir }}"
  changed_when: true
  notify: Restart keepalived
  when:
    - cache_squid_restore_selinux_context | bool
    - ansible_selinux.status | default('disabled') == 'enabled'
    - >-
      cache_keepalived_selinux_context_check.stdout | default('') | length > 0
      or cache_keepalived_selinux_context_check.stderr | default('') | length > 0

- name: Render Squid configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: "{{ cache_squid_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart squid

- name: Validate Squid configuration
  ansible.builtin.command:
    argv:
      - "{{ cache_squid_binary }}"
      - -k
      - parse
      - -f
      - "{{ cache_squid_config_path }}"
  changed_when: false

- name: Initialize Squid cache directory
  ansible.builtin.command:
    argv:
      - "{{ cache_squid_binary }}"
      - -z
      - -f
      - "{{ cache_squid_config_path }}"
    creates: "{{ cache_squid_cache_dir }}/00"
  when: cache_squid_initialize_cache | bool

- name: Check SELinux context drift on Squid cache directory
  ansible.builtin.command:
    argv:
      - restorecon
      - -nRFv
      - "{{ cache_squid_cache_dir }}"
  register: cache_squid_selinux_context_check
  changed_when: false
  when:
    - cache_squid_restore_selinux_context | bool
    - ansible_selinux.status | default('disabled') == 'enabled'

- name: Restore SELinux context on Squid cache directory when needed
  ansible.builtin.command:
    argv:
      - restorecon
      - -RF
      - "{{ cache_squid_cache_dir }}"
  changed_when: true
  when:
    - cache_squid_restore_selinux_context | bool
    - ansible_selinux.status | default('disabled') == 'enabled'
    - >-
      cache_squid_selinux_context_check.stdout | default('') | length > 0
      or cache_squid_selinux_context_check.stderr | default('') | length > 0

- name: Render keepalived configuration for the cache VIP
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ cache_keepalived_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart keepalived
  when: cache_keepalived_enabled | bool

- name: Apply pending cache service handler changes
  ansible.builtin.meta: flush_handlers

- name: Ensure Squid service is enabled and started
  ansible.builtin.service:
    name: squid
    enabled: "{{ cache_squid_service_enabled }}"
    state: "{{ cache_squid_service_state }}"

- name: Validate Squid health check for keepalived
  ansible.builtin.command:
    argv:
      - "{{ cache_squid_check_script_path }}"
  changed_when: false

- name: Test upstream URL reachability from cache host
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --location
      - --max-time
      - "{{ cache_validation_timeout | default(20) | string }}"
      - --output
      - /dev/null
      - "{{ cache_validation_url }}"
  changed_when: false
  when:
    - cache_validation_enabled | default(true) | bool
    - cache_validation_url | default('') | length > 0

- name: Ensure keepalived service is enabled and started
  ansible.builtin.service:
    name: keepalived
    enabled: true
    state: started
  when: cache_keepalived_enabled | bool
