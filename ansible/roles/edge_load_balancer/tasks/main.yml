---
- name: Validate edge load-balancer inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - >-
        edge_keepalived_vips | default([]) | length > 0
        or edge_keepalived_vip_cidr is defined
      - >-
        (
          edge_keepalived_vips | default([])
          | selectattr('vip_cidr', 'defined')
          | list
          | length
        ) == (edge_keepalived_vips | default([]) | length)
      - >-
        (
          edge_keepalived_vips | default([])
          | selectattr('virtual_router_id', 'defined')
          | list
          | length
        ) == (edge_keepalived_vips | default([]) | length)
      - >-
        (
          edge_keepalived_vips | default([])
          | map(attribute='virtual_router_id')
          | list
          | unique
          | length
        ) == (edge_keepalived_vips | default([]) | length)
      - groups.get(edge_keepalived_group | default(''), []) | length >= 1
      - >-
        groups.get(edge_keepalived_group | default(''), [])
        | difference((platform_host_ips | default({})).keys() | list)
        | length == 0
    fail_msg: >-
      The edge load-balancer role currently targets Enterprise Linux guests and
      requires keepalived VIP settings plus static platform_host_ips for every
      edge host.

- name: Install edge load-balancer packages
  ansible.builtin.include_role:
    name: shared
    tasks_from: packages
  vars:
    shared_packages:
      - "{{ edge_haproxy_package_name }}"
      - "{{ edge_keepalived_package_name }}"
    shared_package_state: "{{ edge_haproxy_package_state }}"
    shared_package_update_cache: true

- name: Allow HAProxy to bind the VIP on standby nodes
  ansible.builtin.include_role:
    name: shared
    tasks_from: sysctl
  vars:
    shared_sysctl_settings:
      net.ipv4.ip_nonlocal_bind: "1"
  when: edge_haproxy_bind_nonlocal | bool

- name: Install HAProxy health check for keepalived
  ansible.builtin.copy:
    dest: "{{ edge_haproxy_check_script_path }}"
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      systemctl is-active --quiet haproxy
  notify: Restart keepalived

- name: Render HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ edge_haproxy_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "haproxy -c -f %s"
  notify: Restart haproxy

- name: Render keepalived configuration for the edge VIP
  ansible.builtin.include_role:
    name: shared
    tasks_from: keepalived
  vars:
    shared_keepalived_enabled: "{{ edge_keepalived_enabled }}"
    shared_keepalived_config_path: "{{ edge_keepalived_config_path }}"
    shared_keepalived_group: "{{ edge_keepalived_group }}"
    shared_keepalived_interface: "{{ edge_keepalived_interface }}"
    shared_keepalived_advert_int: "{{ edge_keepalived_advert_int }}"
    shared_keepalived_instance_name_prefix: edge_
    shared_keepalived_scripts:
      - name: chk_haproxy
        path: "{{ edge_haproxy_check_script_path }}"
    shared_keepalived_default_track_scripts:
      - chk_haproxy
    shared_keepalived_instances: >-
      {{
        edge_keepalived_vips
        if edge_keepalived_vips | default([]) | length > 0
        else [
          {
            'name': 'edge_vip',
            'vip_cidr': edge_keepalived_vip_cidr,
            'virtual_router_id': edge_keepalived_virtual_router_id,
            'priority_base': edge_keepalived_priority_base,
            'priority_step': edge_keepalived_priority_step
          }
        ]
      }}
  when: edge_keepalived_enabled | bool

- name: Apply pending edge service handler changes
  ansible.builtin.meta: flush_handlers

- name: Ensure HAProxy service is enabled and started
  ansible.builtin.service:
    name: haproxy
    enabled: "{{ edge_haproxy_service_enabled }}"
    state: "{{ edge_haproxy_service_state }}"

- name: Ensure keepalived service is enabled and started
  ansible.builtin.service:
    name: keepalived
    enabled: true
    state: started
  when: edge_keepalived_enabled | bool
