<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 836" role="img" aria-labelledby="title desc" data-view-id="VIEW-platform-overview">
  <title id="title">Shared platform | resource providers and backing</title>
  <desc id="desc">Shared virtualization provides guest storage and network services. Physical servers, drives and switches back those services. Logical fabric and an optional storage transport remain distinct from physical equipment. Each box links to hosting, networking or data.</desc>
