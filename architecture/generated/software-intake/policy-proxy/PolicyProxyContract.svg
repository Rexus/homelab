<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 602" role="img" data-view-id="VIEW-proxy-contract" data-subject="DEF-proxy" data-contract-documentation="DOC-proxy-contract" data-contract-ports="[&quot;cacheAccess&quot;, &quot;listener&quot;, &quot;outbound&quot;]">
  <title>Policy proxy contract</title>
  <style>a{cursor:pointer}a:hover rect,a:focus rect{stroke-width:2.5px}</style>
  <rect width="960" height="602" fill="white" />
  <text x="30" y="35" style="font:bold 24px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Policy proxy contract</text>
  <text x="30" y="65" style="font:normal 15px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">What interfaces and obligations define PolicyProxy, independently of its uses?</text>
  <g class="explorer-card" data-element="DEF-proxy" data-category="logical" color="#203a5b" style=";color:#203a5b;">
    <rect x="30" y="100" width="900" height="116" rx="4" fill="#f8fafc" stroke="#64748b" style=";fill:#e7f0fc;stroke:#4d719b;" />
    <text x="45" y="125" style="font:bold 17px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">DEF-proxy · PolicyProxy</text>
    <text x="45" y="149" style="font:normal 15px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Admit by client, destination and port before forwarding or cache lookup. Reject disallowed requests without</text>
    <text x="45" y="169" style="font:normal 15px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">contacting the source or reading cached content. Forward encrypted tunnels without payload inspection. Cache</text>
    <text x="45" y="189" style="font:normal 15px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">eligible HTTP responses only; a cache hit conveys no release approval.</text>
  </g>
  <text x="30" y="256" style="font:bold 18px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Owned interfaces</text>
  <g class="explorer-card">
    <rect x="30" y="272" width="900" height="76" rx="4" fill="#f8fafc" stroke="#64748b" />
    <text x="45" y="297" style="font:bold 17px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">cacheAccess</text>
    <text x="45" y="321" style="font:normal 15px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">TransferPort</text>
  </g>
  <g class="explorer-card">
    <rect x="30" y="360" width="900" height="76" rx="4" fill="#f8fafc" stroke="#64748b" />
    <text x="45" y="385" style="font:bold 17px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">listener</text>
    <text x="45" y="409" style="font:normal 15px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">TransferPort</text>
  </g>
  <g class="explorer-card">
