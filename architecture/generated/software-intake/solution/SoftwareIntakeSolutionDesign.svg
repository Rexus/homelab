<svg xmlns="http://www.w3.org/2000/svg" data-view-id="VIEW-software-intake-placement" data-subject="SYS-intake" width="960" height="800" viewBox="0 0 960 942" role="img" aria-labelledby="title description">
  <title id="title">Software intake | Solution design</title>
  <desc id="description">Approved clients from Tier 0 and Tier 1 request the cache VIP from below Tier 2.
    The VIP routes proxy requests to Cache Services on external_edge. Cache Services request approved
    Internet sources or a configured upstream proxy to the left. Each cache instance uses its own virtual guest disk. Physical servers, storage devices and switches are external context.</desc>
