  <a href="software-intake/engineering.svg#REQ-egress" target="_top" aria-label="No bypass">
    <title>No bypass</title>
    <g data-model="REQ-egress" class="model-node" id="REQ-egress" data-category="intent" color="#42325d">
      <rect x="495" y="365" width="435" height="210" rx="3" fill="#f8fafc" stroke="#64748b" style=";fill:#eeeafa;stroke:#78639b;" />
      <text x="712.5" y="384" style="font:normal 12px Arial,sans-serif;text-anchor:middle;fill:#1f2937;stroke:none">«requirement»</text>
      <text x="712.5" y="407" style="font:bold 16px Arial,sans-serif;text-anchor:middle;fill:#1f2937;stroke:none">No bypass</text>
      <text x="509" y="431" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Quality / constraint · Subject: Update client.</text>
      <text x="509" y="449" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Independently enforce the accepted network egress</text>
      <text x="509" y="467" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">policy. Proxy configuration alone cannot deny bypass.</text>
    </g>
  </a>
