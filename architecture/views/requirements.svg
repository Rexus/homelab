  <text x="30" y="36" style="font:bold 24px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Homelab | Requirements</text>
  <text x="30" y="66" style="font:normal 14px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">System-relevant guardrails in the modeled intake slice; no complete system requirement set is claimed.</text>
  <a href="software-intake/engineering.svg#REQ-policy" target="_top" aria-label="Admitted sources">
    <title>Admitted sources</title>
    <g data-model="REQ-policy" class="model-node" id="REQ-policy" data-category="intent" color="#42325d">
      <rect x="30" y="120" width="435" height="210" rx="3" fill="#f8fafc" stroke="#64748b" style=";fill:#eeeafa;stroke:#78639b;" />
      <text x="247.5" y="139" style="font:normal 12px Arial,sans-serif;text-anchor:middle;fill:#1f2937;stroke:none">«requirement»</text>
      <text x="247.5" y="162" style="font:bold 16px Arial,sans-serif;text-anchor:middle;fill:#1f2937;stroke:none">Admitted sources</text>
      <text x="44" y="186" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Functional obligation · Subject: Policy proxy. Remote</text>
      <text x="44" y="204" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">access requires the accepted client, destination and</text>
      <text x="44" y="222" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">port policy; otherwise deny.</text>
    </g>
  </a>
  <a href="software-intake/tests.svg#REQ-policy" target="_top" aria-label="Verification cases">
    <title>Verification cases</title>
    <text x="45" y="350" style="font:normal 14px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Verification cases →</text>
  </a>
  <a href="software-intake/engineering.svg#REQ-integrity" target="_top" aria-label="Consumer verification">
    <title>Consumer verification</title>
    <g data-model="REQ-integrity" class="model-node" id="REQ-integrity" data-category="intent" color="#42325d">
      <rect x="495" y="120" width="435" height="210" rx="3" fill="#f8fafc" stroke="#64748b" style=";fill:#eeeafa;stroke:#78639b;" />
      <text x="712.5" y="139" style="font:normal 12px Arial,sans-serif;text-anchor:middle;fill:#1f2937;stroke:none">«requirement»</text>
      <text x="712.5" y="162" style="font:bold 16px Arial,sans-serif;text-anchor:middle;fill:#1f2937;stroke:none">Consumer verification</text>
      <text x="509" y="186" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Quality / constraint · Subject: Update client. Preserve</text>
      <text x="509" y="204" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">source TLS through CONNECT and consumer verification.</text>
      <text x="509" y="222" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Cache presence is not approval.</text>
    </g>
  </a>
  <a href="software-intake/tests.svg#REQ-integrity" target="_top" aria-label="Verification cases">
    <title>Verification cases</title>
    <text x="510" y="350" style="font:normal 14px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Verification cases →</text>
  </a>
  <a href="software-intake/engineering.svg#REQ-custody" target="_top" aria-label="Independent recovery">
    <title>Independent recovery</title>
    <g data-model="REQ-custody" class="model-node" id="REQ-custody" data-category="intent" color="#42325d">
      <rect x="30" y="365" width="435" height="210" rx="3" fill="#f8fafc" stroke="#64748b" style=";fill:#eeeafa;stroke:#78639b;" />
      <text x="247.5" y="384" style="font:normal 12px Arial,sans-serif;text-anchor:middle;fill:#1f2937;stroke:none">«requirement»</text>
      <text x="247.5" y="407" style="font:bold 16px Arial,sans-serif;text-anchor:middle;fill:#1f2937;stroke:none">Independent recovery</text>
      <text x="44" y="431" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Quality / constraint · Subject: Disposable cache.</text>
      <text x="44" y="449" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">Losing rebuildable cache data must not erase the</text>
      <text x="44" y="467" style="font:normal 13px Arial,sans-serif;text-anchor:start;fill:#1f2937;stroke:none">independently retained recovery supply.</text>
    </g>
  </a>
