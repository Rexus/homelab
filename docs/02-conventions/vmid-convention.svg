<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810"
     role="img" aria-labelledby="title description">
  <title id="title">Proxmox VMID naming convention</title>
  <desc id="description">T is the tier or allocation group, C is the category and NN is instance 00-99,
    including 00, giving all 100 slots per category. Guest VMID = 1000 × T + 100 × C + NN.
    Example 2203 is a Tier 2 Kubernetes worker, instance 03. T values 0-2 are the security tiers,
    3 is Lab, 4 is Clients, 5-8 are reserved and 9 is Templates. C0 is reserved across Tier 0,
    Tier 1, Tier 2, Lab and Clients. Categories are 1 Kubernetes control plane, 2 Kubernetes workers,
    3 Identity, trust and core services, 4 Network/Edge, 5 Observability/protected logging,
    6 Administration and automation
    and 7-9 Other/Reserved. Tier 0 has an implicit leading 0 and uses the same formula for every category.
    Tier 0 ranges are control planes 100–199, workers 200–299, identity/trust/core services 300–399,
    network services 400–499, logging 500–599 and administration/automation 600–699.
    Control-plane starters retain 101, 102 and 103. The issuer ca-1 uses 311 and bootstrap host boot-1 uses 601.
    Categories describe function, not importance or deployment order. Template IDs in 9xxx follow independent catalog allocations
    outside the guest role-category scheme.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #1f2937; font-size: 20px; }
    .heading { font-size: 30px; font-weight: 700; }
    .section { font-size: 24px; font-weight: 700; }
    .digit { font-family: Consolas, monospace; font-weight: 700; }
    .symbol { font-size: 40px; font-weight: 700; }
    .muted { fill: #475569; font-size: 18px; }
    .rule { stroke: #cbd5e1; stroke-width: 1; }
  </style>
  <rect width="1080" height="810" rx="16" fill="#f8fafc"/>
  <text x="32" y="46" class="heading">Proxmox VMID naming convention</text>

  <rect x="32" y="70" width="1016" height="212" rx="16" fill="#eef2f6" stroke="#64748b"/>
  <text x="540" y="103" text-anchor="middle" class="heading">T C NN</text>
  <text x="540" y="131" text-anchor="middle" class="muted">Guest VMID = 1000 × T + 100 × C + NN</text>
  <rect x="52" y="148" width="312" height="100" rx="12" fill="#e2f3ed" stroke="#397366"/>
  <rect x="384" y="148" width="312" height="100" rx="12" fill="#e7f0fc" stroke="#4d719b"/>
  <rect x="716" y="148" width="312" height="100" rx="12" fill="#eeeafa" stroke="#78639b"/>
  <g text-anchor="middle">
    <text x="208" y="188" class="symbol">T</text>
    <text x="208" y="215" font-weight="700">Tier</text>
    <text x="208" y="240" class="muted">Thousands</text>
    <text x="540" y="188" class="symbol">C</text>
    <text x="540" y="215" font-weight="700">Category</text>
    <text x="540" y="240" class="muted">Hundreds</text>
    <text x="872" y="188" class="symbol">NN</text>
    <text x="872" y="215" font-weight="700">Instance</text>
    <text x="872" y="240" class="muted">00–99</text>
    <text x="540" y="269" class="muted">2203 = Tier 2, Kubernetes worker, instance 03</text>
  </g>

  <text x="32" y="320" class="section">Tier (T)</text>
  <text x="556" y="320" class="section">Category (C)</text>
  <text x="32" y="354" font-weight="700">Digit</text>
  <text x="144" y="354" font-weight="700">Purpose</text>
  <text x="556" y="354" font-weight="700">Digit</text>
  <text x="668" y="354" font-weight="700">Purpose</text>
  <path class="rule" d="M32 368H520 M556 368H1048"/>

  <text x="32" y="394" class="digit">0</text><text x="144" y="394">Tier 0 — Core</text>
  <text x="556" y="394" class="digit">0</text><text x="668" y="394">Reserved</text>
  <path class="rule" d="M32 406H520 M556 406H1048"/>
  <text x="32" y="430" class="digit">1</text><text x="144" y="430">Tier 1 — Platform</text>
  <text x="556" y="430" class="digit">1</text><text x="668" y="430">Kubernetes control plane</text>
  <path class="rule" d="M32 442H520 M556 442H1048"/>
  <text x="32" y="466" class="digit">2</text><text x="144" y="466">Tier 2 — Applications</text>
  <text x="556" y="466" class="digit">2</text><text x="668" y="466">Kubernetes workers</text>
  <path class="rule" d="M32 478H520 M556 478H1048"/>
  <text x="32" y="502" class="digit">3</text><text x="144" y="502">Lab / Development</text>
  <text x="556" y="502" class="digit">3</text><text x="668" y="502">Identity, trust and core services</text>
  <path class="rule" d="M32 514H520 M556 514H1048"/>
  <text x="32" y="538" class="digit">4</text><text x="144" y="538">Clients</text>
  <text x="556" y="538" class="digit">4</text><text x="668" y="538">Network / Edge</text>
  <path class="rule" d="M32 550H520 M556 550H1048"/>
  <text x="32" y="574" class="digit">5–8</text><text x="144" y="574">Reserved</text>
  <text x="556" y="574" class="digit">5</text><text x="668" y="574">Observability / protected logging</text>
  <path class="rule" d="M32 586H520 M556 586H1048"/>
  <text x="32" y="610" class="digit">9</text><text x="144" y="610">Templates</text>
  <text x="556" y="610" class="digit">6</text><text x="668" y="610">Administration and automation</text>
  <path class="rule" d="M556 622H1048"/>
  <text x="556" y="646" class="digit">7–9</text><text x="668" y="646">Other / Reserved</text>

  <text x="32" y="687">NN 00–99 gives all 100 slots per category. C0 is reserved for T0, T1, T2, Lab and Clients.</text>
  <text x="32" y="720" class="muted">Tier 0 omits T. Control planes 100–199 · Workers 200–299 · Identity/trust/core 300–399</text>
  <text x="32" y="750" class="muted">Network 400–499 · Logging 500–599 · Administration 600–699 · ca-1 = 311 · boot-1 = 601</text>
  <text x="32" y="783" class="muted">3xxx / 4xxx are allocation groups. 9xxx follows an independent template catalog outside role categories.</text>
</svg>
