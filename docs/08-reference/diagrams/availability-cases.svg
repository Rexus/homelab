<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Migration, VM recovery and application failover</title>
  <desc id="description">Three independent left-to-right examples. A running VM migrates during planned maintenance. A failed host is fenced before the same VM cold-starts elsewhere. An application with independently running members redirects requests to a surviving member.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627581"/></marker>
    <style>
      svg { font: 20px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .fault { fill: #fce8e6; stroke: #a3453d; color: #652c28; }
      .boundary { fill: #eef2f6; stroke: #64748b; color: #1f2937; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .services { fill: #e7f0fc; stroke: #4d719b; color: #203a5b; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .action { fill: #fcebdc; stroke: #a16c43; color: #5b3921; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .traffic { fill: #303841; stroke: #8a9baa; color: #ffffff; }
      .actor, .fault, .boundary, .runtime, .services, .action, .data, .traffic { stroke-dasharray: none; }
      .link { fill: none; stroke: #627581; stroke-width: 2; marker-end: url(#arrow); stroke-dasharray: none; }
      .detail { font-size: 18px; }
      .heading { font-size: 22px; font-weight: bold; }
      .copy { fill: none; stroke: #4d719b; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .failure { fill: none; stroke: #a3453d; stroke-width: 3; stroke-dasharray: none; }
    </style>
  </defs>
<g id="migration" class="group" data-case="migration"><rect x="10" y="15" width="1180" height="275"/>
<text x="600" y="42" class="heading">Planned live migration</text>
<g id="migration-0" class="boundary" data-phase="0"><rect x="25" y="58" width="360" height="217"/>
<text x="205" y="82" class="">1. Running on Host A</text>
<g class="runtime"><rect x="45" y="105" width="140" height="105"/>
<text x="115" y="128" class="">Host A</text>
<g class="services"><rect x="60" y="145" width="110" height="45"/>
<text x="115.0" y="172.5" class="">VM</text>
</g>
</g>
<g class="runtime"><rect x="225" y="105" width="140" height="105"/>
<text x="295" y="128" class="">Host B</text>
</g>
<text x="205" y="247" class="detail">No application replica created</text>
</g>
<g id="migration-1" class="boundary" data-phase="1"><rect x="420" y="58" width="360" height="217"/>
<text x="600" y="82" class="">2. Copy while source runs</text>
<g class="runtime"><rect x="440" y="105" width="140" height="105"/>
<text x="510" y="128" class="">Host A</text>
<g class="services"><rect x="455" y="145" width="110" height="45"/>
<text x="510.0" y="172.5" class="">VM</text>
</g>
</g>
<g class="runtime"><rect x="620" y="105" width="140" height="105"/>
<text x="690" y="128" class="">Host B</text>
<g class="services"><rect x="635" y="145" width="110" height="45"/>
<text x="690.0" y="172.5" class="">Incoming</text>
</g>
<rect class="copy" x="635" y="145" width="110" height="45"/>
</g>
<path class="link" d="M510 210 L510 230 L690 230 L690 191"/>
<text x="600" y="251" class="detail">Memory / execution state</text>
</g>
<g id="migration-2" class="boundary" data-phase="2"><rect x="815" y="58" width="360" height="217"/>
<text x="995" y="82" class="">3. Same VM on Host B</text>
<g class="runtime"><rect x="835" y="105" width="140" height="105"/>
<text x="905" y="128" class="">Host A</text>
</g>
<g class="runtime"><rect x="1015" y="105" width="140" height="105"/>
<text x="1085" y="128" class="">Host B</text>
<g class="services"><rect x="1030" y="145" width="110" height="45"/>
<text x="1085.0" y="172.5" class="">VM</text>
</g>
</g>
<text x="995" y="247" class="detail">No application replica created</text>
</g>
</g>
<g id="restart" class="group" data-case="restart"><rect x="10" y="305" width="1180" height="275"/>
<text x="600" y="332" class="heading">Automatic VM restart / Proxmox HA</text>
<g id="restart-0" class="boundary" data-phase="0"><rect x="25" y="348" width="360" height="217"/>
<text x="205" y="372" class="">1. One running VM</text>
<g class="runtime"><rect x="45" y="395" width="140" height="105"/>
<text x="115" y="418" class="">Host A</text>
<g class="services"><rect x="60" y="435" width="110" height="45"/>
<text x="115.0" y="462.5" class="">VM</text>
</g>
</g>
<g class="runtime"><rect x="225" y="395" width="140" height="105"/>
<text x="295" y="418" class="">Host B</text>
</g>
<g class="data"><rect x="75" y="517" width="260" height="30"/>
<text x="205.0" y="537.0" class="detail">Accessible persistent disks</text>
</g>
</g>
<g id="restart-1" class="boundary" data-phase="1"><rect x="420" y="348" width="360" height="217"/>
<text x="600" y="372" class="">2. Fence before recovery</text>
<g class="fault"><rect x="440" y="395" width="140" height="105"/>
<text x="510" y="418" class="">Host A</text>
<g class="actor"><rect x="455" y="435" width="110" height="45"/>
<text x="510.0" y="462.5" class="">VM</text>
</g>
<path class="failure" d="M445 426 L575 493 M575 426 L445 493"/>
</g>
<g class="runtime"><rect x="620" y="395" width="140" height="105"/>
<text x="690" y="418" class="">Host B</text>
</g>
<g class="data"><rect x="470" y="517" width="260" height="30"/>
<text x="600.0" y="537.0" class="detail">Accessible persistent disks</text>
</g>
</g>
<g id="restart-2" class="boundary" data-phase="2"><rect x="815" y="348" width="360" height="217"/>
<text x="995" y="372" class="">3. Cold-start on survivor</text>
<g class="fault"><rect x="835" y="395" width="140" height="105"/>
<text x="905" y="418" class="">Host A</text>
<path class="failure" d="M840 426 L970 493 M970 426 L840 493"/>
</g>
<g class="runtime"><rect x="1015" y="395" width="140" height="105"/>
<text x="1085" y="418" class="">Host B</text>
<g class="services"><rect x="1030" y="435" width="110" height="45"/>
<text x="1085.0" y="462.5" class="">VM</text>
</g>
</g>
<g class="data"><rect x="865" y="517" width="260" height="30"/>
<text x="995.0" y="537.0" class="detail">Accessible persistent disks</text>
</g>
</g>
</g>
<g id="application" class="group" data-case="application"><rect x="10" y="595" width="1180" height="275"/>
<text x="600" y="622" class="heading">Application failover</text>
<g id="application-0" class="boundary" data-phase="0"><rect x="25" y="638" width="360" height="217"/>
<text x="205" y="662" class="">1. Independent running members</text>
<g class="traffic"><rect x="114" y="677" width="182" height="32"/>
<text x="205.0" y="698.0" class="">Service endpoint</text>
</g>
<g class="runtime"><rect x="45" y="724" width="140" height="105"/>
<text x="115" y="747" class="">Host A</text>
<g class="services"><rect x="60" y="764" width="110" height="45"/>
<text x="115.0" y="791.5" class="">Member A</text>
</g>
</g>
<g class="runtime"><rect x="225" y="724" width="140" height="105"/>
<text x="295" y="747" class="">Host B</text>
<g class="services"><rect x="240" y="764" width="110" height="45"/>
<text x="295.0" y="791.5" class="">Member B</text>
</g>
</g>
<path class="link" d="M205 709 L205 786 L170 786"/>
</g>
<g id="application-1" class="boundary" data-phase="1"><rect x="420" y="638" width="360" height="217"/>
<text x="600" y="662" class="">2. Member A is unavailable</text>
<g class="traffic"><rect x="509" y="677" width="182" height="32"/>
<text x="600.0" y="698.0" class="">Service endpoint</text>
</g>
<g class="fault"><rect x="440" y="724" width="140" height="105"/>
<text x="510" y="747" class="">Host A</text>
<g class="actor"><rect x="455" y="764" width="110" height="45"/>
<text x="510.0" y="791.5" class="">Member A</text>
</g>
<path class="failure" d="M445 755 L575 822 M575 755 L445 822"/>
</g>
<g class="runtime"><rect x="620" y="724" width="140" height="105"/>
<text x="690" y="747" class="">Host B</text>
<g class="services"><rect x="635" y="764" width="110" height="45"/>
<text x="690.0" y="791.5" class="">Member B</text>
</g>
</g>
</g>
<g id="application-2" class="boundary" data-phase="2"><rect x="815" y="638" width="360" height="217"/>
<text x="995" y="662" class="">3. Requests reach member B</text>
<g class="traffic"><rect x="904" y="677" width="182" height="32"/>
<text x="995.0" y="698.0" class="">Service endpoint</text>
</g>
<g class="fault"><rect x="835" y="724" width="140" height="105"/>
<text x="905" y="747" class="">Host A</text>
<g class="actor"><rect x="850" y="764" width="110" height="45"/>
<text x="905.0" y="791.5" class="">Member A</text>
</g>
<path class="failure" d="M840 755 L970 822 M970 755 L840 822"/>
</g>
<g class="runtime"><rect x="1015" y="724" width="140" height="105"/>
<text x="1085" y="747" class="">Host B</text>
<g class="services"><rect x="1030" y="764" width="110" height="45"/>
<text x="1085.0" y="791.5" class="">Member B</text>
</g>
</g>
<path class="link" d="M995 709 L995 786 L1050 786"/>
</g>
</g>
</svg>
