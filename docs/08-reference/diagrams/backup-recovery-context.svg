<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Independent copies and authorized recovery</title>
  <desc id="description">A protected service sends a compatible backup set to independently retained copies on the right. An operator authorizes an isolated restore using a selected copy and separately held keys and tools below.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .services { fill: #e7f0fc; stroke: #4d719b; color: #203a5b; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .data, .services, .actor, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="Copies" class="group">
    <rect x="670" y="60" width="260" height="465"/>
    <text x="800" y="87">Independent Retained Copies</text>
    <g id="Backup" class="data">
      <path d="M690 135 C690 113 910 113 910 135 L910 200 C910 222 690 222 690 200 Z"/>
      <path d="M690 135 C690 157 910 157 910 135" fill="none"/>
      <text x="800" y="183">Independent backup</text>
    </g>
    <g id="Offsite" class="data">
      <path d="M690 340 C690 318 910 318 910 340 L910 405 C910 427 690 427 690 405 Z"/>
      <path d="M690 340 C690 362 910 362 910 340" fill="none"/>
      <text x="800" y="379">Offsite recovery</text>
      <text x="800" y="401">copy</text>
    </g>
    <path class="connection" data-from="Backup" data-to="Offsite" d="M800 216 L800 323"/>
    <text x="849" y="272" class="edge-label">Copy</text>
  </g>
  <g id="Source" class="services">
    <rect x="260" y="100" width="230" height="90"/>
    <text x="375" y="135">Protected service</text>
    <text x="375" y="159">Data and configuration</text>
  </g>
  <g id="Target" class="services">
    <rect x="260" y="380" width="230" height="110"/>
    <text x="375" y="427">Isolated recovery</text>
    <text x="375" y="451">target</text>
  </g>
  <g id="Operator" class="actor">
    <rect x="20" y="385" width="180" height="100"/>
    <text x="110" y="428">Recovery</text>
    <text x="110" y="452">operator</text>
  </g>
  <g id="Custody" class="custody">
    <rect x="260" y="600" width="670" height="85"/>
    <text x="595" y="635">Independent custody</text>
    <text x="595" y="659">Keys, credentials and tools</text>
  </g>
  <path class="connection" data-from="Source" data-to="Backup" d="M490 145 L690 145"/>
  <rect x="535" y="111" width="112" height="26" fill="#f8fafc" stroke="none"/>
  <text x="591" y="129" class="edge-label">Backup set</text>
  <path class="connection" data-from="Backup" data-to="Target" d="M690 175 L560 175 L560 410 L490 410"/>
  <rect x="501" y="277" width="119" height="26" fill="#f8fafc" stroke="none"/>
  <text x="560" y="295" class="edge-label">Recovery set</text>
  <path class="connection" data-from="Offsite" data-to="Target" d="M690 375 L610 375 L610 460 L490 460"/>
  <rect x="615" y="435" width="96" height="24" fill="#f8fafc" stroke="none"/>
  <text x="663" y="451" class="edge-label">If required</text>
  <path class="connection" data-from="Operator" data-to="Target" d="M200 435 L260 435"/>
  <rect x="176" y="348" width="123" height="25" fill="#f8fafc" stroke="none"/>
  <text x="237" y="365" class="edge-label">Authorize restore</text>
  <path class="connection" data-from="Custody" data-to="Target" d="M375 600 L375 490"
        style="stroke-dasharray:4 3"/>
  <rect x="394" y="536" width="130" height="25" fill="#f8fafc" stroke="none"/>
  <text x="459" y="553" class="edge-label">Recovery access</text>
</svg>
