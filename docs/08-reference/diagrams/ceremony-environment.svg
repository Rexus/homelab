<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Ceremony environments and retained custody</title>
  <desc id="description">Tier 0 connected boot-1 provisions the cbuild-1 image builder, which
    stages a public live image and an ORCA kit.
    The on-demand cadm-1 environment administers the selected USB HSM and keeps recovery material
    independently. Verified public tools are transferred to a separate offline ORCA runtime.
    ORCA uses original encrypted root state and writes public results and an encrypted backup
    to separate physical media. No network link connects ORCA to the stager or device host.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .tier0, .runtime, .control, .data, .custody, .actor { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .transfer { stroke-dasharray: 4 4; }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="230" y="20" width="710" height="680"/>
    <text x="585" y="45">Tier 0</text>
    <g id="Preparation" class="group">
      <rect x="250" y="70" width="250" height="275"/>
      <text x="375" y="95">Connected Preparation</text>
      <g id="Stager" class="runtime">
        <rect x="270" y="115" width="210" height="50"/>
        <text x="375" y="136">boot-1</text>
        <text x="375" y="157">Stage / deploy</text>
      </g>
      <g id="Builder" class="runtime">
        <rect x="270" y="195" width="210" height="50"/>
        <text x="375" y="216">cbuild-1</text>
        <text x="375" y="237">Public image builder</text>
      </g>
      <g id="Tools" class="data">
        <path d="M270 295 C270 278 480 278 480 295 L480 319 C480 336 270 336 270 319 Z"/>
        <path d="M270 295 C270 312 480 312 480 295" fill="none"/>
        <text x="375" y="321">Live image / ORCA kit</text>
      </g>
      <path class="connection" data-from="Stager" data-to="Builder" d="M375 165 V195"/>
      <text x="412" y="185" class="edge-label">IaC</text>
      <path class="connection" data-from="Builder" data-to="Tools" d="M375 245 V282"/>
      <text x="412" y="270" class="edge-label">Build</text>
    </g>
    <g id="Administration" class="group">
      <rect x="540" y="70" width="380" height="275"/>
      <text x="730" y="95">Ceremony Administration</text>
      <g id="Ceremony" class="runtime">
        <rect x="560" y="115" width="150" height="65"/>
        <text x="635" y="141">cadm-1</text>
        <text x="635" y="163">On-demand runtime</text>
      </g>
      <g id="Device" class="control">
        <rect x="775" y="115" width="125" height="65"/>
        <text x="837" y="141">Selected</text>
        <text x="837" y="163">USB HSM</text>
      </g>
      <g id="DeviceRecovery" class="custody">
        <rect x="560" y="225" width="340" height="60"/>
        <text x="730" y="251">Independent Device Recovery</text>
        <text x="730" y="273">Wrapped objects / separate secrets</text>
      </g>
      <path class="connection" data-from="Ceremony" data-to="Device" d="M710 147 H775"/>
      <text x="742" y="133" class="edge-label">USB</text>
      <path class="connection transfer" data-from="Device" data-to="DeviceRecovery" d="M837 180 V225"/>
      <text x="750" y="208" class="edge-label">Wrapped backup</text>
    </g>
    <path class="connection transfer" data-from="Tools" data-to="Ceremony" d="M480 312 H520 V147 H560"/>
    <g id="Offline" class="custody">
      <rect x="250" y="440" width="670" height="240"/>
      <text x="585" y="465">Offline Root Custody</text>
      <g id="Root" class="custody">
        <rect x="270" y="485" width="220" height="60"/>
        <text x="380" y="509">ORCA</text>
        <text x="380" y="531">Separate live runtime</text>
      </g>
      <g id="Transfer" class="data">
        <path d="M600 499 C600 482 900 482 900 499 L900 523 C900 540 600 540 600 523 Z"/>
        <path d="M600 499 C600 516 900 516 900 499" fill="none"/>
        <text x="750" y="525">Public transfer media</text>
      </g>
      <g id="Work" class="data">
        <path d="M270 579 C270 562 490 562 490 579 L490 623 C490 640 270 640 270 623 Z"/>
        <path d="M270 579 C270 596 490 596 490 579" fill="none"/>
        <text x="380" y="606">Encrypted root state</text>
        <text x="380" y="628">Original CA history</text>
      </g>
      <g id="Backup" class="data">
        <path d="M600 579 C600 562 900 562 900 579 L900 623 C900 640 600 640 600 623 Z"/>
        <path d="M600 579 C600 596 900 596 900 579" fill="none"/>
        <text x="750" y="606">Independent backup media</text>
        <text x="750" y="628">Encrypted complete CA archive</text>
      </g>
      <path class="connection" data-from="Root" data-to="Work" d="M380 545 V566"/>
      <text x="438" y="562" class="edge-label">Retain state</text>
      <path class="connection transfer" data-from="Root" data-to="Transfer" d="M490 515 H600"/>
      <text x="545" y="497" class="edge-label">Public results</text>
      <path class="connection transfer" data-from="Work" data-to="Backup" d="M490 606 H600"/>
      <text x="545" y="590" class="edge-label">age backup</text>
      <text x="585" y="662">Root passphrase and recovery identity held separately</text>
    </g>
    <path class="connection transfer" data-from="Tools" data-to="Root" d="M375 332 V485"/>
    <text x="448" y="395" class="edge-label">Verified kit / media</text>
  </g>
  <g id="Sources" class="actor">
    <rect x="20" y="115" width="175" height="65"/>
    <text x="107" y="141">Approved</text>
    <text x="107" y="163">public sources</text>
  </g>
  <path class="connection" data-from="Stager" data-to="Sources" d="M270 147 H195"/>
  <rect x="210" y="117" width="40" height="21" fill="#f8fafc" stroke="none"/>
  <text x="230" y="133" class="edge-label">Fetch</text>
</svg>
