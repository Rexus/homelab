<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Disposable ceremony runtime and retained identity</title>
  <desc id="description">Read the phases from left to right. Bootstrap orchestrates a connected
    public-image builder. Its accepted ISO boots separate cadm-1 or orca-1 RAM sessions with
    public tools and no persistent OS disk or NIC. Device administration uses the selected USB
    HSM, while the current software root opens its original encrypted working disk. Shutdown
    discards the live RAM overlay, not the original root key, CA history or HSM objects.
    A later accepted OS image reopens that same state without creating a new CA key.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .action { fill: #fcebdc; stroke: #a16c43; color: #5b3921; }
      .runtime, .control, .data, .custody, .action { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .transfer { stroke-dasharray: 4 4; }
      .edge-label { fill: #1f2937; font-size: 13px; }
      .detail { font-size: 13px; }
    </style>
  </defs>
  <g id="Build" class="group">
    <rect x="20" y="20" width="270" height="315"/>
    <text x="155" y="45">1 · Prepare public tools</text>
    <g id="Stager" class="runtime">
      <rect x="40" y="65" width="230" height="45"/>
      <text x="155" y="92">boot-1 / IaC</text>
    </g>
    <g id="Builder" class="runtime">
      <rect x="40" y="145" width="230" height="45"/>
      <text x="155" y="172">cbuild-1 / image build</text>
    </g>
    <g id="ISO" class="data">
      <path d="M40 244 C40 227 270 227 270 244 L270 307 C270 324 40 324 40 307 Z"/>
      <path d="M40 244 C40 261 270 261 270 244" fill="none"/>
      <text x="155" y="275">Accepted live ISO</text>
      <text x="155" y="296" class="detail">OS / tools / public ORCA kit</text>
      <text x="155" y="315" class="detail">No signing state or secrets</text>
    </g>
    <path class="connection" data-from="Stager" data-to="Builder" d="M155 110 V145"/>
    <text x="202" y="133" class="edge-label">Provision</text>
    <path class="connection" data-from="Builder" data-to="ISO" d="M155 190 V231"/>
    <text x="200" y="218" class="edge-label">Build</text>
  </g>
  <g id="Sessions" class="group">
    <rect x="345" y="20" width="270" height="315"/>
    <text x="480" y="45">2 · Boot a separate session</text>
    <g id="Administration" class="runtime">
      <rect x="365" y="80" width="230" height="65"/>
      <text x="480" y="106">cadm-1</text>
      <text x="480" y="128">HSM administration</text>
    </g>
    <text x="480" y="178">OR</text>
    <g id="Root" class="custody">
      <rect x="365" y="210" width="230" height="65"/>
      <text x="480" y="236">orca-1 / physical ORCA</text>
      <text x="480" y="258">Root ceremony</text>
    </g>
    <text x="480" y="304" class="detail">Public tools loaded · writable RAM</text>
    <text x="480" y="323" class="detail">No persistent OS disk · NIC-less VM</text>
  </g>
  <path class="connection transfer" data-from="ISO" data-to="Sessions" d="M270 280 H310 V60 H345"/>
  <rect x="277" y="213" width="34" height="23" fill="#f8fafc" stroke="none"/>
  <text x="294" y="230" class="edge-label">Boot</text>
  <g id="Closure" class="group">
    <rect x="670" y="20" width="270" height="315"/>
    <text x="805" y="45">3 · Close and replace</text>
    <g id="Shutdown" class="action">
      <rect x="690" y="80" width="230" height="65"/>
      <text x="805" y="106">Finish / back up / detach</text>
      <text x="805" y="128">Shut down</text>
    </g>
    <g id="RAM" class="action">
      <rect x="690" y="190" width="230" height="55"/>
      <text x="805" y="214">RAM overlay discarded</text>
      <text x="805" y="236" class="detail">No automatic new CA key</text>
    </g>
    <g id="NextImage" class="data">
      <rect x="690" y="280" width="230" height="40"/>
      <text x="805" y="305">Next visit: accepted ISO</text>
    </g>
    <path class="connection" data-from="Shutdown" data-to="RAM" d="M805 145 V190"/>
  </g>
  <path class="connection" data-from="Administration" data-to="Shutdown" d="M595 112 H690"/>
  <path class="connection" data-from="Root" data-to="Shutdown" d="M595 242 H645 V112 H690"/>
  <g id="Retained" class="custody">
    <rect x="20" y="430" width="920" height="270"/>
    <text x="480" y="455">Retained Custody</text>
    <g id="HSM" class="control">
      <rect x="60" y="500" width="330" height="105"/>
      <text x="225" y="530">Selected USB HSM</text>
      <text x="225" y="555">Original hardware objects</text>
      <text x="225" y="580" class="detail">Issuer/application device · not the software root</text>
    </g>
    <g id="Work" class="data">
      <path d="M530 516 C530 497 900 497 900 516 L900 590 C900 609 530 609 530 590 Z"/>
      <path d="M530 516 C530 535 900 535 900 516" fill="none"/>
      <text x="715" y="551">Original encrypted working disk</text>
      <text x="715" y="576">Root key / CA database / serials / CRL history</text>
      <text x="715" y="599" class="detail">Reopen the same state with the next accepted image</text>
    </g>
    <text x="480" y="651">Shutdown changes RAM, not the CA identity or HSM objects.</text>
    <text x="480" y="678" class="detail">Keep transfer media, encrypted backups and recovery credentials in independent custody.</text>
  </g>
  <path class="connection" data-from="Administration" data-to="HSM" d="M365 125 H325 V410 H225 V500"/>
  <rect x="119" y="470" width="212" height="22" fill="#fff2d1" stroke="none"/>
  <text x="225" y="486" class="edge-label">Manage selected device</text>
  <path class="connection" data-from="Root" data-to="Work" d="M595 258 H630 V390 H715 V500"/>
  <rect x="584" y="470" width="262" height="22" fill="#fff2d1" stroke="none"/>
  <text x="715" y="486" class="edge-label">Attach / unlock original disk</text>
  <rect x="38" y="357" width="884" height="24" fill="#f8fafc" stroke="none"/>
  <text x="480" y="374" class="edge-label">Same ISO: native OpenSC / PicoHSM tools · YubiHSM SDK only when explicitly selected</text>
</svg>
