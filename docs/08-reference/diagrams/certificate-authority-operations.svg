<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Issuer interfaces and independent certificate custody</title>
  <desc id="description">The issuer and directory networks remain separate inside Tier 0. Apache exposes a controlled HTTPS portal and public certificate/CRL downloads, with original issuer state below the engine. Offline root and the independent recovery kit remain outside connected runtimes at the bottom.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .replicas { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .traffic { fill: #303841; stroke: #8a9baa; color: #ffffff; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .tier0, .network, .runtime, .traffic, .control, .data, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="20" y="20" width="920" height="680"/>
    <text x="480" y="45">Tier 0</text>
    <g id="Online" class="group">
      <rect x="40" y="65" width="880" height="445"/>
      <text x="480" y="91">CA Services</text>
      <g id="Identity" class="network">
        <rect x="55" y="110" width="280" height="380"/>
        <text x="195" y="136">Identity Network / identity</text>
        <g id="IPA" class="replicas">
          <rect x="70" y="155" width="250" height="315"/>
          <text x="195" y="182">Directory Services</text>
          <g id="I1" class="control"><rect x="95" y="225" width="200" height="70"/>
            <text x="195" y="265">idm-1</text></g>
          <g id="I2" class="control"><rect x="95" y="355" width="200" height="70"/>
            <text x="195" y="395">idm-2</text></g>
        </g>
      </g>
      <g id="Crypto" class="network">
        <rect x="355" y="110" width="550" height="380"/>
        <text x="630" y="136">Cryptography Network / cryptography</text>
        <g id="Issuer" class="runtime">
          <rect x="375" y="155" width="510" height="315"/>
          <text x="630" y="181">ca-1 / issuer VM</text>
          <g id="Portal" class="traffic"><polygon points="405,210 555,210 570,240 555,270 405,270 390,240"/>
            <text x="480" y="235">Apache HTTPS</text><text x="480" y="257">portal</text></g>
          <g id="Downloads" class="traffic"><polygon points="405,335 555,335 570,365 555,395 405,395 390,365"/>
            <text x="480" y="360">HTTP(S)</text><text x="480" y="383">/download/</text></g>
          <g id="Engine" class="control"><rect x="675" y="210" width="190" height="75"/>
            <text x="770" y="230">OpenXPKI</text><text x="770" y="252">Approved workflows</text>
            <text x="770" y="274">Native CRL timer</text></g>
          <g id="State" class="data">
            <path d="M665 366 C665 345 865 345 865 366 L865 433 C865 454 665 454 665 433 Z"/>
            <path d="M665 366 C665 387 865 387 865 366" fill="none"/>
            <text x="765" y="401">scsi1 / original state</text>
            <text x="765" y="423">DB / key / config / history</text>
          </g>
          <path class="connection" data-from="Portal" data-to="Engine" d="M570 240 L675 240"/>
          <text x="623" y="210" class="edge-label">Authorized</text>
          <text x="623" y="228" class="edge-label">workflow</text>
          <path class="connection" data-from="Engine" data-to="State" d="M770 285 L770 350"/>
          <text x="818" y="308" class="edge-label">Persist /</text>
          <text x="818" y="327" class="edge-label">publish</text>
          <path class="connection" data-from="Downloads" data-to="State" d="M570 365 L625 365 L625 407 L665 407"/>
          <text x="614" y="317" class="edge-label">Read public</text>
          <text x="614" y="335" class="edge-label">certs / CRLs</text>
        </g>
      </g>
    </g>
    <g id="Offline" class="custody">
      <rect x="40" y="550" width="880" height="130"/>
      <text x="480" y="578">Offline Custody</text>
      <g id="Root" class="custody"><rect x="60" y="600" width="255" height="60"/>
        <text x="187" y="626">clca / offline root</text>
        <text x="187" y="649">Subordinate signing / root CRLs</text></g>
      <g id="Kit" class="custody"><rect x="340" y="600" width="560" height="60"/>
        <text x="620" y="626">Independent original-state recovery kit</text>
        <text x="620" y="649">Keys / DataVault secret / backup binding</text></g>
    </g>
  </g>
</svg>
