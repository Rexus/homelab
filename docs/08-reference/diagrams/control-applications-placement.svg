<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Secrets and operator tools in the accepted control platform</title>
  <desc id="description">The new Control Applications group contains Vault, NetBox, Headlamp and their selected data services. Existing Keycloak and foundation services remain separate. Four network attachments stay distinct. The LDAPS dependency and NetBox database access reach their actual services.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .kubernetes { fill: #e8eef6; stroke: #6b83a3; color: #263d59; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .control, .data, .kubernetes, .network, .tier0 { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
<g id="T0" class="tier0">
<rect x="20" y="20" width="920" height="680"/>
<text x="480.0" y="44">Tier 0</text>
<g id="ControlNetwork" class="network">
<rect x="40" y="65" width="565" height="615"/>
<text x="322.5" y="89">Control Cluster Network / control_cluster</text>
<g id="Cluster" class="kubernetes">
<rect x="55" y="110" width="535" height="550"/>
<text x="322.5" y="134">Tier 0 Kubernetes</text>
<g id="Base" class="control"><rect x="75" y="165" width="225" height="60"/>
<text x="187.5" y="200.0">Existing platform services</text>
</g>
<g id="IdPNamespace" class="group">
<rect x="325" y="150" width="245" height="100"/>
<text x="447.5" y="174">IdP Namespace / keycloak</text>
<g id="Keycloak" class="control"><rect x="340" y="193" width="215" height="42"/>
<text x="447.5" y="219.0">Existing Keycloak / IdP</text>
</g>
</g>
<g id="Added" class="group">
<rect x="75" y="275" width="495" height="355"/>
<text x="322.5" y="299">Control Applications</text>
<g id="Vault" class="control"><rect x="95" y="320" width="215" height="110"/>
<text x="202.5" y="370.0">vault x3</text>
<text x="202.5" y="390.0">Raft / audit PVCs</text>
</g>
<g id="Ops" class="control"><rect x="335" y="320" width="215" height="110"/>
<text x="442.5" y="370.0">netbox web x1 / worker x1</text>
<text x="442.5" y="390.0">headlamp x1</text>
</g>
<g id="Cache" class="control"><rect x="95" y="495" width="215" height="75"/>
<text x="202.5" y="537.5">netbox-cache x1</text>
</g>
<g id="DB" class="data"><path d="M335 505 C335 492 550 492 550 505 L550 575 C550 588 335 588 335 575 Z"/><path d="M335 505 C335 518 550 518 550 505" fill="none"/>
<text x="442.5" y="537.0">netbox-db x3</text>
<text x="442.5" y="557.0">Live block PVCs</text>
</g>
<path class="connection" data-from="Ops" data-to="DB" d="M442 430 L442 495"/><rect x="457.0" y="450" width="64" height="23" fill="#f8fafc" stroke="none"/>
<text x="489" y="465" class="edge-label">DB TLS</text>
</g>
</g>
</g>
<g id="Existing" class="group">
<rect x="625" y="65" width="295" height="615"/>
<text x="772.5" y="89">Control Services</text>
<g id="IdentityNetwork" class="network">
<rect x="640" y="120" width="265" height="145"/>
<text x="772.5" y="144">Identity Network / identity</text>
<g id="Identity" class="control"><rect x="655" y="175" width="235" height="65"/>
<text x="772.5" y="202.5">idm-1 / idm-2</text>
<text x="772.5" y="222.5">FreeIPA pair</text>
</g>
</g>
<g id="ManagementNetwork" class="network">
<rect x="640" y="310" width="265" height="145"/>
<text x="772.5" y="334">Management Network / management</text>
<g id="Log" class="control"><rect x="655" y="365" width="235" height="65"/>
<text x="772.5" y="402.5">log-1 / protected intake</text>
</g>
</g>
<g id="CryptoNetwork" class="network">
<rect x="640" y="500" width="265" height="145"/>
<text x="772.5" y="524">Cryptography Network</text>
<text x="772.5" y="542">cryptography</text>
<g id="Issuer" class="control"><rect x="655" y="555" width="235" height="65"/>
<text x="772.5" y="592.5">ca-1 / issuer</text>
</g>
</g>
</g>
<path class="connection" data-from="Keycloak" data-to="Identity" d="M555 214 L655 214"/><rect x="562.0" y="179" width="88" height="23" fill="#f8fafc" stroke="none"/>
<text x="606" y="194" class="edge-label">Verified LDAPS</text>
</g>
</svg>
