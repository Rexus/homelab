<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Software-backed trust and secret services</title>
  <desc id="description">Tier 0 contains separate control-cluster, identity and cryptography networks. Three Vault members have per-member data and audit persistence; two directory members and the software issuer retain dedicated runtimes. Offline root and recovery custody remain below.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .kubernetes { fill: #e8eef6; stroke: #6b83a3; color: #263d59; }
      .replicas { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .tier0, .network, .kubernetes, .runtime, .control, .data, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="20" y="20" width="920" height="680"/>
    <text x="480" y="45">Tier 0</text>
    <g id="Online" class="group">
      <rect x="40" y="65" width="880" height="470"/>
      <text x="480" y="91">Control Services</text>
      <g id="ControlNetwork" class="network">
        <rect x="55" y="110" width="280" height="405"/>
        <text x="195" y="134">Control Cluster Network / control_cluster</text>
        <g id="Cluster" class="kubernetes">
          <rect x="70" y="155" width="250" height="340"/>
          <text x="195" y="180">Tier 0 Kubernetes</text>
          <g id="Vault" class="replicas">
            <rect x="85" y="200" width="220" height="275"/>
            <text x="195" y="225">Vault Raft</text>
            <g id="V0" class="control">
              <rect x="105" y="245" width="180" height="55"/>
              <text x="195" y="267">vault-0</text><text x="195" y="289">Data / audit PVCs</text>
            </g>
            <g id="V1" class="control">
              <rect x="105" y="320" width="180" height="55"/>
              <text x="195" y="342">vault-1</text><text x="195" y="364">Data / audit PVCs</text>
            </g>
            <g id="V2" class="control">
              <rect x="105" y="395" width="180" height="55"/>
              <text x="195" y="417">vault-2</text><text x="195" y="439">Data / audit PVCs</text>
            </g>
          </g>
        </g>
      </g>
      <g id="Directory" class="network">
        <rect x="355" y="110" width="235" height="405"/>
        <text x="472" y="134">Identity Network / identity</text>
        <g id="IPA" class="replicas">
          <rect x="370" y="155" width="205" height="340"/>
          <text x="472" y="180">Directory Services</text>
          <g id="I1" class="control"><rect x="390" y="245" width="165" height="70"/>
            <text x="472" y="285">idm-1</text></g>
          <g id="I2" class="control"><rect x="390" y="365" width="165" height="70"/>
            <text x="472" y="405">idm-2</text></g>
        </g>
      </g>
      <g id="Crypto" class="network">
        <rect x="610" y="110" width="295" height="405"/>
        <text x="757" y="134">Cryptography Network / cryptography</text>
        <g id="Issuer" class="runtime">
          <rect x="625" y="155" width="265" height="340"/>
          <text x="757" y="180">ca-1 / issuer VM</text>
          <g id="CA" class="control"><rect x="650" y="215" width="215" height="75"/>
            <text x="757" y="240">OpenXPKI</text><text x="757" y="263">Portal / publication</text></g>
          <g id="State" class="data">
            <path d="M650 370 C650 350 865 350 865 370 L865 445 C865 465 650 465 650 445 Z"/>
            <path d="M650 370 C650 390 865 390 865 370" fill="none"/>
            <text x="757" y="406">scsi1 / issuer state</text>
            <text x="757" y="430">Database / software key / config</text>
          </g>
          <path class="connection" data-from="CA" data-to="State" d="M757 290 L757 355"/>
          <text x="799" y="326" class="edge-label">Persist</text>
        </g>
      </g>
    </g>
    <g id="Offline" class="custody">
      <rect x="40" y="565" width="880" height="115"/>
      <text x="480" y="590">Offline Custody</text>
      <g id="Root" class="custody"><rect x="60" y="607" width="255" height="55"/>
        <text x="187" y="640">clca / offline root</text></g>
      <g id="Recovery" class="custody"><rect x="340" y="607" width="560" height="55"/>
        <text x="620" y="629">Original CA recovery material</text>
        <text x="620" y="652">Vault unseal shares / recovery keys</text></g>
    </g>
  </g>
</svg>
