<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Guest ownership on a common hosting foundation</title>
  <desc id="description">Dedicated VMs and VM-backed Kubernetes share Proxmox capacity. Tier 2 sits above Tier 1 and Tier 0, while the foundational host aggregate sits to their right. Each Kubernetes runtime is contained by its tier-owned node-VM set. No physical failure-domain allocation is implied.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .kubernetes { fill: #e8eef6; stroke: #6b83a3; color: #263d59; }
      .ownership { fill: #f3f1ed; stroke: #8b857c; color: #3f3a34; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .tier1 { fill: #e0e0e0; stroke: #8c8c8c; color: #363636; }
      .tier2 { fill: #f2f2f2; stroke: #a6a6a6; color: #404040; }
      .control, .kubernetes, .ownership, .runtime, .tier0, .tier1, .tier2 { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
<g id="PVE" class="ownership">
<rect x="20" y="20" width="920" height="680"/>
<text x="480.0" y="44">Connected Hosting / Proxmox Capacity</text>
<g id="T2" class="tier2">
<rect x="40" y="70" width="655" height="175"/>
<text x="367.5" y="94">Tier 2</text>
<g id="Workloads" class="runtime"><rect x="60" y="120" width="235" height="100"/>
<text x="177.5" y="175.0">Dedicated workload VMs</text>
</g>
<g id="WorkloadNodes" class="group">
<rect x="325" y="110" width="350" height="115"/>
<text x="500.0" y="134">Cluster-node VMs</text>
<g id="C2" class="kubernetes"><rect x="340" y="150" width="320" height="55"/>
<text x="500.0" y="172.5">Tier 2 Kubernetes</text>
<text x="500.0" y="192.5">Application workloads</text>
</g>
</g>
</g>
<g id="T1" class="tier1">
<rect x="40" y="260" width="655" height="175"/>
<text x="367.5" y="284">Tier 1</text>
<g id="Shared" class="runtime"><rect x="60" y="310" width="235" height="100"/>
<text x="177.5" y="365.0">Dedicated shared-service VMs</text>
</g>
<g id="PlatformNodes" class="group">
<rect x="325" y="300" width="350" height="115"/>
<text x="500.0" y="324">Cluster-node VMs</text>
<g id="C1" class="kubernetes"><rect x="340" y="340" width="320" height="55"/>
<text x="500.0" y="362.5">Tier 1 Kubernetes</text>
<text x="500.0" y="382.5">Shared-service workloads</text>
</g>
</g>
</g>
<g id="T0" class="tier0">
<rect x="40" y="450" width="655" height="210"/>
<text x="367.5" y="474">Tier 0</text>
<g id="ControlNodes" class="group">
<rect x="60" y="495" width="335" height="140"/>
<text x="227.5" y="519">Cluster-node VMs</text>
<g id="Cluster" class="kubernetes"><rect x="75" y="545" width="305" height="65"/>
<text x="227.5" y="572.5">Tier 0 Kubernetes</text>
<text x="227.5" y="592.5">Control-service workloads</text>
</g>
</g>
<g id="Dedicated" class="runtime"><rect x="425" y="495" width="250" height="140"/>
<text x="550.0" y="560.0">Dedicated service VMs</text>
<text x="550.0" y="580.0">Directory / protected execution</text>
</g>
</g>
<g id="Hosts" class="control"><rect x="735" y="280" width="185" height="175"/>
<text x="827.5" y="342.5">Tier 0-operated</text>
<text x="827.5" y="362.5">Proxmox hosts</text>
<text x="827.5" y="382.5">Physical execution</text>
<text x="827.5" y="402.5">Attached storage</text>
</g>
</g>
</svg>
