<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Basic control-cluster platform placement</title>
  <desc id="description">Five installed chart releases form compact platform, reconciliation and node-service groups. Flux configuration objects and the existing block CSI driver are inside the runtime. Approved bootstrap Git and accepted block storage remain separate prerequisites. Application databases are not created by the operator box.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581" />
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .kubernetes { fill: #e8eef6; stroke: #6b83a3; color: #263d59; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .traffic { fill: #303841; stroke: #8a9baa; color: #ffffff; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .tier0, .network, .kubernetes, .control, .traffic, .data { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="20" y="20" width="920" height="680" />
    <text x="480.0" y="45">Tier 0</text>
    <g id="ControlNetwork" class="network">
      <rect x="40" y="65" width="880" height="435" />
      <text x="480.0" y="90">Control Cluster Network / control_cluster</text>
      <g id="Cluster" class="kubernetes">
        <rect x="55" y="105" width="850" height="380" />
        <text x="480.0" y="130">Tier 0 Kubernetes</text>
        <g id="Apps" class="group">
          <rect x="75" y="150" width="230" height="315" />
          <text x="190.0" y="175">Platform Services</text>
          <g id="TLS" class="control">
            <rect x="95" y="205" width="190" height="50" />
            <text x="190.0" y="235.0">cert-manager</text>
          </g>
          <g id="Ingress" class="traffic">
            <polygon points="111,295 269,295 285,322.5 269,350 111,350 95,322.5" />
            <text x="190.0" y="317.5">traefik</text>
            <text x="190.0" y="337.5">Private NodePorts</text>
          </g>
          <g id="Database" class="control">
            <rect x="95" y="390" width="190" height="50" />
            <text x="190.0" y="410.0">cloudnative-pg</text>
            <text x="190.0" y="430.0">Operator</text>
          </g>
        </g>
        <g id="Reconcile" class="group">
          <rect x="325" y="150" width="260" height="315" />
          <text x="455.0" y="175">Reconciliation</text>
          <g id="Flux" class="control">
            <rect x="345" y="205" width="220" height="50" />
            <text x="455.0" y="235.0">flux2 / controllers</text>
          </g>
          <g id="Source" class="data">
            <rect x="345" y="365" width="220" height="70" />
            <text x="455.0" y="395.0">platform / GitRepository</text>
            <text x="455.0" y="415.0">SOPS Kustomization</text>
          </g>
          <path class="connection" data-from="Flux" data-to="Source" d="M455 255 L455 365" />
          <rect x="459.0" y="300" width="102" height="23" fill="#f8fafc" stroke="none" />
          <text x="510" y="316" class="edge-label">Reconcile</text>
        </g>
        <g id="NodeServices" class="group">
          <rect x="605" y="150" width="280" height="315" />
          <text x="745.0" y="175">Node Services</text>
          <g id="Network" class="control">
            <rect x="625" y="205" width="240" height="50" />
            <text x="745.0" y="235.0">cilium / CNI</text>
          </g>
          <g id="Storage" class="control">
            <rect x="625" y="365" width="240" height="70" />
            <text x="745.0" y="395.0">Existing block CSI</text>
            <text x="745.0" y="415.0">Accepted block class</text>
          </g>
        </g>
      </g>
    </g>
    <g id="Existing" class="group">
      <rect x="40" y="535" width="880" height="145" />
      <text x="480.0" y="560">Service Dependencies</text>
      <g id="Git" class="data">
        <rect x="345" y="585" width="220" height="65" />
        <text x="455.0" y="612.5">Approved bootstrap</text>
        <text x="455.0" y="632.5">Git source</text>
      </g>
      <g id="PVE" class="data">
        <rect x="625" y="585" width="240" height="65" />
        <text x="745.0" y="612.5">Existing Proxmox/Ceph</text>
        <text x="745.0" y="632.5">Block storage</text>
      </g>
    </g>
  </g>
</svg>
