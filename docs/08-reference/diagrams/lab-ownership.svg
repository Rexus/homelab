<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660"
     role="img" aria-labelledby="title description">
  <title id="title">Tenant access and protected lab lifecycle</title>
  <desc id="description">The tenant enters its project Kubernetes API from the left of Tier 2. Tier 0 sits below and performs the node VM lifecycle. The platform operator enters from the left of Tier 0.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier2 { fill: #f6f3ef; stroke: #aca59b; color: #4b443c; }
      .tier0 { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .kubernetes { fill: #e8eef6; stroke: #6b83a3; color: #263d59; }
      .traffic { fill: #303841; stroke: #8a9baa; color: #ffffff; }
      .services { fill: #e7f0fc; stroke: #4d719b; color: #203a5b; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .tier2, .tier0, .kubernetes, .traffic, .services, .control, .actor { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T2" class="tier2">
    <rect x="250" y="20" width="690" height="330"/>
    <text x="595" y="43">Tier 2</text>
    <g id="Nodes" class="group">
      <rect x="270" y="60" width="650" height="270"/>
      <text x="595" y="85">Dedicated Node VMs</text>
      <g id="Cluster" class="kubernetes">
        <rect x="290" y="110" width="610" height="200"/>
        <text x="595" y="135">Tier 2 Kubernetes</text>
        <g id="API" class="traffic">
          <polygon points="345,180 505,180 520,220 505,260 345,260 330,220"/>
          <text x="425" y="211">Project</text>
          <text x="425" y="233">Kubernetes API</text>
        </g>
        <g id="Workloads" class="services">
          <rect x="660" y="180" width="200" height="80"/>
          <text x="760" y="211">Project</text>
          <text x="760" y="233">workloads</text>
        </g>
        <path class="connection" data-from="API" data-to="Workloads" d="M520 220 L660 220"/>
        <text x="590" y="208" class="edge-label">Manages</text>
      </g>
    </g>
  </g>
  <g id="T0" class="tier0">
    <rect x="250" y="395" width="690" height="225"/>
    <text x="595" y="420">Tier 0</text>
    <g id="Execution" class="control">
      <rect x="500" y="470" width="350" height="100"/>
      <text x="675" y="510">Protected lifecycle</text>
      <text x="675" y="535">execution</text>
    </g>
  </g>
  <g id="Tenant" class="actor">
    <rect x="20" y="180" width="190" height="80"/>
    <text x="115" y="225">Tenant</text>
  </g>
  <g id="Operator" class="actor">
    <rect x="20" y="475" width="190" height="90"/>
    <text x="115" y="510">Platform</text>
    <text x="115" y="535">operator</text>
  </g>
  <path class="connection" data-from="Tenant" data-to="API" d="M210 220 L330 220"/>
  <rect x="216" y="176" width="108" height="39" fill="#f8fafc" stroke="none"/>
  <text x="270" y="194" class="edge-label">Project API</text>
  <text x="270" y="211" class="edge-label">access</text>
  <path class="connection" data-from="Operator" data-to="Execution" d="M210 520 L500 520"/>
  <text x="355" y="507" class="edge-label">Authorized operations</text>
  <path class="connection" data-from="Execution" data-to="Nodes" d="M675 470 L675 365 L595 365 L595 330"/>
  <rect x="692" y="355" width="124" height="37" fill="#f8fafc" stroke="none"/>
  <text x="754" y="370" class="edge-label">Node VM</text>
  <text x="754" y="387" class="edge-label">lifecycle</text>
</svg>
