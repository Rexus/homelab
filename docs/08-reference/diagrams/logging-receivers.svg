<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Independent protected logging receivers</title>
  <desc id="description">The current single-target producer sends TLS logs through the logs alias to log-1. The receiver-placement group compares separate physical hosts and their local disks. Each receiver VM uses the management guest network. Dashed alternate routing and durable handoff need project integration; no VIP or storage replication is installed by adding log-2.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627581"/></marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .deploymentGroup { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .boundary { fill: #eef2f6; stroke: #64748b; color: #1f2937; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .traffic { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .action { fill: #fcebdc; stroke: #a16c43; color: #5b3921; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .tier0, .network, .boundary, .control, .runtime, .traffic, .actor, .action, .data, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; marker-end: url(#arrow); }
      .manual { stroke-dasharray: 5 4; }
      .edge-label { fill: #1f2937; font-size: 13px; }
      .detail { font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0"><rect x="245" y="20" width="695" height="680"/>
    <text x="592.5" y="45">Tier 0</text>
  <g id="Placement" class="deploymentGroup"><rect x="265" y="65" width="655" height="410"/>
    <text x="592.5" y="90">Receiver Host Placement</text>
  <g id="PVE1" class="boundary"><rect x="280" y="110" width="300" height="340"/>
    <text x="430.0" y="135">Proxmox host A</text>
  <g id="VM1" class="control"><rect x="315" y="165" width="230" height="80"/>
    <text x="430.0" y="199.0">log-1</text>
    <text x="430.0" y="221.0">TLS receiver / management</text>
  </g>
  <g id="Disk1" class="data"><path d="M315 337 C315 321 545 321 545 337 L545 398 C545 414 315 414 315 398 Z"/><path d="M315 337 C315 353 545 353 545 337" fill="none"/>
    <text x="430.0" y="364.5">Local data disk</text>
    <text x="430.0" y="386.5">Records / queues</text>
  </g>
  <path class="connection" data-from="VM1" data-to="Disk1" d="M430 245 L430 325"/>
  <rect x="448.0" y="275" width="54" height="22" fill="#f8fafc" stroke="none"/>
    <text x="475" y="290" class="edge-label">Append</text>
  </g>
  <g id="PVE2" class="boundary"><rect x="605" y="110" width="300" height="340"/>
    <text x="755.0" y="135">Proxmox host B</text>
  <g id="VM2" class="control"><rect x="640" y="165" width="230" height="80"/>
    <text x="755.0" y="199.0">log-2 / optional</text>
    <text x="755.0" y="221.0">TLS receiver / management</text>
  </g>
  <g id="Disk2" class="data"><path d="M640 337 C640 321 870 321 870 337 L870 398 C870 414 640 414 640 398 Z"/><path d="M640 337 C640 353 870 353 870 337" fill="none"/>
    <text x="755.0" y="364.5">Local data disk</text>
    <text x="755.0" y="386.5">Records / queues</text>
  </g>
  <path class="connection" data-from="VM2" data-to="Disk2" d="M755 245 L755 325"/>
  <rect x="773.0" y="275" width="54" height="22" fill="#f8fafc" stroke="none"/>
    <text x="800" y="290" class="edge-label">Append</text>
  </g>
  </g>
  <g id="Custody" class="custody"><rect x="265" y="545" width="655" height="135"/>
    <text x="592.5" y="570">Archive Custody</text>
  <g id="Commit" class="action"><rect x="280" y="590" width="300" height="65"/>
    <text x="430.0" y="616.5">Durable handoff</text>
    <text x="430.0" y="638.5">Project integration</text>
  </g>
  <g id="Copies" class="data"><path d="M625 597 C625 581 895 581 895 597 L895 648 C895 664 625 664 625 648 Z"/><path d="M625 597 C625 613 895 613 895 597" fill="none"/>
    <text x="760.0" y="619.5">Retained copies</text>
    <text x="760.0" y="641.5">Independent backup</text>
  </g>
  <path class="connection" data-from="Commit" data-to="Copies" d="M580 623 L625 623"/>
  </g>
  <path class="connection manual" data-from="Disk1" data-to="Commit" d="M430 410 L430 590"/>
  <path class="connection manual" data-from="Disk2" data-to="Commit" d="M755 410 L755 520 L540 520 L540 590"/>
  </g>
  <g id="Sources" class="actor"><rect x="20" y="175" width="190" height="110"/>
    <text x="115.0" y="224.0">Approved producers</text>
    <text x="115.0" y="246.0">Single target / queues</text>
  </g>
  <path class="connection" data-from="Sources" data-to="VM1" d="M210 205 L315 205"/>
  <rect x="219.0" y="170" width="82" height="22" fill="#f8fafc" stroke="none"/>
    <text x="260" y="185" class="edge-label">TLS / logs</text>
  <path class="connection manual" data-from="Sources" data-to="VM2" d="M210 260 L225 260 L225 495 L905 495 L905 205 L870 205"/>
  <rect x="486.0" y="480" width="208" height="22" fill="#f8fafc" stroke="none"/>
    <text x="590" y="495" class="edge-label">Routing integration required</text>
</svg>
