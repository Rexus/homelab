<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Shared logging VIP integration</title>
  <desc id="description">Producers retain the logs service name after an accepted future VIP integration. The VIP directs connections to the active receiver; each receiver has a separate certificate key and local records. All dashed routing is a project integration, not installed by the receiver recipe.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#627581"/></marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .deploymentGroup { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .boundary { fill: #eef2f6; stroke: #64748b; color: #1f2937; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .traffic { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .action { fill: #fcebdc; stroke: #a16c43; color: #5b3921; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .tier0, .network, .boundary, .control, .runtime, .traffic, .actor, .action, .data, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; marker-end: url(#arrow); }
      .manual { stroke-dasharray: 5 4; }
      .edge-label { fill: #1f2937; font-size: 13px; }
      .detail { font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0"><rect x="245" y="20" width="695" height="680"/>
    <text x="592.5" y="45">Tier 0</text>
  <g id="Network" class="network"><rect x="265" y="65" width="655" height="610"/>
    <text x="592.5" y="90">Management Network / management</text>
  <g id="Receivers" class="deploymentGroup"><rect x="505" y="110" width="395" height="540"/>
    <text x="702.5" y="135">Logging Services</text>
  <g id="VM1" class="control"><rect x="535" y="160" width="335" height="90"/>
    <text x="702.5" y="199.0">log-1</text>
    <text x="702.5" y="221.0">logs / certificate SAN</text>
  </g>
  <g id="Disk1" class="data"><path d="M565 292 C565 276 840 276 840 292 L840 333 C840 349 565 349 565 333 Z"/><path d="M565 292 C565 308 840 308 840 292" fill="none"/>
    <text x="702.5" y="320.5">Local records</text>
  </g>
  <path class="connection" data-from="VM1" data-to="Disk1" d="M702 250 L702 280"/>
  <g id="VM2" class="control"><rect x="535" y="415" width="335" height="90"/>
    <text x="702.5" y="454.0">log-2</text>
    <text x="702.5" y="476.0">logs / certificate SAN</text>
  </g>
  <g id="Disk2" class="data"><path d="M565 547 C565 531 840 531 840 547 L840 588 C840 604 565 604 565 588 Z"/><path d="M565 547 C565 563 840 563 840 547" fill="none"/>
    <text x="702.5" y="575.5">Local records</text>
  </g>
  <path class="connection" data-from="VM2" data-to="Disk2" d="M702 505 L702 535"/>
  </g>
  <g id="VIP" class="traffic"><polygon points="300,275 445,275 470,330 445,385 300,385 280,330"/>
    <text x="375" y="314">Shared VIP</text>
    <text x="375" y="336">Project integration</text>
  </g>
  <path class="connection manual" data-from="VIP" data-to="VM1" d="M470 305 L495 305 L495 205 L535 205"/>
  <rect x="361.5" y="220" width="117" height="22" fill="#f8fafc" stroke="none"/>
    <text x="420" y="235" class="edge-label">Active receiver</text>
  <path class="connection manual" data-from="VIP" data-to="VM2" d="M470 355 L495 355 L495 460 L535 460"/>
  <rect x="375.5" y="425" width="89" height="22" fill="#f8fafc" stroke="none"/>
    <text x="420" y="440" class="edge-label">On failover</text>
  </g>
  </g>
  <g id="Producers" class="actor"><rect x="20" y="285" width="190" height="90"/>
    <text x="115.0" y="324.0">Producers</text>
    <text x="115.0" y="346.0">logs</text>
  </g>
  <path class="connection manual" data-from="Producers" data-to="VIP" d="M210 330 L280 330"/>
  <rect x="204.0" y="295" width="82" height="22" fill="#f8fafc" stroke="none"/>
    <text x="245" y="310" class="edge-label">TLS / logs</text>
</svg>
