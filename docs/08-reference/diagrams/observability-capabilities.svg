<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Telemetry analysis and protected evidence placement</title>
  <desc id="description">Application telemetry is processed in Tier 1 Kubernetes by gateways, metrics and log/trace backends. Diagnostic collection is a separate function. Tier 0 retains protected original evidence and independent health. A separate communication sequence shows submissions from all tiers.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .kubernetes { fill: #e8eef6; stroke: #6b83a3; color: #263d59; }
      .services { fill: #e7f0fc; stroke: #4d719b; color: #203a5b; }
      .tier0 { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .tier1 { fill: #e9e2d8; stroke: #968976; color: #44382a; }
      .tier2 { fill: #f6f3ef; stroke: #aca59b; color: #4b443c; }
      .traffic { fill: #303841; stroke: #8a9baa; color: #ffffff; }
      .control, .kubernetes, .services, .tier0, .tier1, .tier2, .traffic { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
<g id="T2" class="tier2">
<rect x="20" y="20" width="920" height="90"/>
<text x="480.0" y="44">Tier 2</text>
<g id="Apps" class="services"><rect x="200" y="55" width="560" height="40"/>
<text x="480.0" y="80.0">Application logs / metrics / traces</text>
</g>
</g>
<g id="T1" class="tier1">
<rect x="20" y="135" width="920" height="350"/>
<text x="480.0" y="159">Tier 1</text>
<g id="Cluster" class="kubernetes">
<rect x="40" y="175" width="880" height="290"/>
<text x="480.0" y="199">Tier 1 Kubernetes</text>
<g id="Diagnostics" class="services"><rect x="60" y="250" width="235" height="100"/>
<text x="177.5" y="295.0">Live platform / workload</text>
<text x="177.5" y="315.0">diagnostics</text>
</g>
<g id="Gateway" class="traffic"><polygon points="354,265 506,265 520,297.5 506,330 354,330 340,297.5"/>
<text x="430.0" y="302.5">Telemetry gateways</text>
</g>
<g id="Backends" class="group">
<rect x="585" y="215" width="310" height="230"/>
<text x="740.0" y="239">Telemetry Backends</text>
<g id="Metrics" class="services"><rect x="610" y="255" width="260" height="65"/>
<text x="740.0" y="282.5">Metrics backend</text>
<text x="740.0" y="302.5">Metrics query UI</text>
</g>
<g id="Search" class="services"><rect x="610" y="355" width="260" height="65"/>
<text x="740.0" y="382.5">Log / trace search</text>
<text x="740.0" y="402.5">Analysis UI</text>
</g>
</g>
<path class="connection" data-from="Gateway" data-to="Metrics" d="M520 287 L610 287"/><rect x="528.0" y="252" width="70" height="23" fill="#f8fafc" stroke="none"/>
<text x="563" y="267" class="edge-label">Metrics</text>
<path class="connection" data-from="Gateway" data-to="Search" d="M520 308 L552 308 L552 387 L610 387"/><rect x="510.5" y="338" width="83" height="23" fill="#f8fafc" stroke="none"/>
<text x="552" y="353" class="edge-label">Logs / traces</text>
</g>
</g>
<g id="T0" class="tier0">
<rect x="20" y="525" width="920" height="175"/>
<text x="480.0" y="549">Tier 0</text>
<g id="Evidence" class="control"><rect x="60" y="580" width="470" height="75"/>
<text x="295.0" y="612.5">Protected log intake / archive</text>
<text x="295.0" y="632.5">Restricted original evidence</text>
</g>
<g id="Critical" class="control"><rect x="610" y="580" width="290" height="75"/>
<text x="755.0" y="622.5">Independent health / alerts</text>
</g>
</g>
</svg>
