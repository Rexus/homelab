<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">ORCA disk, root-key and backup credentials</title>
  <desc id="description">Three distinct credentials protect different operations. A LUKS passphrase
    or an optionally enrolled FIDO2 key with PIN and touch unlocks the original working disk.
    The recovery passphrase remains independently retained. A separate root-key passphrase authorizes use of the encrypted
    software root PEM on that mounted disk. Normal signing returns public certificates and CRLs,
    not the private root key. An independently retained age identity decrypts the complete encrypted
    backup for restoration. Only the public age recipient enters the image and kit; recovery still
    needs the original root-key passphrase to sign. The image supplies native FIDO2 tools while
    enrollment/unlock require local custody and hardware qualification. This is not a hardware-backed root profile.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .action { fill: #fcebdc; stroke: #a16c43; color: #5b3921; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .actor, .action, .data, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
      .detail { font-size: 13px; }
    </style>
  </defs>
  <g id="VolumeAccess" class="group">
    <rect x="20" y="20" width="920" height="185"/>
    <text x="480" y="47">1 · Unlock the working disk</text>
    <g id="DiskSecret" class="actor">
      <rect x="40" y="75" width="240" height="70"/>
      <text x="160" y="103">Disk unlock credential</text>
      <text x="160" y="128" class="detail">Passphrase / FIDO2 + PIN / touch</text>
    </g>
    <g id="Unlock" class="action">
      <rect x="360" y="75" width="240" height="70"/>
      <text x="480" y="103">Unlock / mount</text>
      <text x="480" y="128">Local ceremony console</text>
    </g>
    <g id="Disk" class="data">
      <path d="M680 89 C680 72 920 72 920 89 L920 132 C920 149 680 149 680 132 Z"/>
      <path d="M680 89 C680 106 920 106 920 89" fill="none"/>
      <text x="800" y="118">Encrypted working disk</text>
      <text x="800" y="140" class="detail">Original root state / tools</text>
    </g>
    <path class="connection" data-from="DiskSecret" data-to="Unlock" d="M280 110 H360"/>
    <path class="connection" data-from="Unlock" data-to="Disk" d="M600 110 H680"/>
    <text x="640" y="97" class="edge-label">Open</text>
    <text x="480" y="180">Mounting the disk does not unlock its separately encrypted root key.</text>
  </g>
  <g id="KeyUse" class="group">
    <rect x="20" y="230" width="920" height="185"/>
    <text x="480" y="257">2 · Authorize a root-key operation</text>
    <g id="KeySecret" class="actor">
      <rect x="40" y="285" width="240" height="70"/>
      <text x="160" y="313">Root-key passphrase</text>
      <text x="160" y="338" class="detail">Separate native OpenSSL prompt</text>
    </g>
    <g id="Sign" class="action">
      <rect x="360" y="285" width="240" height="70"/>
      <text x="480" y="313">Sign / renew CRL</text>
      <text x="480" y="338">Native clca / OpenSSL</text>
    </g>
    <g id="RootPEM" class="data">
      <rect x="680" y="285" width="240" height="70"/>
      <text x="800" y="313">Encrypted root PEM</text>
      <text x="800" y="338" class="detail">On the mounted working disk</text>
    </g>
    <path class="connection" data-from="KeySecret" data-to="Sign" d="M280 320 H360"/>
    <path class="connection" data-from="Sign" data-to="RootPEM" d="M600 320 H680"/>
    <text x="640" y="307" class="edge-label">Use key</text>
    <text x="480" y="390">Normal signing returns public certificates / CRLs. The private root key stays in custody.</text>
  </g>
  <g id="Recovery" class="custody">
    <rect x="20" y="440" width="920" height="260"/>
    <text x="480" y="467">3 · Restore original state from independent backup</text>
    <g id="AgeIdentity" class="actor">
      <rect x="40" y="500" width="240" height="70"/>
      <text x="160" y="528">Private age identity</text>
      <text x="160" y="553" class="detail">Independent recovery custodian</text>
    </g>
    <g id="Restore" class="action">
      <rect x="360" y="500" width="240" height="70"/>
      <text x="480" y="528">Decrypt / restore</text>
      <text x="480" y="553">Separate recovery ceremony</text>
    </g>
    <g id="Archive" class="data">
      <path d="M680 514 C680 497 920 497 920 514 L920 557 C920 574 680 574 680 557 Z"/>
      <path d="M680 514 C680 531 920 531 920 514" fill="none"/>
      <text x="800" y="543">Encrypted .tar.gz.age</text>
      <text x="800" y="565" class="detail">Complete original CA archive</text>
    </g>
    <path class="connection" data-from="AgeIdentity" data-to="Restore" d="M280 535 H360"/>
    <path class="connection" data-from="Restore" data-to="Archive" d="M600 535 H680"/>
    <text x="640" y="522" class="edge-label">Read archive</text>
    <text x="480" y="614">Only the public age recipient belongs in the image / kit.</text>
    <text x="480" y="644">The private recovery identity is retained separately from the backup.</text>
    <text x="480" y="676" class="detail">Restoring the archive preserves the original root key. Its root-key passphrase is still required to sign.</text>
  </g>
</svg>
