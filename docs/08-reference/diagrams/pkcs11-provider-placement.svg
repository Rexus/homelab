<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Restricted native PKCS11 provider endpoints</title>
  <desc id="description">The existing client account uses two pinned SSH endpoints. Each provider retains its own host-bound USB token. Offline original-key custody stays below the connected providers; the pair does not imply shared sessions or automatic key replication.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581" />
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .tier0, .network, .runtime, .control, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="20" y="20" width="920" height="680" />
    <text x="480.0" y="45">Tier 0</text>
    <g id="Client" class="control">
      <rect x="40" y="245" width="200" height="110" />
      <text x="140.0" y="285.0">Existing application account</text>
      <text x="140.0" y="305.0">p11-kit / pinned SSH identity</text>
      <text x="140.0" y="325.0">Permitted client network</text>
    </g>
    <g id="Network" class="network">
      <rect x="295" y="65" width="625" height="485" />
      <text x="607.5" y="90">Cryptography Network / cryptography</text>
      <g id="Pool" class="group">
        <rect x="310" y="105" width="595" height="420" />
        <text x="607.5" y="130">PKCS#11 Providers</text>
        <g id="Host1" class="runtime">
          <rect x="325" y="150" width="565" height="155" />
          <text x="607.5" y="175">pve01 / USB device affinity</text>
          <g id="H1" class="control">
            <rect x="345" y="205" width="220" height="65" />
            <text x="455.0" y="232.5">hsm-1</text>
            <text x="455.0" y="252.5">Restricted SSH / provider</text>
          </g>
          <g id="Token1" class="custody">
            <rect x="650" y="205" width="220" height="65" />
            <text x="760.0" y="242.5">Assigned local USB token</text>
          </g>
          <path class="connection" data-from="H1" data-to="Token1" d="M565 237 L650 237" />
          <rect x="564.0" y="182" width="88" height="23" fill="#f8fafc" stroke="none" />
          <text x="608" y="198" class="edge-label">Native USB</text>
        </g>
        <g id="Host2" class="runtime">
          <rect x="325" y="330" width="565" height="155" />
          <text x="607.5" y="355">pve02 / USB device affinity</text>
          <g id="H2" class="control">
            <rect x="345" y="385" width="220" height="65" />
            <text x="455.0" y="412.5">hsm-2</text>
            <text x="455.0" y="432.5">Restricted SSH / provider</text>
          </g>
          <g id="Token2" class="custody">
            <rect x="650" y="385" width="220" height="65" />
            <text x="760.0" y="422.5">Assigned local USB token</text>
          </g>
          <path class="connection" data-from="H2" data-to="Token2" d="M565 417 L650 417" />
          <rect x="564.0" y="362" width="88" height="23" fill="#f8fafc" stroke="none" />
          <text x="608" y="378" class="edge-label">Native USB</text>
        </g>
      </g>
    </g>
    <path class="connection" data-from="Client" data-to="H1" d="M240 275 L272 275 L272 237 L345 237" />
    <rect x="250.0" y="181" width="40" height="41" fill="#f8fafc" stroke="none" />
    <text x="270" y="197" class="edge-label">SSH</text>
    <text x="270" y="215" class="edge-label">RPC</text>
    <path class="connection" data-from="Client" data-to="H2" d="M240 325 L272 325 L272 417 L345 417" />
    <rect x="250.0" y="361" width="40" height="41" fill="#f8fafc" stroke="none" />
    <text x="270" y="377" class="edge-label">SSH</text>
    <text x="270" y="395" class="edge-label">RPC</text>
    <g id="Recovery" class="custody">
      <rect x="40" y="590" width="880" height="90" />
      <text x="480.0" y="615">Offline Custody</text>
      <text x="480" y="649">Original-key backups / approved SPKI record</text>
    </g>
  </g>
</svg>
