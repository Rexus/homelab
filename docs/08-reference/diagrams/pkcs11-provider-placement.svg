<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Restricted native PKCS11 provider endpoints</title>
  <desc id="description">The existing client account stays in its permitted network to the left of Tier 0 and uses two pinned SSH endpoints in the cryptography guest network. The physical Proxmox hosts are separate from that guest network, to the right. Each host's assigned USB token reaches its pinned provider VM through native passthrough. Offline original-key custody stays below the connected providers; the pair does not imply shared sessions or automatic key replication.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581" />
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .traffic { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .tier0, .network, .runtime, .actor, .traffic, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="255" y="20" width="685" height="680" />
    <text x="597" y="45">Tier 0</text>
    <g id="Network" class="network">
      <rect x="275" y="65" width="325" height="485" />
      <text x="437" y="90">Cryptography Network</text>
      <text x="437" y="112">cryptography / guest NICs</text>
      <g id="Pool" class="group">
        <rect x="290" y="135" width="295" height="390" />
        <text x="437" y="160">PKCS#11 Provider VMs</text>
        <g id="H1" class="traffic">
          <polygon points="325,205 550,205 565,237.5 550,270 325,270 310,237.5" />
          <text x="437" y="232.5">hsm-1 / pve01 guest</text>
          <text x="437" y="252.5">Restricted SSH / provider</text>
        </g>
        <g id="H2" class="traffic">
          <polygon points="325,385 550,385 565,417.5 550,450 325,450 310,417.5" />
          <text x="437" y="412.5">hsm-2 / pve02 guest</text>
          <text x="437" y="432.5">Restricted SSH / provider</text>
        </g>
      </g>
    </g>
    <g id="Host1" class="runtime">
      <rect x="680" y="150" width="240" height="155" />
      <text x="800" y="175">pve01 / physical host</text>
      <g id="Token1" class="custody">
        <rect x="700" y="205" width="200" height="65" />
        <text x="800" y="232.5">Assigned local</text>
        <text x="800" y="252.5">USB token</text>
      </g>
    </g>
    <g id="Host2" class="runtime">
      <rect x="680" y="330" width="240" height="155" />
      <text x="800" y="355">pve02 / physical host</text>
      <g id="Token2" class="custody">
        <rect x="700" y="385" width="200" height="65" />
        <text x="800" y="412.5">Assigned local</text>
        <text x="800" y="432.5">USB token</text>
      </g>
    </g>
    <path class="connection" data-from="H1" data-to="Token1" d="M565 237 H700" />
    <rect x="592" y="191" width="80" height="37" fill="#f8fafc" stroke="none" />
    <text x="632" y="206" class="edge-label">USB</text>
    <text x="632" y="223" class="edge-label">passthrough</text>
    <path class="connection" data-from="H2" data-to="Token2" d="M565 417 H700" />
    <rect x="592" y="371" width="80" height="37" fill="#f8fafc" stroke="none" />
    <text x="632" y="386" class="edge-label">USB</text>
    <text x="632" y="403" class="edge-label">passthrough</text>
    <g id="Recovery" class="custody">
      <rect x="275" y="590" width="645" height="90" />
      <text x="597" y="615">Offline Custody</text>
      <text x="597" y="649">Original-key backups / approved SPKI record</text>
    </g>
  </g>
  <path class="connection" data-from="Client" data-to="H1" d="M220 275 H250 V237 H310" />
  <rect x="228" y="194" width="40" height="38" fill="#f8fafc" stroke="none" />
  <text x="248" y="210" class="edge-label">SSH</text>
  <text x="248" y="228" class="edge-label">RPC</text>
  <path class="connection" data-from="Client" data-to="H2" d="M220 325 H250 V417 H310" />
  <rect x="228" y="432" width="40" height="38" fill="#f8fafc" stroke="none" />
  <text x="248" y="448" class="edge-label">SSH</text>
  <text x="248" y="466" class="edge-label">RPC</text>
  <g id="Client" class="actor">
    <rect x="40" y="235" width="180" height="130" />
    <text x="130" y="260">Existing application</text>
    <text x="130" y="283">account / p11-kit</text>
    <text x="130" y="306">Pinned SSH identity</text>
    <text x="130" y="340">Permitted client network</text>
  </g>
</svg>
