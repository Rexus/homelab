<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Platform cluster and selected delivery controller</title>
  <desc id="description">Three named Talos node VMs stack inside their Kubernetes runtime. The selected Argo CD or Spinnaker controller is a separate installer inside that same runtime. This placement view makes no traffic or host-failure claim.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581" />
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier1 { fill: #e9e2d8; stroke: #968976; color: #44382a; }
      .network { fill: #f4eded; stroke: #9b7378; color: #50383d; }
      .kubernetes { fill: #e8eef6; stroke: #6b83a3; color: #263d59; }
      .replicas { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .services { fill: #e7f0fc; stroke: #4d719b; color: #203a5b; }
      .tier1, .network, .kubernetes, .services { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T1" class="tier1">
    <rect x="20" y="20" width="920" height="680" />
    <text x="480.0" y="45">Tier 1</text>
    <g id="Network" class="network">
      <rect x="40" y="65" width="880" height="615" />
      <text x="480.0" y="90">Application Network / application</text>
      <g id="Cluster" class="kubernetes">
        <rect x="60" y="110" width="840" height="550" />
        <text x="480.0" y="135">Tier 1 Kubernetes</text>
        <g id="Nodes" class="replicas">
          <rect x="80" y="155" width="300" height="485" />
          <text x="230.0" y="180">Kubernetes Node VMs</text>
          <g id="CP1" class="services">
            <rect x="120" y="220" width="220" height="75" />
            <text x="230.0" y="262.5">pctl-1</text>
          </g>
          <g id="CP2" class="services">
            <rect x="120" y="345" width="220" height="75" />
            <text x="230.0" y="387.5">pctl-2</text>
          </g>
          <g id="CP3" class="services">
            <rect x="120" y="470" width="220" height="75" />
            <text x="230.0" y="512.5">pctl-3</text>
          </g>
        </g>
        <g id="Added" class="group">
          <rect x="495" y="290" width="360" height="180" />
          <text x="675.0" y="315">Delivery Controller</text>
          <g id="Controller" class="services">
            <rect x="530" y="345" width="290" height="85" />
            <text x="675.0" y="382.5">A: Argo CD</text>
            <text x="675.0" y="402.5">or B: Spinnaker</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
