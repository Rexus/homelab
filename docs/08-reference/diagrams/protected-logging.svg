<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Protected logging retention and independent recovery</title>
  <desc id="description">Registered producers from all tiers submit to the Tier 0 TLS receiver.
    The receiver publishes checkpoints to the NAS archive. An independent recovery host reads
    that archive with separate read-only access and writes its own encrypted repository.
    Offline tools and keys remain below connected services. Success checks have a separate view.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .deploymentGroup { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .traffic { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .tier0, .runtime, .traffic, .control, .data, .actor, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .manual { stroke-dasharray: 5 4; }
      .edge-label { fill: #1f2937; font-size: 13px; }
      .detail { font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="240" y="20" width="700" height="680"/>
    <text x="590" y="45">Tier 0</text>
    <g id="Pipeline" class="deploymentGroup">
      <rect x="260" y="65" width="660" height="425"/>
      <text x="590" y="90">Logging Services</text>
      <g id="Receiver" class="runtime">
        <rect x="275" y="115" width="190" height="355"/>
        <text x="370" y="140">log-1</text>
        <g id="Log" class="traffic">
          <polygon points="295,165 425,165 440,195 425,225 295,225 280,195"/>
          <text x="360" y="190">syslog-ng</text><text x="360" y="212">TLS intake</text>
        </g>
        <g id="Local" class="data">
          <path d="M290 350 C290 332 450 332 450 350 L450 416 C450 434 290 434 290 416 Z"/>
          <path d="M290 350 C290 368 450 368 450 350" fill="none"/>
          <text x="370" y="385">scsi1</text><text x="370" y="408">JSONL / queues</text>
        </g>
        <path class="connection" data-from="Log" data-to="Local" d="M360 225 L360 337"/>
        <text x="407" y="285" class="edge-label">Append</text>
      </g>
      <g id="NAS" class="data">
        <rect x="490" y="115" width="190" height="355"/>
        <text x="585" y="140">NAS Archive</text>
        <g id="Chunks" class="data">
          <path d="M505 180 C505 162 665 162 665 180 L665 258 C665 276 505 276 505 258 Z"/>
          <path d="M505 180 C505 198 665 198 665 180" fill="none"/>
          <text x="585" y="216">Checkpoints</text>
          <text x="585" y="237" class="detail">Chunks / manifests</text>
          <text x="585" y="258" class="detail">Source catalogue</text>
        </g>
        <g id="Snapshots" class="data">
          <path d="M510 365 C510 348 660 348 660 365 L660 410 C660 427 510 427 510 410 Z"/>
          <path d="M510 365 C510 382 660 382 660 365" fill="none"/>
          <text x="585" y="397">Snapshots</text>
        </g>
        <path class="connection" data-from="Chunks" data-to="Snapshots" d="M585 271 L585 351"/>
        <text x="626" y="305" class="edge-label">NAS</text>
        <text x="626" y="323" class="edge-label">schedule</text>
      </g>
      <g id="RecoveryHost" class="runtime">
        <rect x="705" y="115" width="200" height="355"/>
        <text x="805" y="140">Recovery Host</text>
        <text x="805" y="158" class="detail">logging_recovery</text>
        <g id="Pull" class="control">
          <rect x="725" y="180" width="160" height="75"/>
          <text x="805" y="210">Read-only pull</text><text x="805" y="234">restic backup</text>
        </g>
        <g id="Copy" class="data">
          <path d="M725 350 C725 332 885 332 885 350 L885 416 C885 434 725 434 725 416 Z"/>
          <path d="M725 350 C725 368 885 368 885 350" fill="none"/>
          <text x="805" y="385">Encrypted restic</text><text x="805" y="408">repository</text>
        </g>
        <path class="connection" data-from="Pull" data-to="Copy" d="M805 255 L805 337"/>
        <text x="846" y="300" class="edge-label">Backup</text>
      </g>
      <path class="connection" data-from="Receiver" data-to="Chunks" d="M465 245 L505 245"/>
      <text x="485" y="233" class="edge-label">Copy</text>
      <path class="connection" data-from="Pull" data-to="Chunks" d="M725 205 L665 205"/>
      <rect x="666" y="165" width="58" height="30" fill="#f8fafc" stroke="none"/>
      <text x="695" y="177" class="edge-label">Read-only</text>
      <text x="695" y="193" class="edge-label">SMB</text>
    </g>
    <g id="Recovery" class="custody">
      <rect x="260" y="565" width="660" height="115"/>
      <text x="590" y="590">Offline Custody</text>
      <g id="Kit" class="custody">
        <rect x="280" y="610" width="620" height="50"/>
        <text x="590" y="640">Reader kit / separate keys / isolated inspection</text>
      </g>
    </g>
    <path class="connection manual" data-from="Copy" data-to="Kit" d="M805 429 L805 610"/>
    <text x="853" y="530" class="edge-label">Manual</text>
    <text x="853" y="548" class="edge-label">restore</text>
  </g>
  <g id="Producers" class="actor">
    <rect x="20" y="155" width="190" height="80"/>
    <text x="115" y="187">Registered producers</text>
    <text x="115" y="212">Tier 0 / Tier 1 / Tier 2</text>
  </g>
  <path class="connection" data-from="Producers" data-to="Log" d="M210 195 L280 195"/>
  <rect x="212" y="164" width="67" height="23" fill="#f8fafc" stroke="none"/>
  <text x="245" y="180" class="edge-label">TLS syslog</text>
</svg>
