<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660"
     role="img" aria-labelledby="title description">
  <title id="title">Secret access and independent recovery</title>
  <desc id="description">Authorized consumers enter the secret service from the left of Tier 0. Persistent state sits below its consumer, audit retention is on the right, and offline recovery custody remains at the bottom.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .tier0, .runtime, .control, .data, .custody, .actor { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="245" y="20" width="695" height="620"/>
    <text x="592" y="46">Tier 0</text>
    <g id="Connected" class="group">
      <rect x="265" y="65" width="655" height="370"/>
      <text x="592" y="92">Services</text>
      <g id="Runtime" class="runtime">
        <rect x="285" y="115" width="320" height="295"/>
        <text x="445" y="140">Secret-service runtime</text>
        <g id="Service" class="control">
          <rect x="310" y="165" width="270" height="80"/>
          <text x="445" y="197">Credential policy</text>
          <text x="445" y="221">and delivery</text>
        </g>
        <g id="State" class="data">
          <path d="M330 320 C330 300 560 300 560 320 L560 372 C560 392 330 392 330 372 Z"/>
          <path d="M330 320 C330 340 560 340 560 320" fill="none"/>
          <text x="445" y="363">Persistent state</text>
        </g>
        <path class="connection" data-from="Service" data-to="State" d="M445 245 L445 307"/>
        <text x="480" y="278" class="edge-label">Retain</text>
      </g>
      <g id="Logs" class="control">
        <rect x="725" y="165" width="175" height="100"/>
        <text x="812" y="192">Protected logging</text>
        <text x="812" y="221">Independent</text>
        <text x="812" y="243">retention</text>
      </g>
      <path class="connection" data-from="Service" data-to="Logs" d="M580 205 L725 205"/>
      <rect x="611" y="178" width="96" height="22" fill="#f8fafc" stroke="none"/>
      <text x="659" y="193" class="edge-label">Audit events</text>
    </g>
    <g id="Recovery" class="custody">
      <rect x="285" y="505" width="615" height="100"/>
      <text x="592" y="546">Independent offline recovery custody</text>
      <text x="592" y="572">Credentials and startup material</text>
    </g>
    <path class="connection" data-from="Recovery" data-to="Runtime" d="M445 505 L445 410"
          style="stroke-dasharray:4 3"/>
    <rect x="460" y="455" width="144" height="24" fill="#f8fafc" stroke="none"/>
    <text x="532" y="472" class="edge-label">Authorized recovery</text>
  </g>
  <g id="Consumers" class="actor">
    <rect x="20" y="165" width="180" height="80"/>
    <text x="110" y="198">Authorized</text>
    <text x="110" y="221">consumers</text>
  </g>
  <path class="connection" data-from="Consumers" data-to="Service" d="M200 205 L310 205"/>
  <rect x="205" y="173" width="100" height="23" fill="#f8fafc" stroke="none"/>
  <text x="255" y="189" class="edge-label">Scoped access</text>
</svg>
