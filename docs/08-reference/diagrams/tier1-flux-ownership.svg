<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"
     role="img" aria-labelledby="title description">
  <title id="title">Independent Tier 1 Flux and isolated promotion authority</title>
  <desc id="description">Tier 2 integration is separate. An external host bootstraps and maintains Tier 1.
    Tier 1 has its own Kubernetes runtime with Flux, platform services, Spinnaker and secretless promotion Jobs, separate Git
    sources and independent recovery custody. Tier 0 has its own Flux and infrastructure authority.
    Only the isolated promotion authority holds Git, signing and ticket credentials and writes the separate
    application repository after verifying judgment. Flux reconciles workloads.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 16px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .tier1 { fill: #e0e0e0; stroke: #8c8c8c; color: #363636; }
      .tier2 { fill: #f2f2f2; stroke: #a6a6a6; color: #404040; }
      .kubernetes { fill: #e8eef6; stroke: #6b83a3; color: #263d59; }
      .services { fill: #e7f0fc; stroke: #4d719b; color: #203a5b; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .action { fill: #fcebdc; stroke: #a16c43; color: #5b3921; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .tier0, .tier1, .tier2, .kubernetes, .services, .control, .data, .action, .actor, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.7; marker-end: url(#arrow); }
      .logical { fill: none; stroke: #627581; stroke-width: 1.7; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .label { fill: #1f2937; font-size: 14px; }
      .small { font-size: 14px; }
      .namespace { font-size: 13px; }
    </style>
  </defs>
  <g id="T2" class="tier2">
    <rect x="250" y="20" width="925" height="90"/>
    <text x="290" y="44">Tier 2</text>
    <text x="710" y="61">Application runtimes — separately approved integration</text>
    <text x="710" y="85" class="small">No Tier 2 deployment credentials selected by this Tier 1 path</text>
  </g>
  <g id="T1" class="tier1">
    <rect x="250" y="140" width="925" height="565"/>
    <text x="290" y="164">Tier 1</text>
    <g id="Runtime" class="kubernetes">
      <rect x="270" y="185" width="550" height="380"/>
      <text x="545" y="209">Tier 1 Kubernetes</text>
      <g id="Spinnaker" class="services">
        <rect x="290" y="230" width="210" height="70"/>
        <text x="395" y="258">Spinnaker</text>
        <text x="395" y="282" class="small">Approval / release orchestration</text>
      </g>
      <g id="Promotion" class="action">
        <rect x="290" y="320" width="210" height="55"/>
        <text x="395" y="342">Secretless promotion Job</text>
        <text x="395" y="363" class="namespace">delivery-promotion</text>
      </g>
      <g id="AuthorityNamespace" class="group">
        <rect x="280" y="390" width="230" height="155"/>
        <text x="395" y="408" class="namespace">delivery-promotion-authority</text>
        <g id="Authority" class="control">
          <rect x="290" y="420" width="210" height="55"/>
          <text x="395" y="443">Promotion authority</text>
          <text x="395" y="464" class="namespace">Ticket / actor / exact Git checks</text>
        </g>
        <g id="Credentials" class="data">
          <rect x="290" y="505" width="210" height="28"/>
          <text x="395" y="524" class="namespace">Git / signing / authority Secrets</text>
        </g>
      </g>
      <g id="Flux" class="control">
        <rect x="550" y="230" width="250" height="70"/>
        <text x="675" y="258">Tier 1 Flux</text>
        <text x="675" y="282" class="small">Platform / app identities</text>
      </g>
      <g id="Platform" class="services">
        <rect x="550" y="345" width="250" height="75"/>
        <text x="675" y="369">Platform services / Flux itself</text>
        <text x="675" y="392" class="small">Spinnaker / Harbor · Stage 7</text>
        <text x="675" y="412" class="small">Stage 8/9 services · opt-in later</text>
      </g>
      <g id="State" class="data">
        <rect x="550" y="440" width="250" height="30"/>
        <text x="675" y="460" class="small">Persistent service data</text>
      </g>
      <g id="Applications" class="services">
        <rect x="550" y="490" width="250" height="50"/>
        <text x="675" y="511">Application namespaces</text>
        <text x="675" y="532" class="small">Restricted reconciler / Helm</text>
      </g>
    </g>
    <g id="Sources" class="group">
      <rect x="850" y="185" width="305" height="380"/>
      <text x="1002" y="209">Separate source permissions</text>
      <g id="Bootstrap" class="data">
        <rect x="870" y="230" width="265" height="70"/>
        <text x="1002" y="257">platform · immutable commit</text>
        <text x="1002" y="282" class="small">Bootstrap RBAC / SOPS canary</text>
      </g>
      <g id="PlatformSource" class="data">
        <rect x="870" y="345" width="265" height="85"/>
        <text x="1002" y="369">tier1-platform</text>
        <text x="1002" y="392" class="small">Approved commit / external maintenance</text>
        <text x="1002" y="414" class="small">Includes platform-base / flux2</text>
      </g>
      <g id="AppSource" class="data">
        <rect x="870" y="475" width="265" height="65"/>
        <text x="1002" y="501">tier1-applications</text>
        <text x="1002" y="524" class="small">Delivery branch / separate Git project</text>
      </g>
    </g>
    <g id="Custody" class="custody">
      <rect x="270" y="620" width="885" height="65"/>
      <text x="712" y="646">Independent Tier 1 recovery custody</text>
      <text x="712" y="670" class="small">Accepted revision bundles / pinned artifacts / state / keys / product backups / retrieval receipt</text>
    </g>
  </g>
  <g id="External" class="actor">
    <rect x="20" y="230" width="200" height="110"/>
    <text x="120" y="256">External execution</text>
    <text x="120" y="281" class="small">Ansible Cilium + Flux bootstrap</text>
    <text x="120" y="305" class="small">Approved source maintenance</text>
    <text x="120" y="328" class="small">No Spinnaker dependency</text>
  </g>
  <g id="T0" class="tier0">
    <rect x="250" y="745" width="925" height="135"/>
    <text x="290" y="769">Tier 0</text>
    <g id="Foundation" class="control">
      <rect x="270" y="790" width="520" height="65"/>
      <text x="530" y="816">Infrastructure / cluster lifecycle / trust / recovery foundation</text>
      <text x="530" y="839" class="small">Existing Terraform / Ansible / product owners</text>
    </g>
    <g id="Tier0Flux" class="control">
      <rect x="830" y="790" width="325" height="65"/>
      <text x="992" y="816">Independent Tier 0 Flux</text>
      <text x="992" y="839" class="small">Own sources, credentials and recovery</text>
    </g>
  </g>
  <path class="connection" data-from="External" data-to="Runtime" d="M220 265 H270"/>
  <path class="connection" data-from="Spinnaker" data-to="Promotion" d="M395 300 V320"/>
  <text x="447" y="316" class="label">Run Job</text>
  <path class="connection" data-from="Promotion" data-to="Authority" d="M500 347 H520 V447 H500"/>
  <text x="533" y="401" class="namespace" transform="rotate(-90 533 401)">HTTPS</text>
  <path class="connection" data-from="Authority" data-to="Credentials" d="M395 475 V505"/>
  <path class="connection" data-from="Flux" data-to="Platform" d="M675 300 V345"/>
  <text x="728" y="329" class="label">Reconcile</text>
  <path class="connection" data-from="Flux" data-to="Applications" d="M800 265 H810 V515 H800"/>
  <path class="connection" data-from="Flux" data-to="Sources" d="M800 265 H850"/>
  <text x="835" y="253" class="label">Read</text>
  <path class="connection" data-from="Authority" data-to="AppSource" d="M500 460 H535 V577 H1145 V507 H1135"/>
  <text x="790" y="574" class="label">Approved application Git write</text>
  <path class="connection" data-from="Platform" data-to="State" d="M675 420 V440"/>
  <path class="logical" data-from="Custody" data-to="State" d="M1100 620 V606 H830 V455 H800"/>
  <text x="708" y="604" class="label">Product restore</text>
  <path class="logical" data-from="Custody" data-to="External" d="M270 653 H120 V340"/>
  <rect x="47" y="586" width="164" height="26" fill="#f8fafc" stroke="none"/>
  <text x="129" y="605" class="label">Retained inputs</text>
  <path class="logical" data-from="Runtime" data-to="T2" d="M815 185 V110"/>
</svg>
