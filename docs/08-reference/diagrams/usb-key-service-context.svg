<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">USB key services and consumer authorization</title>
  <desc id="description">Authorized consumers select the optional signing API or direct pinned
    PKCS11 access. The signing API authenticates callers, applies key and operation policy, audits
    requests and retains its own state. Direct PKCS11 consumers own application authorization.
    A selected provider host performs operations using its local USB HSM. Additional pinned members
    require qualified application failover. Independent device backups and signing-service recovery
    custody remain below connected runtimes inside Tier 0.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier0 { fill: #c8c8c8; stroke: #707070; color: #262626; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .replicas { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .runtime { fill: #d9eeec; stroke: #4d7b77; color: #173f3e; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .traffic { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .tier0, .runtime, .actor, .traffic, .control, .data, .custody { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T0" class="tier0">
    <rect x="230" y="20" width="710" height="680"/>
    <text x="585" y="45">Tier 0</text>
    <g id="Online" class="group">
      <rect x="250" y="125" width="670" height="390"/>
      <text x="585" y="150">Key Services</text>
      <g id="API" class="runtime">
        <rect x="270" y="170" width="280" height="325"/>
        <text x="410" y="194">Optional Signing API</text>
        <g id="Interface" class="traffic">
          <polygon points="290,215 530,215 545,240 530,265 290,265 275,240"/>
          <text x="410" y="246">Authenticated API requests</text>
        </g>
        <g id="Policy" class="control">
          <rect x="290" y="300" width="240" height="65"/>
          <text x="410" y="325">Identity / key / operation policy</text>
          <text x="410" y="348">Audit</text>
        </g>
        <g id="State" class="data">
          <path d="M290 424 C290 407 530 407 530 424 L530 467 C530 484 290 484 290 467 Z"/>
          <path d="M290 424 C290 441 530 441 530 424" fill="none"/>
          <text x="410" y="451">Signing API state</text>
          <text x="410" y="474">Own persistent data</text>
        </g>
        <path class="connection" data-from="Interface" data-to="Policy" d="M410 265 V300"/>
        <path class="connection" data-from="Policy" data-to="State" d="M410 365 V411"/>
        <text x="455" y="393" class="edge-label">Persist</text>
      </g>
      <g id="Pool" class="replicas">
        <rect x="650" y="170" width="250" height="325"/>
        <text x="775" y="194">Pinned Provider Members</text>
        <g id="ProviderA" class="runtime">
          <rect x="670" y="210" width="210" height="90"/>
          <text x="775" y="239">Selected provider host</text>
          <text x="775" y="265">Local USB HSM</text>
          <text x="775" y="287">Token permissions</text>
        </g>
        <g id="ProviderB" class="runtime">
          <rect x="670" y="365" width="210" height="105"/>
          <text x="775" y="390">Additional pinned hosts</text>
          <text x="775" y="415">One local USB HSM each</text>
          <text x="775" y="441">Qualified app failover</text>
        </g>
      </g>
      <path class="connection" data-from="Policy" data-to="ProviderA" d="M530 330 H600 V270 H670"/>
      <rect x="552" y="341" width="94" height="39" fill="#f8fafc" stroke="none"/>
      <text x="599" y="356" class="edge-label">PKCS#11</text>
      <text x="599" y="374" class="edge-label">Selected member</text>
    </g>
    <g id="Custody" class="custody">
      <rect x="250" y="560" width="670" height="120"/>
      <text x="585" y="586">Offline Custody</text>
      <text x="585" y="616">Device-specific original-key backups / recovery material</text>
      <text x="585" y="646">Independent signing-service state / credentials</text>
    </g>
  </g>
  <g id="Clients" class="actor">
    <rect x="20" y="205" width="180" height="125"/>
    <text x="110" y="230">Authorized consumers</text>
    <text x="110" y="256">Issuer / application /</text>
    <text x="110" y="278">development signer</text>
    <text x="110" y="310">Own application policy</text>
  </g>
  <path class="connection" data-from="Clients" data-to="Interface" d="M200 240 H275"/>
  <rect x="211" y="201" width="59" height="36" fill="#f8fafc" stroke="none"/>
  <text x="240" y="215" class="edge-label">Optional</text>
  <text x="240" y="232" class="edge-label">API</text>
  <path class="connection" data-from="Clients" data-to="ProviderA" d="M110 205 V85 H635 V225 H670"/>
  <text x="405" y="72" class="edge-label">Pinned PKCS#11 / trusted application</text>
</svg>
