<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720"
     role="img" aria-labelledby="title description">
  <title id="title">Verified software acquisition and publication</title>
  <desc id="description">Accepted external sources sit left of the top Tier 2 proxy. The Tier 1 worker acquires through that proxy and publishes accepted versions. A Tier 0 consumer pulls selected publication and keeps independent recovery supply below its connected runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581"/>
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier2 { fill: #f6f3ef; stroke: #aca59b; color: #4b443c; }
      .tier1 { fill: #e9e2d8; stroke: #968976; color: #44382a; }
      .tier0 { fill: #d8cbb9; stroke: #83715a; color: #352a1e; }
      .zoneEdge { fill: #fff0f3; stroke: #9b4d67; color: #502638; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .traffic { fill: #303841; stroke: #8a9baa; color: #ffffff; }
      .services { fill: #e7f0fc; stroke: #4d719b; color: #203a5b; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .custody { fill: #fff2d1; stroke: #926820; color: #584013; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .tier2, .tier1, .tier0, .zoneEdge, .traffic, .services, .control, .data, .custody, .actor { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T2" class="tier2">
    <rect x="250" y="20" width="690" height="155"/>
    <text x="595" y="43">Tier 2</text>
    <g id="DMZ" class="zoneEdge">
      <rect x="270" y="60" width="650" height="100"/>
      <text x="595" y="82">Edge / DMZ</text>
      <g id="Proxy" class="traffic">
        <polygon points="400,100 630,100 645,125 630,150 400,150 385,125"/>
        <text x="515" y="131">Policy proxy / cache</text>
      </g>
    </g>
  </g>
  <g id="T1" class="tier1">
    <rect x="250" y="215" width="690" height="200"/>
    <text x="595" y="238">Tier 1</text>
    <g id="Intake" class="group">
      <rect x="270" y="255" width="340" height="140"/>
      <text x="440" y="279">Acquisition / Assessment</text>
      <g id="Worker" class="services">
        <rect x="290" y="300" width="300" height="70"/>
        <text x="440" y="330">Verify / scan / quarantine</text>
        <text x="440" y="352">No Tier 0 credentials</text>
      </g>
    </g>
    <g id="Supply" class="data">
      <path d="M735 288 C735 272 915 272 915 288 L915 365 C915 381 735 381 735 365 Z"/>
      <path d="M735 288 C735 304 915 304 915 288" fill="none"/>
      <text x="825" y="328">Approved publication</text>
      <text x="825" y="351">Retained versions</text>
    </g>
    <path class="connection" data-from="Worker" data-to="Supply" d="M590 330 L735 330"/>
    <text x="662" y="318" class="edge-label">Publish accepted</text>
  </g>
  <g id="T0" class="tier0">
    <rect x="250" y="455" width="690" height="240"/>
    <text x="595" y="478">Tier 0</text>
    <g id="Connected" class="group">
      <rect x="270" y="495" width="650" height="100"/>
      <text x="595" y="517">Connected Consumer</text>
      <g id="Consumer" class="control">
        <rect x="290" y="530" width="300" height="50"/>
        <text x="440" y="550">Independent verification</text>
        <text x="440" y="570">Selected updates</text>
      </g>
    </g>
    <g id="Retained" class="custody">
      <rect x="270" y="615" width="650" height="60"/>
      <text x="595" y="640">Retained supply</text>
      <text x="595" y="663">Independent recovery custody</text>
    </g>
  </g>
  <g id="Sources" class="actor">
    <rect x="20" y="90" width="210" height="70"/>
    <text x="125" y="120">Accepted external</text>
    <text x="125" y="142">sources</text>
  </g>
  <path class="connection" data-from="Proxy" data-to="Sources" d="M385 125 L230 125"/>
  <rect x="240" y="95" width="134" height="22" fill="#f8fafc" stroke="none"/>
  <text x="307" y="111" class="edge-label">Allowed requests</text>
  <path class="connection" data-from="Worker" data-to="Proxy" d="M310 300 L310 195 L515 195 L515 150"/>
  <rect x="333" y="176" width="154" height="22" fill="#f8fafc" stroke="none"/>
  <text x="410" y="188" class="edge-label">Acquire through proxy</text>
  <path class="connection" data-from="Consumer" data-to="Supply" d="M590 555 L670 555 L670 350 L735 350"/>
  <rect x="687" y="422" width="157" height="24" fill="#f8fafc" stroke="none"/>
  <text x="765" y="438" class="edge-label">Pull selected version</text>
</svg>
