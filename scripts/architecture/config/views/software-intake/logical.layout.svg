<svg data-view-id="VIEW-software-intake-logical" xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Software intake | Logical design</title>
  <desc id="description">Approved external sources sit left of the Tier 2 policy proxy. Update clients from separate owners request its actual interface from below. The cache is disposable storage, not approved supply.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#627581" />
    </marker>
    <style>
      svg { font: 15px Arial, sans-serif; }
      text { fill: currentColor; stroke: none; text-anchor: middle; }
      .tier2 { fill: #f2f2f2; stroke: #a6a6a6; color: #404040; }
      .zoneEdge { fill: #fff0f3; stroke: #9b4d67; color: #502638; }
      .edge { fill: #fce8ec; stroke: #9b4d67; color: #502638; }
      .data { fill: #eeeafa; stroke: #78639b; color: #42325d; }
      .actor { fill: #edf0f3; stroke: #697682; color: #293642; }
      .group { fill: #f5f6f7; stroke: #89939e; color: #273340; stroke-dasharray: 2 3; }
      .services { fill: #e7f0fc; stroke: #4d719b; color: #203a5b; }
      .control { fill: #e2f3ed; stroke: #397366; color: #173f36; }
      .tier2, .zoneEdge, .traffic, .data, .actor, .services, .control { stroke-dasharray: none; }
      .connection { fill: none; stroke: #627581; stroke-width: 1.5; stroke-dasharray: none; marker-end: url(#arrow); }
      .edge-label { fill: #1f2937; font-size: 13px; }
    </style>
  </defs>
  <g id="T2" class="tier2" data-context="classification" data-explanatory="true">
    <rect x="250" y="20" width="690" height="395" />
    <text x="595" y="45">Tier 2 · responsibility grouping</text>
    <g id="DMZ" class="zoneEdge" data-context="classification" data-explanatory="true">
      <rect x="270" y="65" width="650" height="330" />
      <text x="595" y="92">Edge / DMZ · zone grouping</text>
      <g id="Proxy" class="edge" data-model="L-Proxy">
        <rect x="395" y="130" width="250" height="80" />
        <text x="520" y="161">Policy proxy /</text>
        <text x="520" y="184">HTTP cache</text>
      </g>
      <g id="Cache" class="data" data-model="L-Cache">
        <path d="M365 285 C365 266 675 266 675 285 L675 370 C675 389 365 389 365 370 Z" />
        <path d="M365 285 C365 304 675 304 675 285" fill="none" />
        <text x="520" y="318">Rebuildable cache storage</text>
        <g id="CachedContent" class="information" data-model="L-cached-content">
          <rect x="385" y="331" width="270" height="42" rx="2" />
          <text x="520" y="346" class="kind-label" font-size="10px">«item»</text>
          <text x="520" y="363" font-size="14px">Cached content</text>
        </g>
      </g>
      <path class="connection" data-from="Proxy" data-to="Cache" d="M520 210 L520 272" data-relation="L-cache-io" />
      <text x="612" y="242" class="edge-label">Disposable storage</text>
    </g>
  </g>
  <g id="Sources" class="actor" data-model="L-Sources">
    <rect x="20" y="130" width="210" height="80" />
    <text x="125" y="162">Approved</text>
    <text x="125" y="185">external sources</text>
  </g>
  <g id="Consumers" class="group" data-model="L-Consumers">
    <rect x="250" y="475" width="690" height="220" />
    <text x="595" y="502">Update Consumers</text>
    <g id="Workloads" class="actor" data-model="L-Workloads">
      <rect x="280" y="540" width="185" height="100" />
      <text x="372" y="581">Workload</text>
      <text x="372" y="604">update clients</text>
    </g>
    <g id="Platform" class="actor" data-model="L-Platform">
      <rect x="490" y="540" width="185" height="100" />
      <text x="582" y="581">Platform</text>
      <text x="582" y="604">update clients</text>
    </g>
    <g id="Control" class="actor" data-model="L-Control">
      <rect x="700" y="540" width="190" height="100" />
      <text x="795" y="581">Infrastructure</text>
      <text x="795" y="604">update clients</text>
    </g>
  </g>
  <path class="connection" data-from="Proxy" data-to="Sources" d="M395 170 L230 170" data-relation="L-upstream" />
  <rect x="247" y="135" width="132" height="25" fill="#f8fafc" stroke="none" />
  <text x="313" y="152" class="edge-label">Source requests</text>
  <path class="connection" data-from="Consumers" data-to="Proxy" d="M595 475 L595 445 L745 445 L745 170 L645 170" data-relation="L-request" />
  <rect x="625" y="425" width="121" height="25" fill="#f8fafc" stroke="none" />
  <text x="685" y="442" class="edge-label">Proxy requests</text>
</svg>
