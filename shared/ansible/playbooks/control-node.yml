---
- name: Prepare deployment control node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    control_node_selected_setup: "{{ control_node_setup | default('site') }}"
    # Disconnected/prebuilt controllers validate preinstalled collections without acquisition.
    control_node_collections_mode: >-
      {{ lookup('ansible.builtin.env', 'CONTROL_NODE_COLLECTIONS_MODE') | default('auto', true) }}
    control_node_base_collection_catalog:
      ansible.utils:
        name: ansible.utils
        version: '>=6.0.0,<7.0.0'
        os_packages:
          RedHat: [python3-netaddr]
          Debian: [python3-netaddr]
      community.general:
        name: community.general
        version: '>=10.2.0,<11.0.0'
        os_packages:
          RedHat:
            - ansible-collection-community-general
          Debian:
            - ansible-collection-community-general
      ansible.posix:
        name: ansible.posix
        version: '>=1.5.0,<3.0.0'
        os_packages:
          RedHat:
            - ansible-collection-ansible-posix
          Debian:
            - ansible-collection-ansible-posix
      community.crypto:
        name: community.crypto
        version: '>=2.26.0,<3.0.0'
        os_packages:
          RedHat: [ansible-collection-community-crypto]
          Debian: [ansible]

  tasks:
    - name: Validate collection preparation mode
      ansible.builtin.assert:
        that: control_node_collections_mode in ['auto', 'check']
        fail_msg: CONTROL_NODE_COLLECTIONS_MODE must be auto or check.

    - name: Gather deployment control-node facts
      ansible.builtin.setup:
        gather_subset:
          - min

    - name: Validate selected setup precheck mapping
      ansible.builtin.assert:
        that:
          - control_node_setup_collection_names is defined
          - control_node_selected_setup in control_node_setup_collection_names
        fail_msg: >-
          Run the owning tier's ansible/playbooks/control-node.yml entry point.
          Its control_node_setup_collection_names must include
          {{ control_node_selected_setup }}.

    - name: Resolve required collections for selected setup
      ansible.builtin.set_fact:
        control_node_missing_collections: []
        control_node_collection_packages: []
        control_node_still_missing_collections: []
        control_node_required_collections: >-
          {{
            (selected_collections + ['community.general'] if selected_collections | length > 0 else [])
            | unique
            | map('extract', control_node_base_collection_catalog
              | combine(control_node_collection_catalog | default({})))
            | list
          }}
      vars:
        # The native version lookup is also used for setups without general modules.
        selected_collections: "{{ control_node_setup_collection_names[control_node_selected_setup] }}"

    - name: Show selected setup collection precheck
      ansible.builtin.debug:
        msg: >-
          Setup {{ control_node_selected_setup }} requires Ansible collections:
          {{
            control_node_required_collections | map(attribute='name') | join(', ')
            if control_node_required_collections | length > 0
            else 'none'
          }}.

    - name: Require the declared engine for collections outside the bootstrap baseline
      ansible.builtin.assert:
        that: ansible_version.full is ansible.builtin.version(item.min_ansible_core, '>=')
        fail_msg: >-
          Setup {{ control_node_selected_setup }} requires ansible-core >= {{ item.min_ansible_core }}
          for {{ item.name }}; this controller runs {{ ansible_version.full }}.
          Select the accepted isolated runtime before retrying. Proxmox template commands prepare
          their runtime through scripts/proxmox-templates.sh; do not replace system Ansible with pip.
      loop: "{{ control_node_required_collections }}"
      when: item.min_ansible_core is defined

    - name: Verify Terraform is installed on the deployment machine
      ansible.builtin.command:
        argv:
          - terraform
          - version
      changed_when: false
      check_mode: false
      when: control_node_require_terraform | default(true) | bool

    - name: Check selected native deployment tools without acquiring binaries
      ansible.builtin.command:
        argv: "{{ item }}"
      loop: "{{ (control_node_setup_tool_commands | default({})).get(control_node_selected_setup, []) }}"
      register: control_node_tool_checks
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require approved native tools before deployment changes
      ansible.builtin.assert:
        that: item.rc | default(1) == 0
        fail_msg: >-
          Setup {{ control_node_selected_setup }} cannot run {{ item.item | join(' ') }}.
          Prepare this tool through the approved bootstrap artifact/package inputs and retry.
          The precheck never downloads standalone binaries. See docs/08-reference/control-node-tooling.md.
      loop: "{{ control_node_tool_checks.results }}"
      loop_control:
        label: "{{ item.item | join(' ') }}"

    - name: Check required Ansible collections
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - list
          - "{{ item.name }}"
      loop: "{{ control_node_required_collections }}"
      register: control_node_collection_checks
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Track missing Ansible collections
      ansible.builtin.set_fact:
        control_node_missing_collections: >-
          {{ (control_node_missing_collections | default([])) + [item.item] }}
      loop: "{{ control_node_collection_checks.results | default([]) }}"
      when: item.rc != 0 or item.item.name not in item.stdout

    - name: Build OS package list for missing Ansible collections
      ansible.builtin.set_fact:
        control_node_collection_packages: >-
          {{
            (control_node_collection_packages | default([]))
            + (item.os_packages[ansible_os_family] | default([]))
          }}
      loop: "{{ control_node_missing_collections | default([]) }}"

    - name: Require preinstalled collections in check mode
      ansible.builtin.assert:
        that: control_node_missing_collections | length == 0
        fail_msg: >-
          Missing collections: {{ control_node_missing_collections | map(attribute='name') | join(', ') }}.
          Install the prepared local Galaxy requirements before retrying; check mode never downloads dependencies.
          See docs/03-deployment/foundation/bootstrap/step-3e-bootstrap-offline.md.
      when: control_node_collections_mode == 'check' or ansible_check_mode

    - name: Install missing Ansible collections from OS packages first
      ansible.builtin.package:
        name: "{{ control_node_collection_packages | unique | list }}"
        state: present
      become: true
      register: control_node_os_package_install
      failed_when: false
      when:
        - control_node_collections_mode == 'auto'
        - not ansible_check_mode
        - (control_node_collection_packages | default([]) | length) > 0

    - name: Re-check required Ansible collections after OS packages
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - list
          - "{{ item.name }}"
      loop: "{{ control_node_missing_collections | default([]) }}"
      register: control_node_collection_rechecks
      failed_when: false
      changed_when: false
      check_mode: false
      when: (control_node_missing_collections | default([]) | length) > 0

    - name: Track collections still missing after OS package install
      ansible.builtin.set_fact:
        control_node_still_missing_collections: >-
          {{ (control_node_still_missing_collections | default([])) + [item.item] }}
      loop: "{{ control_node_collection_rechecks.results | default([]) }}"
      when: item.rc != 0 or item.item.name not in item.stdout

    - name: Explain native collection version convergence
      ansible.builtin.debug:
        msg: >-
          Check declared version ranges with Galaxy after the OS package attempt.
          Galaxy inherits this process's proxy environment and bypasses its local API-response cache.
          Acquisition needs approved Galaxy API and artifact destinations; see
          docs/08-reference/control-node-tooling.md#galaxy-through-a-policy-proxy.
          Pre-stage every selected range before using CONTROL_NODE_COLLECTIONS_MODE=check.
          Incompatible shadowing copies must be corrected explicitly.
      when:
        - control_node_collections_mode == 'auto'
        - control_node_required_collections | length > 0

    - name: Install missing or incompatible Ansible collections with native Galaxy ranges
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - install
          - --no-cache
          - "{{ item.name ~ (':' ~ item.version if item.version is defined else '') }}"
      loop: "{{ control_node_required_collections }}"
      when:
        - control_node_collections_mode | default('auto') == 'auto'
        - not ansible_check_mode
        - item.version is defined or item in control_node_still_missing_collections
      register: control_node_galaxy_install
      changed_when: "'was installed successfully' in control_node_galaxy_install.stdout"

    - name: Require the effective collection version to satisfy every declared bound
      ansible.builtin.assert:
        that:
          - installed_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
          - version_compatible | bool
        fail_msg: >-
          {{ item.name }} resolves to {{ installed_version | default('unknown', true) }},
          but requires {{ item.version }}. Correct outdated or unversioned collections earlier
          on Ansible's search path; installing another shadowed copy is insufficient.
          Incompatible newer copies must also be removed or replaced; the bootstrap dependency
          ranges deliberately retain collection lines compatible with ansible-core 2.16.
      vars:
        installed_version: >-
          {{ lookup('community.general.collection_version', item.name,
                    result_not_found='', result_no_version='') }}
        version_compatible: >-
          {%- set result = namespace(accepted=true) -%}
          {%- for bound in item.version.split(',') | map('trim') -%}
          {%- if bound != '*' -%}
          {%- set operator = bound | regex_search('^(>=|<=|==|!=|>|<|=)') | default('==', true) -%}
          {%- set required = bound | regex_replace('^(>=|<=|==|!=|>|<|=)', '') -%}
          {%- if installed_version is not ansible.builtin.version(required, operator, version_type='semver') -%}
          {%- set result.accepted = false -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {{ result.accepted }}
      loop: "{{ control_node_required_collections }}"
      when: item.version is defined

    - name: Prepare controller Python clients for selected collections
      ansible.builtin.include_tasks: tasks/control-node-python.yml
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: control_node_required_collections | length > 0

    - name: Prepare controller Python for network filters
      ansible.builtin.include_tasks: tasks/control-node-network-filters.yml
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        control_node_network_filter_requirement: netaddr>=0.10.1
      when: "'ansible.utils' in (control_node_required_collections | map(attribute='name') | list)"
