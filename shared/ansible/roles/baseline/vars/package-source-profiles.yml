---
rpm_roots:
  Rocky: https://dl.rockylinux.org/pub/rocky
  AlmaLinux: https://repo.almalinux.org/almalinux
rpm_trees:
  baseos: BaseOS
  appstream: AppStream
  extras: extras
  crb: CRB
  powertools: PowerTools
  highavailability: HighAvailability
  resilientstorage: ResilientStorage
  nfv: NFV
  rt: RT
  devel: devel
epel_urls:
  epel: https://dl.fedoraproject.org/pub/epel/$releasever/Everything/$basearch/
  epel-testing: https://dl.fedoraproject.org/pub/epel/testing/$releasever/Everything/$basearch/
apt_files:
  Debian: [debian.sources, debian.list]
  Ubuntu: [ubuntu.sources, ubuntu.list]
apt_replacements:
  Debian:
    - regexp: 'mirror\+file:/{1,3}etc/apt/mirrors/debian-security\.list(?=\s|$)'
      replace: https://security.debian.org/debian-security
    - regexp: 'mirror\+file:/{1,3}etc/apt/mirrors/debian\.list(?=\s|$)'
      replace: https://deb.debian.org/debian
    - regexp: 'https?://[^\s/]+/debian-security/?(?=\s|$)'
      replace: https://security.debian.org/debian-security
    - regexp: 'https?://[^\s/]+/debian/?(?=\s|$)'
      replace: https://deb.debian.org/debian
  Ubuntu:
    - regexp: 'mirror(?:\+https?)?://mirrors\.ubuntu\.com/mirrors\.txt(?=\s|$)'
      replace: https://archive.ubuntu.com/ubuntu
    - regexp: 'https?://(?!security\.ubuntu\.com(?:/|:))[^\s/]+/ubuntu/?(?=\s|$)'
      replace: https://archive.ubuntu.com/ubuntu
    - regexp: 'http://security\.ubuntu\.com/ubuntu/?(?=\s|$)'
      replace: https://security.ubuntu.com/ubuntu
  UbuntuPorts:
    - regexp: 'mirror(?:\+https?)?://mirrors\.ubuntu\.com/mirrors\.txt(?=\s|$)'
      replace: https://ports.ubuntu.com/ubuntu-ports
    - regexp: 'https?://[^\s/]+/(?:ubuntu|ubuntu-ports)/?(?=\s|$)'
      replace: https://ports.ubuntu.com/ubuntu-ports
