---
- name: Require every expected inventory node to become Ready
  ansible.builtin.include_tasks: health.yml
  vars:
    cluster_platform_health:
      api_version: v1
      kind: Node
      name: "{{ cluster_platform_node }}"
      condition: Ready
  loop: "{{ cluster_platform_expected_nodes }}"
  loop_control:
    loop_var: cluster_platform_node
