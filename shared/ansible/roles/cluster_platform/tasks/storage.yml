---
- name: Require the selected storage class
  ansible.builtin.include_tasks: health.yml
  vars:
    cluster_platform_health:
      api_version: storage.k8s.io/v1
      kind: StorageClass
      name: "{{ cluster_platform_storage_class }}"

- name: Read the selected class provisioner
  ansible.builtin.set_fact:
    cluster_platform_storage_provisioner: "{{ cluster_platform_observed.resources[0].provisioner }}"

- name: Require CSI storage and the selected native driver when installed here
  ansible.builtin.assert:
    that:
      - not cluster_platform_storage_provisioner.startswith('kubernetes.io/')
      - cluster_platform_storage_provider != 'nfs' or cluster_platform_storage_provisioner == 'nfs.csi.k8s.io'
      - cluster_platform_storage_provider != 'ceph_rbd' or cluster_platform_storage_provisioner == 'rbd.csi.ceph.com'
    fail_msg: The selected class must use a registered CSI driver; class existence does not qualify persistence.

- name: Require the selected native CSI driver registration
  ansible.builtin.include_tasks: health.yml
  vars:
    cluster_platform_health:
      api_version: storage.k8s.io/v1
      kind: CSIDriver
      name: "{{ cluster_platform_storage_provisioner }}"

- name: Require RBD registration on every intended consumer node
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cluster_platform_kubeconfig }}"
    context: "{{ cluster_platform_context | default(omit, true) }}"
    validate_certs: true
    api_version: storage.k8s.io/v1
    kind: CSINode
    name: "{{ item }}"
  register: cluster_platform_csi_node
  until:
    - cluster_platform_csi_node.resources | default([]) | length == 1
    - >-
      (cluster_platform_csi_node.resources | first | default({})).get('spec', {}).get('drivers', [])
      | selectattr('name', 'equalto', 'rbd.csi.ceph.com') | list | length == 1
  retries: "{{ cluster_platform_health_retries }}"
  delay: "{{ cluster_platform_health_delay }}"
  loop: "{{ cluster_platform_expected_nodes }}"
  when: cluster_platform_storage_provider == 'ceph_rbd'
