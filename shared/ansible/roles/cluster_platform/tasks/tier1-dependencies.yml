---
- name: Establish the existing-storage readiness gate without claiming data recovery
  ansible.builtin.set_fact:
    cluster_platform_flux_stages: >-
      {{ [{'name': 'platform-base-storage-existing', 'resources': [],
           'health': [{'apiVersion': 'storage.k8s.io/v1', 'kind': 'StorageClass',
                       'name': cluster_platform_storage_class}]}]
         if 'storage' in cluster_platform_components and cluster_platform_storage_provider == 'existing'
         else [] }}
    cluster_platform_flux_releases: []
    cluster_platform_flux_release_names: "{{ cluster_platform_releases | map(attribute='name') | list }}"

- name: Preserve controller and data prerequisites in the asynchronous Flux graph
  ansible.builtin.set_fact:
    cluster_platform_flux_releases: >-
      {{ cluster_platform_flux_releases + [item | combine({
           'depends_on': prerequisites,
           'after_depends_on': after_prerequisites})] }}
  vars:
    prerequisites: >-
      {{ ([{'name': 'platform-base-cilium-release'}]
          if item.component != 'cilium' and 'cilium' in cluster_platform_flux_release_names else [])
         + ([{'name': 'platform-base-cloudnative-pg-release'}, {'name': 'platform-base-cert-manager-release'}]
            if item.component == 'barman_cloud' else []) }}
    after_prerequisites: >-
      {{ ([{'name': 'platform-base-traefik-release'}]
          if item.component == 'cert_manager' and 'traefik' in cluster_platform_flux_release_names else [])
         + ([{'name': 'platform-base-storage-existing'}]
            if item.component == 'cloudnative_pg' and cluster_platform_database_enabled | bool
               and cluster_platform_storage_provider == 'existing' else [])
         + ([{'name': 'platform-base-' ~
                       (cluster_platform_ceph_rbd_chart.name if cluster_platform_storage_provider == 'ceph_rbd'
                        else cluster_platform_catalog.storage.name) ~ '-after'}]
            if item.component == 'cloudnative_pg' and cluster_platform_database_enabled | bool
               and cluster_platform_storage_provider != 'existing' else []) }}
  loop: "{{ cluster_platform_releases }}"
  loop_control: {label: "{{ item.component }}"}
