---
- name: Reestablish controlling owner and descendant fences using original identities
  ansible.builtin.include_tasks: scope-resource.yml
  vars:
    scope_resource: "{{ flux_maintenance_scope_receipt.resources[scope_key] }}"
    scope_suspend: true
  loop: "{{ flux_maintenance_scope_receipt.suspend_order }}"
  loop_control: {loop_var: scope_key}

- name: Reestablish writer shutdown using the retained identities
  ansible.builtin.include_tasks: writer-resource.yml
  vars:
    writer_resource: "{{ item.value }}"
    writer_resume: false
  loop: "{{ flux_maintenance_scope_receipt.writers | default({}) | dict2items }}"
  loop_control: {label: "{{ item.key }}"}

- name: Record the reestablished pause without replacing original states
  ansible.builtin.set_fact:
    flux_maintenance_scope_receipt: "{{ flux_maintenance_scope_receipt | combine({'phase': 'paused'}) }}"

- name: Persist the reestablished scoped pause
  ansible.builtin.copy:
    dest: "{{ flux_maintenance_output }}/scope-receipt.json"
    content: "{{ flux_maintenance_scope_receipt | to_nice_json }}"
    mode: '0600'
