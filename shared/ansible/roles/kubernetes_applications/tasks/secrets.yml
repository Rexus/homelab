---
- name: Validate explicitly managed required secret fields
  ansible.builtin.assert:
    that:
      - secret_id in kube_apps_secrets
      - item['keys'] | difference(kube_apps_secrets.get(secret_id, {}).keys() | list) | length == 0
      - item['keys'] | map('extract', kube_apps_secrets.get(secret_id, {})) | select('equalto', '') | list | length == 0
    fail_msg: Supply nonempty private secret fields or use the existing secret-controller owner.
  vars:
    secret_id: "{{ kube_app.namespace }}/{{ item.name }}"
  loop: "{{ kube_app.required_secrets | default([]) }}"
  when: kube_apps_manage_secrets | bool
  no_log: true

- name: Apply required bootstrap secrets only under explicit ownership
  kubernetes.core.k8s:
    kubeconfig: "{{ kube_apps_kubeconfig }}"
    context: "{{ kube_apps_context | default(omit, true) }}"
    validate_certs: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ kube_app.namespace }}"
      type: "{{ item.type | default('Opaque') }}"
      stringData: "{{ kube_apps_secrets[kube_app.namespace ~ '/' ~ item.name] }}"
  loop: "{{ kube_app.required_secrets | default([]) }}"
  when:
    - kube_apps_action == 'apply'
    - kube_apps_manage_secrets | bool
  no_log: true

- name: Read required existing secrets without disclosing values
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kube_apps_kubeconfig }}"
    context: "{{ kube_apps_context | default(omit, true) }}"
    validate_certs: true
    api_version: v1
    kind: Secret
    name: "{{ item.name }}"
    namespace: "{{ kube_app.namespace }}"
  register: kube_app_secret_checks
  loop: "{{ kube_app.required_secrets | default([]) }}"
  when: kube_apps_action == 'apply'
  no_log: true

- name: Reject missing or empty credentials before application installation
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.item['keys'] | difference((item.resources | first | default({})).get('data', {}).keys() | list) | length == 0
      - item.item['keys'] | map('extract', (item.resources | first | default({})).get('data', {})) | select('equalto', '') | list | length == 0
    fail_msg: Required application secrets must exist before installing the chart.
  loop: "{{ kube_app_secret_checks.results | default([]) }}"
  when: kube_apps_action == 'apply'
  no_log: true
