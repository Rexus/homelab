---
- name: Read the existing backup-only claim
  kubernetes.core.k8s_info:
    kubeconfig: "{{ postgresql_file_backup_kubeconfig }}"
    context: "{{ postgresql_file_backup_context | default(omit, true) }}"
    validate_certs: true
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ postgresql_file_backup_target.namespace }}"
    name: "{{ postgresql_file_backup_target.claim }}"
  register: postgresql_file_backup_claim

- name: Require a bound filesystem claim distinct from database claims
  ansible.builtin.assert:
    that:
      - postgresql_file_backup_claim.resources | length == 1
      - postgresql_file_backup_claim.resources[0].status.phase == 'Bound'
      - postgresql_file_backup_claim.resources[0].spec.get('volumeMode', 'Filesystem') == 'Filesystem'
      - postgresql_file_backup_claim.resources[0].metadata.get('labels', {}).get('cnpg.io/cluster', '') == ''
    fail_msg: Commission a separate NAS backup PVC, never a CNPG data/WAL claim.

- name: Read the destination volume's actual CSI source
  kubernetes.core.k8s_info:
    kubeconfig: "{{ postgresql_file_backup_kubeconfig }}"
    context: "{{ postgresql_file_backup_context | default(omit, true) }}"
    validate_certs: true
    api_version: v1
    kind: PersistentVolume
    name: "{{ postgresql_file_backup_claim.resources[0].spec.volumeName }}"
  register: postgresql_file_backup_volume

- name: Require the commissioned NFS volume handle and retained custody
  ansible.builtin.assert:
    that:
      - postgresql_file_backup_volume.resources | length == 1
      - postgresql_file_backup_volume.resources[0].spec.csi.driver == 'nfs.csi.k8s.io'
      - postgresql_file_backup_volume.resources[0].spec.csi.volumeHandle == postgresql_file_backup_target.volume_handle
      - postgresql_file_backup_volume.resources[0].spec.persistentVolumeReclaimPolicy == 'Retain'
    fail_msg: The backup destination must be the exact commissioned retained NFS CSI volume.
