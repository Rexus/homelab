---
- name: Check Tier 0 deployment tooling
  ansible.builtin.import_playbook: ../../../shared/ansible/playbooks/control-node.yml
  vars:
    control_node_collection_catalog:
      ansible.mariadb:
        name: ansible.mariadb
        os_packages:
          RedHat: []
          Debian: []
      freeipa.ansible_freeipa:
        name: freeipa.ansible_freeipa
        os_packages:
          RedHat: [ansible-freeipa]
          Debian: [ansible-freeipa]
    control_node_setup_collection_names:
      foundation: [community.general, ansible.posix, freeipa.ansible_freeipa, ansible.mariadb, community.crypto]
      syslog: [community.general, ansible.posix, community.crypto]
      vault: [community.general, ansible.posix]
      hsm: [community.general, ansible.posix]
      ingress: []
      immutable-template: [community.general, ansible.posix]
      template-refresh: []
      proxmox-hosts: []
      site: [community.general, ansible.posix]
