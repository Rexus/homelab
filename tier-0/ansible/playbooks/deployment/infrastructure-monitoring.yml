---
- name: Prepare independent monitoring controller dependencies
  ansible.builtin.import_playbook: ../control-node.yml
  vars:
    control_node_setup: infrastructure-monitoring
    control_node_require_terraform: false

# Use a separately approved host, outside all observed clusters and protected log VMs.
- name: Render or install independent Tier 0 monitoring
  hosts: "{{ infrastructure_monitoring_hosts | default('infrastructure_monitoring') }}"
  gather_facts: false
  become: "{{ infrastructure_monitoring_action | default('render') == 'apply' }}"
  tasks:
    - name: Render or install the selected independent monitor
      ansible.builtin.include_role:
        name: infrastructure_monitoring
