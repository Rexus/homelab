---
- name: Prepare selected deployment tooling
  ansible.builtin.import_playbook: ../control-node.yml
  vars:
    control_node_setup: logging-receiver-request
    control_node_require_terraform: false

- name: Prepare the receiver key and public request without issuing trust
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Use the Tier 0 native certificate request contract
      ansible.builtin.include_role:
        name: logging_authority
        tasks_from: receiver-request
