---
- name: Prepare selected logging credential tooling
  ansible.builtin.import_playbook: ../control-node.yml
  vars:
    control_node_setup: logging-secrets
    control_node_require_terraform: false

- name: Maintain only the independent logging authority credential
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    logging_workflow_repository: "{{ (playbook_dir ~ '/../../..') | realpath }}"
    logging_workflow_workspace: >-
      {{ lookup('ansible.builtin.env', 'HOME') }}/.local/share/{{ logging_workflow_repository | basename }}/logging/{{ platform_environment | default('prod') }}
    logging_workflow_credential_operation: read
    logging_workflow_credential_backend: ansible_vault
  tasks:
    - name: Require the selected independent authority variant and private controller workspace
      ansible.builtin.assert:
        that:
          - logging_workflow_issuer | default('infrastructure') == 'independent'
          - logging_credentials_operation | default(logging_workflow_credential_operation) == logging_workflow_credential_operation
          - logging_credentials_backend | default(logging_workflow_credential_backend) == logging_workflow_credential_backend
          - logging_workflow_workspace != logging_workflow_repository
          - not logging_workflow_workspace.startswith(logging_workflow_repository ~ '/')
        fail_msg: >-
          This entry point is only for logging_workflow_issuer=independent. Use the existing syslog inputs
          and a private workspace outside Git; normal infrastructure PKI does not initialize this secret.

    - name: Inspect the retained authority marker and key without reading private contents
      ansible.builtin.stat:
        path: "{{ logging_workflow_workspace }}/{{ item }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: [authority-created.json, authority/key.pem]
      register: logging_secrets_authority_custody

    - name: Refuse new secret initialization after loss of a previously created authority key
      ansible.builtin.assert:
        that:
          - >-
            logging_workflow_credential_operation != 'initialize'
            or not logging_secrets_authority_custody.results[0].stat.exists
            or (logging_secrets_authority_custody.results[1].stat.isreg | default(false)
            and not (logging_secrets_authority_custody.results[1].stat.islnk | default(false)))
        fail_msg: Restore the original authority key, encrypted recovery input and separately retained unlock file.

    - name: Run only the selected logging credential operation without producer enrollment or certificate issuance
      ansible.builtin.include_role:
        name: logging_credentials
      vars:
        logging_credentials_workspace: "{{ logging_workflow_workspace }}"
        logging_credentials_repository_name: "{{ logging_workflow_repository | basename }}"
        logging_credentials_authority_key_file: "{{ logging_workflow_workspace }}/authority/key.pem"
        logging_credentials_operation: "{{ logging_workflow_credential_operation }}"
        logging_credentials_backend: "{{ logging_workflow_credential_backend }}"

    - name: Report the completed credential operation without printing a secret
      ansible.builtin.debug:
        msg: >-
          Logging credential operation {{ logging_workflow_credential_operation }} completed using
          {{ logging_workflow_credential_backend }}. Encrypted recovery input:
          {{ logging_workflow_workspace }}/credentials/logging-secrets.vault.yml. Keep its unlock file separately in
          {{ logging_credentials_password_directory | default(lookup('ansible.builtin.env', 'HOME') ~
          '/.config/' ~ (logging_workflow_repository | basename) ~ '/logging') }}.
          {{ ('Migration verified: ' ~ (logging_credentials_migration_verified | string) ~ '.')
          if logging_workflow_credential_operation == 'migrate' else '' }}
