---
- name: Prepare controller dependencies for native Proxmox guest maintenance
  ansible.builtin.import_playbook: ../control-node.yml
  tags: [always]
  vars:
    control_node_setup: proxmox-guest-security
    control_node_require_terraform: false

- name: Inspect or add a TPM to one explicitly selected existing VM
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  roles:
    - proxmox_guest_security
