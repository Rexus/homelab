---
- name: Validate foundation identity inputs
  hosts: identity
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate staged FreeIPA inventory shape
      ansible.builtin.assert:
        that:
          - groups.get('identity_primary', []) | length == 1
          - groups.get('identity_replicas', []) | length >= 1
          - platform_domain is defined
          - platform_hostname_prefix is defined
          - platform_hostname_suffix is defined
          - ansible_user is defined
          - ansible_user != "automation-change-me"
          - >-
            groups.get('identity', [])
            | difference(platform_host_ips.keys() | list)
            | length == 0
          - >-
            groups.get('identity', [])
            | map('extract', platform_host_ips)
            | reject('equalto', 'dhcp')
            | select('defined')
            | list
            | length == groups.get('identity', []) | length
          - foundation_freeipa_domain is defined
          - foundation_freeipa_realm is defined
          - foundation_freeipa_dm_password is defined
          - foundation_freeipa_admin_password is defined
          - foundation_freeipa_dm_password != "change-me"
          - foundation_freeipa_admin_password != "change-me"
        fail_msg: >-
          Foundation FreeIPA requires one identity_primary host, at least one
          identity_replicas host, platform_domain, static platform_host_ips
          for every identity host, a real ansible_user, and real encrypted
          FreeIPA passwords.
      run_once: true
      when: foundation_freeipa_enabled | default(false) | bool

- name: Wait for foundation hosts to accept SSH
  hosts: foundation
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Show bootstrap SSH target
      ansible.builtin.debug:
        msg: >-
          Waiting for {{ inventory_hostname }} at
          {{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ ansible_port | default(22) }}
          as {{ ansible_user | default('current user') }}.

    - name: Wait for bootstrap SSH port to open
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        delay: 0
        sleep: "{{ foundation_ssh_wait_sleep | default(3) }}"
        timeout: "{{ foundation_ssh_wait_timeout | default(90) }}"
      delegate_to: localhost
      vars:
        ansible_connection: local
        ansible_host: localhost

    - name: Verify bootstrap SSH login succeeds
      ansible.builtin.wait_for_connection:
        connect_timeout: "{{ foundation_connection_connect_timeout | default(8) }}"
        sleep: "{{ foundation_connection_wait_delay | default(3) }}"
        timeout: >-
          {{
            (foundation_connection_wait_retries | default(10) | int)
            * (foundation_connection_wait_delay | default(3) | int)
          }}

- name: Apply foundation baseline
  hosts: foundation
  become: true
  roles:
    - baseline

- name: Prepare identity hostnames
  hosts: identity
  become: true
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Set system hostname to the identity FQDN
      ansible.builtin.hostname:
        name: "{{ platform_fqdn }}"
      when: foundation_freeipa_enabled | default(false) | bool

- name: Configure the first FreeIPA identity host
  hosts: identity_primary
  become: true
  any_errors_fatal: true
  serial: 1
  roles:
    - role: freeipa.ansible_freeipa.ipaserver
      when: foundation_freeipa_enabled | default(false) | bool

- name: Sanity-check the first FreeIPA identity host
  hosts: identity_primary
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify FreeIPA services on the first identity host
      ansible.builtin.command:
        argv:
          - ipactl
          - status
      changed_when: false
      when: foundation_freeipa_enabled | default(false) | bool

    - name: Wait for FreeIPA API health on the first identity host
      ansible.builtin.command:
        argv:
          - ipa
          - ping
      register: foundation_primary_ipa_ping
      changed_when: false
      until: foundation_primary_ipa_ping.rc == 0
      retries: 12
      delay: 10
      when: foundation_freeipa_enabled | default(false) | bool

- name: Configure FreeIPA replica identity hosts
  hosts: identity_replicas
  become: true
  any_errors_fatal: true
  serial: 1
  roles:
    - role: freeipa.ansible_freeipa.ipareplica
      when: foundation_freeipa_enabled | default(false) | bool

- name: Sanity-check all FreeIPA identity hosts
  hosts: identity
  become: true
  gather_facts: false
  any_errors_fatal: true
  serial: 1
  tasks:
    - name: Verify FreeIPA services on each identity host
      ansible.builtin.command:
        argv:
          - ipactl
          - status
      changed_when: false
      when: foundation_freeipa_enabled | default(false) | bool

    - name: Wait for FreeIPA API health on each identity host
      ansible.builtin.command:
        argv:
          - ipa
          - ping
      register: foundation_identity_ipa_ping
      changed_when: false
      until: foundation_identity_ipa_ping.rc == 0
      retries: 12
      delay: 10
      when: foundation_freeipa_enabled | default(false) | bool
