---
- name: Require an assigned independent recovery target
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Refuse a successful no-host installation
      ansible.builtin.assert:
        that: groups.get('control_recovery', []) | length > 0
        fail_msg: Assign the independently prepared recovery host in the Tier 0 inventory first.

- name: Schedule independently encrypted control recovery copies
  hosts: control_recovery
  become: true
  serial: 1
  any_errors_fatal: true
  roles:
    - control_backup
