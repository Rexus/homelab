---
# Explicit maintenance, not part of template adoption or normal Terraform apply.
# Guide: docs/administration/virtual-machines/template-disk.md
- name: Preview or replace one published template boot disk
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vars/proxmox-api.yml
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    template_disk_receipt_dir: "{{ playbook_dir }}/../../../.terraform/maintenance/template-disk"
    template_disk_plan_file: "{{ playbook_dir }}/../../../.terraform/plans/proxmox-templates.tfplan"
    template_disk_api_url: "{{ proxmox_api_url }}"
  module_defaults:
    ansible.builtin.uri: "{{ proxmox_uri_defaults }}"
    group/community.proxmox.proxmox: "{{ proxmox_api_defaults }}"
  roles:
    - proxmox_template_disk
