---
# Complete the declared template policy where the pinned Terraform provider omits deletion/default updates.
# Guide: docs/administration/compute/template-lifecycle.md#verify-fixed-ram-after-adoption
- name: Reconcile or verify reusable Proxmox template settings
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../vars/proxmox-api.yml
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_api_defaults }}"
  roles:
    - proxmox_template_policy
