---
- name: Inspect the selected kubeconfig without revealing certificate or key data
  ansible.builtin.command:
    argv:
      - "{{ control_applications_sso_kubectl }}"
      - --kubeconfig
      - "{{ control_applications_kubeconfig }}"
      - --context
      - "{{ control_applications_context }}"
      - config
      - view
      - --minify
      - -o
      - json
  register: _sso_kube_identity
  changed_when: false
  no_log: true

- name: Refuse token, exec or OIDC-dependent recovery identity
  ansible.builtin.assert:
    that:
      - identity.get('client-certificate-data', identity.get('client-certificate', '')) | length > 0
      - identity.get('client-key-data', identity.get('client-key', '')) | length > 0
      - identity.keys() | list | difference(['client-certificate', 'client-certificate-data', 'client-key', 'client-key-data']) | length == 0
      - not cluster.get('insecure-skip-tls-verify', false)
      - cluster.get('certificate-authority-data', cluster.get('certificate-authority', '')) | length > 0
    fail_msg: Use the retained X509 recovery kubeconfig with CA verification, not human OIDC login.
  vars:
    identity: "{{ (_sso_kube_identity.stdout | from_json).users[0].user }}"
    cluster: "{{ (_sso_kube_identity.stdout | from_json).clusters[0].cluster }}"
  no_log: true
