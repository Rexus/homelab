---
- name: Require the existing hardware key credential for this explicit custodian operation
  ansible.builtin.assert:
    that:
      - hsm_provider_custody_ready | default(false) | bool
      - hsm_issuer_pin | length >= 4
      - hsm_issuer_pin not in ['648219', '0001password']
    fail_msg: Record changed production credentials and custody readiness; factory PINs are refused.
  no_log: true
