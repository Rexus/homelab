---
- name: Validate private HSM backend prerequisites
  ansible.builtin.assert:
    that:
      - hsm_proxy_ingress_application_ha_validated | bool
      - hsm_proxy_ingress_readiness_validated | bool
      - hsm_proxy_ingress_mode == 'tcp'
      - hsm_proxy_ingress_extra_backend_lines | length > 0
      - groups.get(hsm_proxy_ingress_gateway_group, []) | length >= 2
      - inventory_hostname in groups.get(hsm_proxy_ingress_gateway_group, [])
      - >-
        groups.get(hsm_proxy_ingress_gateway_group, [])
        | difference((platform_host_ips | default({})).keys() | list)
        | length == 0
    fail_msg: >-
      This optional TLS-passthrough scaffold requires at least two inventoried Tier 0
      service hosts with static addresses, an explicitly validated application HA
      model and application/device/key readiness configuration. Acknowledgements
      do not perform those tests. See the USB HSM deployment guide before enabling.

- name: Validate static signing backend addresses
  ansible.builtin.assert:
    that:
      - platform_host_ips[item] is string
      - platform_host_ips[item] not in ['', 'dhcp']
    fail_msg: Signing backends require explicit static service addresses in platform_host_ips.
  loop: "{{ groups[hsm_proxy_ingress_gateway_group] }}"

- name: Ensure HAProxy backend snippet directory exists
  ansible.builtin.file:
    path: "{{ hsm_proxy_ingress_output_dir }}"
    state: directory
    mode: "0755"

- name: Render HSM gateway backend snippet
  ansible.builtin.template:
    src: hsm-gateways-backend.cfg.j2
    dest: "{{ hsm_proxy_ingress_output_path }}"
    mode: "0644"
