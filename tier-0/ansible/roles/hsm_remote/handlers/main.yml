---
- name: Reload HSM remote SSH
  ansible.builtin.systemd_service:
    name: "hsm-remote-{{ hsm_remote_pool_id }}.service"
    state: reloaded

- name: Restart HSM remote SSH
  ansible.builtin.systemd_service:
    name: "hsm-remote-{{ hsm_remote_pool_id }}.service"
    daemon_reload: true
    state: restarted
