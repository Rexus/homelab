---
# host preserves the existing preparation/switch/finalization workflow.
immutable_template_mode: host
immutable_template_manage_packages: true

# image builds a separate disk; it never installs onto the running builder root.
immutable_template_image_builder_accepted: false
immutable_template_image_sources_approved: false
immutable_template_image_builder_image: ""
immutable_template_image_revision: ""
immutable_template_image_rootfs: xfs
immutable_template_image_config: {}
immutable_template_image_artifact_dir: "{{ (playbook_dir ~ '/../../../secrets/bootc-images') | realpath }}"
# Existing publisher metadata; image_path and sha256 are derived after fetch.
immutable_template_image_publication: {}
immutable_template_image_publication_key: ""

immutable_template_packages:
  - bootc
  - podman
  - skopeo
  - git

immutable_template_trust_ca_src: ""
immutable_template_trust_ca_dest: /etc/pki/ca-trust/source/anchors/platform-ca.crt

immutable_template_registry_auth_src: ""
immutable_template_registry_auth_dest: /etc/ostree/auth.json

immutable_template_apply_bootc: false
immutable_template_bootc_image: ""
immutable_template_bootc_transport: registry
immutable_template_bootc_retain: true
immutable_template_reboot_after_switch: false

immutable_template_prepare_for_template: false
immutable_template_clean_cloud_init: true
immutable_template_clean_ssh_host_keys: true
immutable_template_clean_package_cache: true
