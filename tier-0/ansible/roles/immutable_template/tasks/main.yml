---
- name: Validate the selected immutable template workflow
  ansible.builtin.import_tasks: preflight.yml

- name: Build an initial bootc disk on the dedicated builder
  ansible.builtin.include_tasks: bootc-image.yml
  when: immutable_template_mode == 'image'

- name: Prepare or switch an existing bootc-native template candidate
  ansible.builtin.include_tasks: host.yml
  when: immutable_template_mode == 'host'
