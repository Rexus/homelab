---
- name: Require opt-in HTTPS, explicit names, protected credentials and a bounded expiry
  ansible.builtin.assert:
    that:
      - netbox_audit_account_enabled is sameas true
      - netbox_audit_account_url is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
      - netbox_audit_account_username is match('^[a-z][a-z0-9-]{1,31}$')
      - netbox_audit_account_permission is match('^[a-z][a-z0-9-]{2,63}$')
      - netbox_audit_account_token_description is match('^[a-z][a-z0-9-]{2,63}$')
      - netbox_audit_account_admin_token | length >= 40
      - netbox_audit_account_password | length >= 20
      - netbox_audit_account_token_file is match('^/.+/[^/]+$')
      - netbox_audit_account_ca_file is match('^/.+')
      - netbox_audit_account_token_expires is match('^[0-9-]{10}T[0-9:]{8}Z$')
      - >-
        (netbox_audit_account_token_expires | to_datetime('%Y-%m-%dT%H:%M:%SZ')) >
        (now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
      - netbox_audit_account_admin_token is match('^([a-fA-F0-9]{40}|nbt_[A-Za-z0-9]+\.[A-Za-z0-9]+)$')
    fail_msg: >-
      Supply explicit bootstrap inputs and the existing NetBox administrator token through encrypted
      overrides. The bootstrap only supports NetBox 4.5+ v2 audit tokens. Existing reader/token adoption
      remains available directly through deployment/netbox-audit.yml without enabling this route.
  no_log: true

- name: Inspect the controller token and private directory without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ netbox_audit_account_token_file }}"
    - "{{ netbox_audit_account_token_file | dirname }}"
    - "{{ netbox_audit_account_ca_file }}"
  register: netbox_audit_account_paths

- name: Retain the existing credential-file state
  ansible.builtin.set_fact:
    netbox_audit_account_local: "{{ netbox_audit_account_paths.results[0] }}"
    netbox_audit_account_authorization: >-
      {{ ('Bearer ' if netbox_audit_account_admin_token.startswith('nbt_') else 'Token ')
         ~ netbox_audit_account_admin_token }}
  no_log: true

- name: Require a regular CA file and private controller-owned token destination
  ansible.builtin.assert:
    that:
      - netbox_audit_account_paths.results[2].stat.isreg | default(false)
      - >-
        not item.stat.exists or
        (not item.stat.islnk | default(false) and item.stat.uid == lookup('ansible.builtin.pipe', 'id -u') | int
         and item.stat.mode in ['0400', '0600', '0700'])
    fail_msg: Select a private controller-owned credential directory/file; shared or linked destinations are refused.
  loop: "{{ netbox_audit_account_paths.results[:2] }}"

- name: Require the existing destination types to match their purpose
  ansible.builtin.assert:
    that:
      - not netbox_audit_account_local.stat.exists or netbox_audit_account_local.stat.isreg
      - >-
        not netbox_audit_account_paths.results[1].stat.exists or
        netbox_audit_account_paths.results[1].stat.isdir

- name: Inspect the existing NetBox identity and permission before any API writes
  ansible.builtin.uri:
    url: "{{ netbox_audit_account_url }}/api/{{ item }}"
    headers: {Authorization: "{{ netbox_audit_account_authorization }}"}
    ca_path: "{{ netbox_audit_account_ca_file }}"
    validate_certs: true
    follow_redirects: none
    use_netrc: false
    return_content: true
    status_code: 200
  loop:
    - "users/users/?username={{ netbox_audit_account_username }}&limit=2"
    - "users/users/?username={{ netbox_audit_account_username }}&is_superuser=true&limit=2"
    - "users/permissions/?name={{ netbox_audit_account_permission }}&limit=2"
  register: netbox_audit_account_remote
  check_mode: false
  no_log: true

- name: Select only the exact inspected objects
  ansible.builtin.set_fact:
    netbox_audit_account_user: "{{ netbox_audit_account_remote.results[0] }}"
    netbox_audit_account_permissions: "{{ netbox_audit_account_remote.results[2].json.results }}"
  no_log: true

- name: Reject ambiguous identities, administrators and unrecoverable token plaintext
  ansible.builtin.assert:
    that:
      - netbox_audit_account_user.api_version is version('4.5', '>=')
      - netbox_audit_account_user.api_version is version('5.0', '<')
      - netbox_audit_account_user.json.count | int <= 1
      - netbox_audit_account_remote.results[1].json.count | int == 0
      - netbox_audit_account_remote.results[2].json.count | int <= 1
    fail_msg: >-
      Refusing an administrator, duplicate identity/token or unmatched local credential.
      A remote v2 token cannot be retrieved. Restore its original private file, or perform an explicit
      revocation/recovery outside this bootstrap; no existing token is rotated or overwritten.

- name: Refuse broad or disabled permissions under the selected managed name
  ansible.builtin.assert:
    that:
      - item.actions == ['view']
      - item.object_types == ['core.objectchange']
      - item.enabled is sameas true
      - not item.constraints
      - item.groups | length == 0
      - item.users | map(attribute='username') | difference([netbox_audit_account_username]) | length == 0
    fail_msg: The selected permission is shared or broader than view-only core.objectchange; choose a dedicated name.
  loop: "{{ netbox_audit_account_permissions }}"

- name: Refuse group membership or permissions outside this collector's scope
  ansible.builtin.assert:
    that:
      - item.is_active is sameas true
      - item.groups | length == 0
      - >-
        item.permissions | map(attribute='id') |
        difference(netbox_audit_account_permissions | map(attribute='id') | list) | length == 0
    fail_msg: Refusing to repurpose an existing account with additional authority or disabled status.
  loop: "{{ netbox_audit_account_user.json.results }}"

- name: Inspect only the selected reader's token after resolving the existing user
  ansible.builtin.uri:
    url: >-
      {{ netbox_audit_account_url }}/api/users/tokens/?user_id={{ netbox_audit_account_user.json.results[0].id
      }}&description={{ netbox_audit_account_token_description }}&limit=2
    headers: {Authorization: "{{ netbox_audit_account_authorization }}"}
    ca_path: "{{ netbox_audit_account_ca_file }}"
    validate_certs: true
    follow_redirects: none
    use_netrc: false
    return_content: true
    status_code: 200
  when: netbox_audit_account_user.json.count | int == 1
  register: netbox_audit_account_remote_tokens
  check_mode: false
  no_log: true

- name: Retain only the resolved reader's token metadata
  ansible.builtin.set_fact:
    netbox_audit_account_tokens: "{{ (netbox_audit_account_remote_tokens.json | default({})).get('results', []) }}"
  no_log: true

- name: Require matching remote metadata and local plaintext before changing account state
  ansible.builtin.assert:
    that:
      - (netbox_audit_account_remote_tokens.json | default({})).get('count', 0) | int <= 1
      - netbox_audit_account_tokens | length == (1 if netbox_audit_account_local.stat.exists else 0)
    fail_msg: >-
      Restore the original private controller file for an existing v2 token. A file without its
      matching remote token also needs explicit recovery. This route never rotates or overwrites either.

- name: Verify retained token ownership, version, scope and saved key without rotating it
  ansible.builtin.assert:
    that:
      - item.user.username == netbox_audit_account_username
      - item.version | int == 2
      - item.write_enabled is sameas false
      - item.enabled is sameas true
      - item.expires | regex_replace('\+00:00$', 'Z') == netbox_audit_account_token_expires
      - >-
        lookup('ansible.builtin.file', netbox_audit_account_token_file) | trim
        is match('^nbt_' ~ item.key ~ '\.[A-Za-z0-9]+$')
    fail_msg: The saved token must remain the selected enabled read-only v2 credential; recovery is explicit.
  loop: "{{ netbox_audit_account_tokens }}"
  no_log: true

- name: Verify an existing plaintext is valid before converging account state
  ansible.builtin.uri:
    url: "{{ netbox_audit_account_url }}/api/core/object-changes/?limit=1"
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.file', netbox_audit_account_token_file) | trim }}"
    ca_path: "{{ netbox_audit_account_ca_file }}"
    validate_certs: true
    follow_redirects: none
    use_netrc: false
    status_code: 200
  when: netbox_audit_account_local.stat.exists
  check_mode: false
  no_log: true
