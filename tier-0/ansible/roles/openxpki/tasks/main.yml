---
- name: Validate issuer prerequisites before making changes
  ansible.builtin.import_tasks: preflight.yml

- name: Validate existing signing identity before any active-runtime changes
  ansible.builtin.import_tasks: signer.yml

- name: Install the approved native runtime
  ansible.builtin.import_tasks: packages.yml

- name: Install the reviewed configuration and persistent-state binding
  ansible.builtin.import_tasks: configuration.yml

- name: Prepare the local database without replacing existing state
  ansible.builtin.import_tasks: database.yml

- name: Configure the restricted TLS portal and publication endpoint
  ansible.builtin.import_tasks: portal.yml

- name: Control activation separately from installation
  ansible.builtin.import_tasks: activation.yml

- name: Schedule native CRL publication for the active issuer
  ansible.builtin.import_tasks: scheduling.yml
  when: openxpki_managed_cli | bool
