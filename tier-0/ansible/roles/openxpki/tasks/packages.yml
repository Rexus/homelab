---
- name: Prepare the approved native package source
  ansible.builtin.import_tasks: repository.yml

- name: Install native repository and runtime prerequisites without starting daemons
  ansible.builtin.apt:
    name:
      - acl
      - python3-pymysql
      - python3-cryptography
      - locales
      - apache2
      - mariadb-server
      - libdbd-mariadb-perl
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Enable the application locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present

- name: Install exact application versions without demo configuration or auto-start
  ansible.builtin.apt:
    name: "{{ item.key }}={{ item.value }}"
    state: present
    policy_rc_d: 101
    fail_on_autoremove: true
    allow_downgrade: false
  environment:
    OPENXPKI_NOCONFIG: "1"
  loop: "{{ openxpki_package_versions | dict2items }}"
