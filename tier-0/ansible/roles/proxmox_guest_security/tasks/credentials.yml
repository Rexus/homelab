---
- name: Require one consistent HTTPS Proxmox API root
  ansible.builtin.assert:
    that:
      - proxmox_guest_security_endpoint is match('^https://[^/]+$')
      - proxmox_guest_security_endpoint | urlsplit('hostname') | default('', true) | length > 0
      - proxmox_guest_security_endpoint | urlsplit('username') is none
      - proxmox_guest_security_endpoint | urlsplit('password') is none
      - not proxmox_guest_security_endpoint | urlsplit('query')
      - not proxmox_guest_security_endpoint | urlsplit('fragment')
      - not plain_url or not native_url or plain_url | regex_replace('/$', '') == native_url | regex_replace('/$', '')
    fail_msg: Load .env.local with one consistent HTTPS API root without /api2/json or embedded credentials.
  vars:
    plain_url: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_URL') }}"
    native_url: "{{ lookup('ansible.builtin.env', 'PROXMOX_VE_ENDPOINT') }}"

- name: Check token aliases privately
  no_log: true
  block:
    - name: Require a complete and consistent API token
      ansible.builtin.assert:
        that:
          - proxmox_guest_security_token_id is match('^[^!=]+![^!=]+$')
          - proxmox_guest_security_token_secret | length > 0
          - (plain_id | length > 0) == (plain_secret | length > 0)
          - not native_token or native_token is match('^[^!]+![^=]+=.+$')
          - not native_token or not plain_id or native_token == plain_id ~ '=' ~ plain_secret
        quiet: true
      vars:
        plain_id: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_TOKEN_ID') }}"
        plain_secret: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_TOKEN_SECRET') }}"
        native_token: "{{ lookup('ansible.builtin.env', 'PROXMOX_VE_API_TOKEN') }}"
  rescue:
    - name: Explain the missing token without printing its value
      ansible.builtin.fail:
        msg: >-
          Export PROXMOX_API_TOKEN_ID and PROXMOX_API_TOKEN_SECRET from .env.local, or
          PROXMOX_VE_API_TOKEN as USER@REALM!TOKEN=SECRET. Both forms must agree if present.
      no_log: false
