---
- name: Validate the one-VM maintenance selection
  ansible.builtin.import_tasks: validate.yml

- name: Validate API credentials without exposing them
  ansible.builtin.import_tasks: credentials.yml

- name: Inspect or maintain the selected existing VM through the native API
  ansible.builtin.include_tasks: reconcile.yml
  vars:
    proxmox_guest_security_api_defaults:
      api_host: "{{ proxmox_guest_security_endpoint | urlsplit('hostname') }}"
      api_port: "{{ proxmox_guest_security_endpoint | urlsplit('port') | default(443, true) }}"
      api_user: "{{ proxmox_guest_security_token_id.split('!', 1)[0] }}"
      api_token_id: "{{ proxmox_guest_security_token_id.split('!', 1)[1] }}"
      api_token_secret: "{{ proxmox_guest_security_token_secret }}"
      validate_certs: true
      ca_path: "{{ proxmox_guest_security_ca }}"
