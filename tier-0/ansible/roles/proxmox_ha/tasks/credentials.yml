---
- name: Check the accepted HTTPS endpoint
  ansible.builtin.assert:
    that:
      - proxmox_ha_endpoint is match('^https://[^/]+$')
      - proxmox_ha_endpoint | urlsplit('hostname') | default('', true) | length > 0
      - proxmox_ha_endpoint | urlsplit('username') is none
      - proxmox_ha_endpoint | urlsplit('password') is none
      - not proxmox_ha_endpoint | urlsplit('query')
      - not proxmox_ha_endpoint | urlsplit('fragment')
      - not endpoint_plain or not endpoint_native or endpoint_plain | regex_replace('/$', '') == endpoint_native | regex_replace('/$', '')
    fail_msg: Export one consistent HTTPS Proxmox API root without /api2/json or embedded credentials.
  vars:
    endpoint_plain: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_URL') }}"
    endpoint_native: "{{ lookup('ansible.builtin.env', 'PROXMOX_VE_ENDPOINT') }}"

- name: Check token environment without exposing credentials
  no_log: true
  block:
    - name: Require one complete consistent API token
      ansible.builtin.assert:
        that:
          - proxmox_ha_token_id is match('^[^!=]+![^!=]+$')
          - proxmox_ha_token_secret | length > 0
          - (plain_id | length > 0) == (plain_secret | length > 0)
          - not native_token or native_token is match('^[^!]+![^=]+=.+$')
          - not native_token or not plain_id or native_token == plain_id ~ '=' ~ plain_secret
        quiet: true
      vars:
        plain_id: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_TOKEN_ID') }}"
        plain_secret: "{{ lookup('ansible.builtin.env', 'PROXMOX_API_TOKEN_SECRET') }}"
        native_token: "{{ lookup('ansible.builtin.env', 'PROXMOX_VE_API_TOKEN') }}"
  rescue:
    - name: Explain required HA credentials without printing their values
      ansible.builtin.fail:
        msg: >-
          Export PROXMOX_API_TOKEN_ID and PROXMOX_API_TOKEN_SECRET for the accepted HA identity,
          or PROXMOX_VE_API_TOKEN in USER@REALM!TOKEN=SECRET form. If both forms exist they must agree.
      no_log: false
