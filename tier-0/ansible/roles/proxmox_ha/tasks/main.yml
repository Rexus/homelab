---
- name: Validate every HA selection before contacting Proxmox
  ansible.builtin.import_tasks: validate.yml

- name: Validate the accepted API credentials and endpoint
  ansible.builtin.import_tasks: credentials.yml

- name: Inspect and reconcile the selected existing resources
  ansible.builtin.include_tasks: reconcile.yml
  vars:
    proxmox_ha_api_defaults:
      api_host: "{{ proxmox_ha_endpoint | urlsplit('hostname') }}"
      api_port: "{{ proxmox_ha_endpoint | urlsplit('port') | default(443, true) }}"
      api_user: "{{ proxmox_ha_token_id.split('!', 1)[0] }}"
      api_token_id: "{{ proxmox_ha_token_id.split('!', 1)[1] }}"
      api_token_secret: "{{ proxmox_ha_token_secret }}"
      validate_certs: true
      ca_path: "{{ proxmox_api_ca }}"
