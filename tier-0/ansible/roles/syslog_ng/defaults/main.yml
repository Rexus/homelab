---
# Stage 1 receiver contract: docs/reference/syslog-receiver.md
syslog_ng_data_mount: /srv/security-logging
syslog_ng_data_uuid: ""
syslog_ng_min_free_mb: 2048
syslog_ng_listen_address: "{{ ansible_host }}"
syslog_ng_tls_port: 6514
syslog_ng_udp_port: 514
syslog_ng_sources: []
syslog_ng_legacy_sources: []
syslog_ng_tls_ca_src: "{{ lookup('ansible.builtin.env', 'SYSLOG_NG_TLS_CA_FILE') }}"
syslog_ng_tls_cert_src: "{{ lookup('ansible.builtin.env', 'SYSLOG_NG_TLS_CERT_FILE') }}"
syslog_ng_tls_key_src: "{{ lookup('ansible.builtin.env', 'SYSLOG_NG_TLS_KEY_FILE') }}"
syslog_ng_tls_crl_src: "{{ lookup('ansible.builtin.env', 'SYSLOG_NG_TLS_CRL_FILE') }}"
syslog_ng_manage_firewall: true
syslog_ng_firewall_zone: public
syslog_ng_max_message_bytes: 65536
syslog_ng_max_connections: 100
syslog_ng_queue_bytes: 268435456
syslog_ng_config_dir: /etc/syslog-ng-receiver
syslog_ng_user: syslog-receiver
syslog_ng_read_group: security-log-readers
