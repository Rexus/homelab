---
- name: Require explicit storage, trust and source choices
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution_major_version | int == 10
      - syslog_ng_data_mount is match('^/[A-Za-z0-9_/-]+$')
      - syslog_ng_data_mount not in ['/', '/var', '/var/log', '/srv', '/home', '/tmp', '/etc']
      - syslog_ng_listen_address is match('^[0-9.]+$')
      - syslog_ng_listen_address not in ['0.0.0.0', '127.0.0.1']
      - syslog_ng_tls_port | int > 0 and syslog_ng_tls_port | int < 65536
      - syslog_ng_udp_port | int > 0 and syslog_ng_udp_port | int < 65536
      - syslog_ng_sources | length > 0
      - syslog_ng_tls_ca_src | length > 0
      - syslog_ng_tls_cert_src | length > 0
      - syslog_ng_tls_key_src | length > 0
      - syslog_ng_queue_bytes | int >= 1048576
      - syslog_ng_min_free_mb | int >= 1024
      - syslog_ng_max_message_bytes | int >= 1024 and syslog_ng_max_message_bytes | int <= 1048576
      - syslog_ng_max_connections | int > 0
    fail_msg: >-
      The receiver supports EL 10, a dedicated data volume,
      an explicit IPv4 bind address, client catalogue and independent TLS files.
      Follow docs/deployment/stage-2-logging/receiver.md before installation.

- name: Validate server-owned source namespaces
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9_-]{0,62}$')
      - item.address is match('^[0-9.]+$')
      - item.tier in [0, 1, 2]
  loop: "{{ syslog_ng_sources + syslog_ng_legacy_sources }}"
  loop_control:
    label: "{{ item.name | default('missing source name') }}"

- name: Require exact TLS subjects and matching common names
  ansible.builtin.assert:
    that:
      - item.tls_dn is match('^[A-Za-z0-9=, ._@/-]+$')
      - ('CN=' ~ item.name) in item.tls_dn.split(',') | map('trim') | list
  loop: "{{ syslog_ng_sources }}"
  loop_control:
    label: "{{ item.name }}"

- name: Reject duplicate source names and legacy addresses
  ansible.builtin.assert:
    that:
      - >-
        (syslog_ng_sources + syslog_ng_legacy_sources) | map(attribute='name') | unique | length ==
        (syslog_ng_sources + syslog_ng_legacy_sources) | length
      - >-
        syslog_ng_legacy_sources | map(attribute='address') | unique | length ==
        syslog_ng_legacy_sources | length
