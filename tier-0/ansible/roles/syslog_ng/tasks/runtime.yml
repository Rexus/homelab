---
# Approved signed repositories must already be available, including the selected EPEL content.
- name: Install receiver and native policy dependencies without replacing packages
  ansible.builtin.dnf:
    name:
      - syslog-ng
      - python3-cryptography
      - policycoreutils-python-utils
      - python3-libselinux
    state: present
    allowerasing: false
    disable_gpg_check: false

- name: Read receiver version
  ansible.builtin.command:
    argv: [/usr/sbin/syslog-ng, --version]
  register: syslog_ng_version
  changed_when: false

- name: Require the validated receiver feature baseline
  ansible.builtin.assert:
    that:
      - syslog_ng_version.stdout is search('syslog-ng 4 \(4\.(8|9|[1-9][0-9]+)\.')
    fail_msg: This configuration requires syslog-ng OSE 4.8 or later in the 4.x series.

- name: Prevent the unused package daemon from starting at boot
  ansible.builtin.systemd_service:
    name: syslog-ng.service
    enabled: false
    masked: true

- name: Create explicit service and reader groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: ["{{ syslog_ng_user }}", "{{ syslog_ng_read_group }}"]

- name: Create the network receiver identity
  ansible.builtin.user:
    name: "{{ syslog_ng_user }}"
    group: "{{ syslog_ng_user }}"
    groups: "{{ syslog_ng_read_group }}"
    append: true
    system: true
    create_home: false
    home: /nonexistent
    shell: /sbin/nologin

- name: Prepare receiver-owned directories without recursing over evidence
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ syslog_ng_config_dir }}", owner: root, group: "{{ syslog_ng_user }}", mode: '0750'}
    - {path: "{{ syslog_ng_config_dir }}/tls", owner: root, group: "{{ syslog_ng_user }}", mode: '0750'}
    - {path: "{{ syslog_ng_data_mount }}", owner: root, group: "{{ syslog_ng_read_group }}", mode: '0750'}
    - {path: "{{ syslog_ng_data_mount }}/records", owner: "{{ syslog_ng_user }}", group: "{{ syslog_ng_read_group }}", mode: '0750'}
    - {path: "{{ syslog_ng_data_mount }}/.state", owner: "{{ syslog_ng_user }}", group: "{{ syslog_ng_user }}", mode: '0700'}

- name: Store the offline source catalogue on the data volume
  ansible.builtin.copy:
    content: "{{ {'schema': 1, 'tls_sources': syslog_ng_sources, 'legacy_udp_sources': syslog_ng_legacy_sources} | to_nice_json }}\n"
    dest: "{{ syslog_ng_data_mount }}/source-catalogue.json"
    owner: root
    group: "{{ syslog_ng_read_group }}"
    mode: "0640"
    backup: true
