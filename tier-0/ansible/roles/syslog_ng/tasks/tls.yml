---
- name: Inspect the bootstrap trust anchor
  community.crypto.x509_certificate_info:
    path: "{{ syslog_ng_tls_ca_src }}"
    valid_at:
      now: '+0s'
  register: syslog_ng_ca_certificate
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Inspect the server certificate
  community.crypto.x509_certificate_info:
    path: "{{ syslog_ng_tls_cert_src }}"
    valid_at:
      now: '+0s'
  register: syslog_ng_server_certificate
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Inspect the server private key
  community.crypto.openssl_privatekey_info:
    path: "{{ syslog_ng_tls_key_src }}"
  register: syslog_ng_server_key
  no_log: true
  delegate_to: localhost
  become: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

- name: Refuse expired certificates and mismatched server keys
  ansible.builtin.assert:
    that:
      - syslog_ng_ca_certificate.valid_at.now
      - "'CA:TRUE' in syslog_ng_ca_certificate.basic_constraints"
      - syslog_ng_server_certificate.valid_at.now
      - syslog_ng_server_certificate.public_key == syslog_ng_server_key.public_key
    fail_msg: Supply a current server certificate and matching unencrypted service key; verify its chain and SAN separately.
  no_log: true

- name: Copy validated independent TLS trust and server identity
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ syslog_ng_config_dir }}/tls/{{ item.name }}.pem"
    owner: root
    group: "{{ syslog_ng_user }}"
    mode: "0640"
  loop:
    - {src: "{{ syslog_ng_tls_ca_src }}", name: ca}
    - {src: "{{ syslog_ng_tls_cert_src }}", name: server}
    - {src: "{{ syslog_ng_tls_key_src }}", name: key}
  no_log: true
  diff: false
  notify: Restart isolated syslog receiver
