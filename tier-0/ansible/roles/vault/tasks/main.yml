---
- name: Select the explicit VM secret-service implementation
  ansible.builtin.assert:
    that: vault_product in ['vault', 'openbao']

- name: Install the existing Vault implementation with its original seal guards
  ansible.builtin.include_tasks: vault-install.yml
  when: vault_product == 'vault'

- name: Install the optional OpenBao implementation on its selected guests
  ansible.builtin.include_tasks: openbao.yml
  when: vault_product == 'openbao'
