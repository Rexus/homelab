---
- name: Check Tier 1 deployment tooling
  ansible.builtin.import_playbook: ../../../shared/ansible/playbooks/control-node.yml
  vars:
    control_node_collection_catalog:
      amazon.aws:
        name: amazon.aws
        version: '>=9.5.1,<10.0.0'
        os_packages: {RedHat: [], Debian: []}
      community.postgresql:
        name: community.postgresql
        version: '>=4.2.0,<5.0.0'
        os_packages: {RedHat: [], Debian: []}
      ansible.utils:
        name: ansible.utils
        version: '>=6.0.0,<7.0.0'
        os_packages:
          RedHat: [python3-netaddr]
          Debian: [python3-netaddr]
      kubernetes.core:
        name: kubernetes.core
        version: '>=6.6.0,<7.0.0'
        os_packages:
          RedHat: []
          Debian: []
    control_node_setup_tool_commands:
      cluster-platform: [[helm, version, --short]]
      cluster-security-logging: [[helm, version, --short]]
      delivery-platform: [[helm, version, --short]]
      observability-platform: [[helm, version, --short]]
      development-platform: [[helm, version, --short]]
    control_node_setup_collection_names:
      software-consumer: [community.general]
      cluster-platform: [kubernetes.core]
      cluster-security-logging: [kubernetes.core, ansible.utils, community.crypto]
      delivery-platform: [kubernetes.core, ansible.utils]
      observability-platform: [kubernetes.core, ansible.utils, community.crypto]
      development-platform: [kubernetes.core, ansible.utils]
      development-data: [community.general, ansible.posix, kubernetes.core, ansible.utils, amazon.aws, community.postgresql]
      host-security: [community.general, ansible.posix, ansible.utils]
      development: [community.general, ansible.posix]
      observability: [community.general, ansible.posix, community.crypto]
      podman-runner: [community.general, ansible.posix]
      intake: [community.general, ansible.posix, community.crypto, ansible.utils]
      site: [community.general, ansible.posix]
