---
# Stage 8, application releases only. Supply local inputs explicitly with -e @file.
- name: Prepare selected deployment tooling
  ansible.builtin.import_playbook: ../control-node.yml
  vars:
    control_node_setup: observability-platform
    control_node_require_terraform: false

- name: Render or apply Tier 1 observability
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Run the selected deployment after tooling preparation
      ansible.builtin.include_role:
        name: observability_platform
