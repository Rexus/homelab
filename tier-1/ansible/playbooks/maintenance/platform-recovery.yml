---
- name: Prepare native recovery collections and tools before target mutation
  ansible.builtin.import_playbook: ../control-node.yml
  vars:
    control_node_setup: platform-recovery
    control_node_require_terraform: true

- name: Recover the accepted isolated platform using independent tooling
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Execute native restore operations from the retained recovery plan
      ansible.builtin.include_role:
        name: platform_recovery
