bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /tls/tls.crt
tls-key-file /tls/tls.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no
aclfile /auth/users.acl
dir /data
appendonly yes
appendfsync everysec
maxmemory 768mb
maxmemory-policy noeviction
notify-keyspace-events gxE
save 300 1
