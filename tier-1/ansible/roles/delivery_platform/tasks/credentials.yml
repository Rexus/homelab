---
- name: Resolve all selected product credential requirements
  ansible.builtin.set_fact:
    delivery_platform_credential_specs: >-
      {{ delivery_platform_releases + ([delivery_platform_spinnaker_spec]
         if delivery_platform_controller == 'spinnaker' else []) }}
  no_log: true

- name: Check every existing credential before changing any release
  kubernetes.core.k8s_info:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
    api_version: v1
    kind: Secret
    namespace: "{{ item.0.namespace }}"
    name: "{{ item.1.name }}"
  loop: "{{ delivery_platform_credential_specs | subelements('required_secrets') }}"
  register: delivery_platform_existing_secrets
  when:
    - delivery_platform_action == 'apply'
    - not delivery_platform_manage_secrets | bool
  no_log: true

- name: Reject missing existing credentials
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.item.1['keys'] | difference(item.resources[0].get('data', {}).keys() | list) | length == 0
  loop: "{{ delivery_platform_existing_secrets.results | default([]) }}"
  when:
    - delivery_platform_action == 'apply'
    - not delivery_platform_manage_secrets | bool
  no_log: true

- name: Resolve private product settings
  ansible.builtin.set_fact:
    delivery_platform_checked_secrets: >-
      {{ delivery_platform_secrets | combine(spinnaker_native_generated_secrets | default({}), recursive=true) }}
  no_log: true

- name: Decode existing product settings only in memory
  ansible.builtin.set_fact:
    delivery_platform_checked_secrets: >-
      {{ delivery_platform_checked_secrets | combine({
        item.item.0.namespace ~ '/' ~ item.item.1.name:
        dict(item.resources[0].data.keys() | zip(item.resources[0].data.values() | map('b64decode')))}) }}
  loop: "{{ delivery_platform_existing_secrets.results | default([]) }}"
  when:
    - delivery_platform_action == 'apply'
    - not delivery_platform_manage_secrets | bool
  no_log: true

- name: Validate explicit bootstrap fields before any release mutation
  ansible.builtin.assert:
    that:
      - secret_id in delivery_platform_checked_secrets
      - item.1['keys'] | difference(delivery_platform_checked_secrets.get(secret_id, {}).keys() | list) | length == 0
      - item.1['keys'] | map('extract', delivery_platform_checked_secrets.get(secret_id, {})) | select('equalto', '') | list | length == 0
  vars:
    secret_id: "{{ item.0.namespace }}/{{ item.1.name }}"
  loop: "{{ delivery_platform_credential_specs | subelements('required_secrets') }}"
  when: delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true

- name: Validate Spinnaker native identity, authorization and persistent metadata configuration
  ansible.builtin.assert:
    that:
      - oauth.provider.platform['issuer-uri'] == delivery_platform_oidc_issuer
      - oauth.registration.platform['client-id'] | length > 0
      - oauth.registration.platform['client-secret'] | length > 0
      - oauth.registration.platform['authorization-grant-type'] == 'authorization_code'
      - not gate.spring.security.user is defined
      - not gate.get('security', {}).get('basicform', {}).get('enabled', false) | bool
      - global_config.services.fiat.enabled | bool
      - fiat.fiat.enabled | bool
      - clouddriver.kubernetes.enabled | bool
      - clouddriver.kubernetes.accounts | length > 0
    fail_msg: Supply current Spring OIDC, enabled Fiat and bounded Kubernetes accounts in spinnaker-runtime.
  vars:
    runtime: "{{ delivery_platform_checked_secrets[delivery_platform_spinnaker_namespace ~ '/spinnaker-runtime'] }}"
    gate: "{{ runtime['gate-local.yml'] | from_yaml }}"
    oauth: "{{ gate.spring.security.oauth2.client }}"
    global_config: "{{ runtime['spinnaker-local.yml'] | from_yaml }}"
    fiat: "{{ runtime['fiat-local.yml'] | from_yaml }}"
    clouddriver: "{{ runtime['clouddriver-local.yml'] | from_yaml }}"
  when:
    - delivery_platform_controller == 'spinnaker'
    - delivery_platform_spinnaker_mode == 'overlay'
    - delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true

- name: Require explicit namespace limits for every Spinnaker account
  ansible.builtin.assert:
    that:
      - item.namespaces | length > 0
      - "'*' not in item.namespaces"
      - delivery_platform_spinnaker_namespace not in item.namespaces
      - item.namespaces | intersect(['default', 'kube-system', 'kube-public', 'kube-node-lease']) | length == 0
      - not item.get('serviceAccount', false) | bool
      - item.kubeconfigFile | length > 0
  loop: >-
    {{ (delivery_platform_checked_secrets[delivery_platform_spinnaker_namespace ~ '/spinnaker-runtime']
        ['clouddriver-local.yml'] | from_yaml).kubernetes.accounts }}
  when:
    - delivery_platform_controller == 'spinnaker'
    - delivery_platform_spinnaker_mode == 'overlay'
    - delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true

- name: Require SQL connection settings for persistent Spinnaker services
  ansible.builtin.assert:
    that:
      - config.sql.enabled | bool
      - config.sql.connectionPools.default.jdbcUrl is match('^jdbc:(mysql|mariadb|postgresql)://')
      - config.sql.connectionPools.default.user | length > 0
      - config.sql.connectionPools.default.password | length > 0
  vars:
    config: >-
      {{ delivery_platform_checked_secrets[delivery_platform_spinnaker_namespace ~ '/spinnaker-runtime']
         [item ~ '-local.yml'] | from_yaml }}
  loop: [front50, orca, echo, fiat, clouddriver]
  when:
    - delivery_platform_controller == 'spinnaker'
    - delivery_platform_spinnaker_mode == 'overlay'
    - delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true

- name: Require safe independent native dependency passwords and an actual OIDC client credential
  ansible.builtin.assert:
    that:
      - item.0.name in ['spinnaker-oidc', 'spinnaker-backup'] or value is match('^[A-Za-z0-9]{32,128}$')
      - value | length > 0
  vars:
    value: "{{ delivery_platform_checked_secrets[delivery_platform_spinnaker_namespace ~ '/' ~ item.0.name][item.1] }}"
  loop: "{{ (delivery_platform_spinnaker_spec | default({'required_secrets': []})).required_secrets | subelements('keys') }}"
  when:
    - delivery_platform_controller == 'spinnaker'
    - delivery_platform_spinnaker_mode == 'native'
    - delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true

- name: Keep native SQL runtime and schema-migration credentials distinct
  ansible.builtin.assert:
    that:
      - secret.password != secret['migration-password']
      - secret.password != delivery_platform_checked_secrets[delivery_platform_spinnaker_namespace ~ '/spinnaker-mysql-root'].password
      - secret['migration-password'] != delivery_platform_checked_secrets[delivery_platform_spinnaker_namespace ~ '/spinnaker-mysql-root'].password
  vars:
    secret: "{{ delivery_platform_checked_secrets[delivery_platform_spinnaker_namespace ~ '/spinnaker-' ~ item ~ '-db'] }}"
  loop: [clouddriver, echo, fiat, front50, orca]
  when:
    - delivery_platform_controller == 'spinnaker'
    - delivery_platform_spinnaker_mode == 'native'
    - delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true

- name: Require actual independent storage and retained restic recovery credentials
  ansible.builtin.assert:
    that:
      - delivery_platform_spinnaker_backup_backend != 's3' or backup.AWS_ACCESS_KEY_ID | length >= 8
      - delivery_platform_spinnaker_backup_backend != 's3' or backup.AWS_SECRET_ACCESS_KEY | length >= 16
      - backup.RESTIC_PASSWORD | length >= 32
  vars:
    backup: "{{ delivery_platform_checked_secrets[delivery_platform_spinnaker_namespace ~ '/spinnaker-backup'] }}"
  when:
    - delivery_platform_controller == 'spinnaker'
    - delivery_platform_spinnaker_mode == 'native'
    - delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true

- name: Validate Harbor native OIDC configuration and stable encryption keys
  ansible.builtin.assert:
    that:
      - oidc.auth_mode == 'oidc_auth'
      - oidc.oidc_endpoint == delivery_platform_oidc_issuer
      - oidc.oidc_verify_cert is sameas true
      - oidc.oidc_client_id | length > 0
      - oidc.oidc_client_secret | length > 0
      - "'openid' in oidc.oidc_scope.replace(',', ' ').split()"
      - credentials.secretKey | length == 16
      - credentials.secret | length == 16
      - credentials.JOBSERVICE_SECRET | length == 16
      - credentials.REGISTRY_HTTP_SECRET | length == 16
      - credentials.CSRF_KEY | length == 32
      - credentials.REGISTRY_PASSWD | length >= 20
      - credentials.REGISTRY_HTPASSWD.startswith('harbor_registry_user:')
    fail_msg: Harbor requires native OIDC JSON, verified IdP TLS and correctly sized persistent keys.
  vars:
    oidc: "{{ delivery_platform_checked_secrets[delivery_platform_harbor_namespace ~ '/harbor-oidc']['config.json'] | from_json }}"
    credentials: "{{ delivery_platform_checked_secrets[delivery_platform_harbor_namespace ~ '/harbor-credentials'] }}"
  when:
    - delivery_platform_install_harbor | bool
    - delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true

- name: Validate the persistent Argo CD signing key and bcrypt administrator credential
  ansible.builtin.assert:
    that:
      - argocd_secret['server.secretkey'] | length >= 32
      - argocd_secret['admin.password'] is match('^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$')
      - argocd_secret['admin.passwordMtime'] is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T')
  vars:
    argocd_secret: "{{ delivery_platform_checked_secrets[delivery_platform_argocd_namespace ~ '/argocd-secret'] }}"
  when:
    - delivery_platform_controller == 'argocd'
    - delivery_platform_action == 'apply' or delivery_platform_manage_secrets | bool
  no_log: true
