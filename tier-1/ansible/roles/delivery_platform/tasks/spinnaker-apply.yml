---
- name: Install the supplied native reference in dependency order
  ansible.builtin.include_tasks: spinnaker-native-apply.yml
  when: delivery_platform_spinnaker_mode == 'native'

- name: Execute the separately maintained custom overlay
  ansible.builtin.include_tasks: spinnaker-overlay-apply.yml
  when: delivery_platform_spinnaker_mode == 'overlay'
