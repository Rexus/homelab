---
- name: Validate the existing independent file repository storage
  ansible.builtin.include_tasks: spinnaker-backup-storage.yml
  when: delivery_platform_spinnaker_backup_backend == 'filesystem'

- name: Inspect the native reference's existing platform prerequisites
  kubernetes.core.k8s_info:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ item.namespace | default(omit) }}"
  loop:
    - {api: storage.k8s.io/v1, kind: StorageClass, name: "{{ delivery_platform_spinnaker_storage_class }}"}
    - {api: apiextensions.k8s.io/v1, kind: CustomResourceDefinition, name: certificates.cert-manager.io}
    - {api: apiextensions.k8s.io/v1, kind: CustomResourceDefinition, name: serverstransports.traefik.io}
    - {api: networking.k8s.io/v1, kind: IngressClass, name: "{{ delivery_platform_ingress_class }}"}
    - api: cert-manager.io/v1
      kind: "{{ delivery_platform_spinnaker_issuer.kind }}"
      name: "{{ delivery_platform_spinnaker_issuer.name }}"
      namespace: "{{ delivery_platform_spinnaker_namespace if delivery_platform_spinnaker_issuer.kind == 'Issuer' else omit }}"
  register: spinnaker_native_platform
  when: >-
    delivery_platform_spinnaker_certificate_mode == 'issuer' or
    item.kind not in ['Issuer', 'ClusterIssuer'] and item.name != 'certificates.cert-manager.io'

- name: Require an existing provisioner, established CRDs, ready issuer and Traefik controller
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - >-
        item.item.kind not in ['CustomResourceDefinition', 'Issuer', 'ClusterIssuer'] or
        item.resources[0].get('status', {}).get('conditions', [])
        | selectattr('type', 'equalto', 'Established' if item.item.kind == 'CustomResourceDefinition' else 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length == 1
      - item.item.kind != 'IngressClass' or item.resources[0].spec.controller == 'traefik.io/ingress-controller'
  loop: "{{ spinnaker_native_platform.results | selectattr('resources', 'defined') | list }}"
  loop_control: {label: "{{ item.item.kind }}/{{ item.item.name }}"}

- name: Read server version before using stable native sidecars
  kubernetes.core.k8s_cluster_info:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
  register: spinnaker_native_cluster
  no_log: true

- name: Require Kubernetes with stable sidecar lifecycle support
  ansible.builtin.assert:
    that:
      - spinnaker_native_cluster.version.server.kubernetes.gitVersion | regex_replace('^v', '') is version('1.33.0', '>=', version_type='semver')

- name: Partition reviewed resources by native lifecycle phase
  ansible.builtin.set_fact:
    spinnaker_native_namespaces: "{{ delivery_platform_spinnaker_documents | selectattr('kind', 'equalto', 'Namespace') | list }}"
    spinnaker_native_datastores: "{{ delivery_platform_spinnaker_documents | selectattr('kind', 'equalto', 'StatefulSet') | list }}"
    spinnaker_native_database_job: >-
      {{ delivery_platform_spinnaker_documents | selectattr('kind', 'equalto', 'Job')
         | selectattr('metadata.name', 'equalto', 'spinnaker-databases') | first }}
    spinnaker_native_deployments: "{{ delivery_platform_spinnaker_documents | selectattr('kind', 'equalto', 'Deployment') | list }}"
    spinnaker_native_foundation: >-
      {{ delivery_platform_spinnaker_documents
         | rejectattr('kind', 'in', ['Namespace', 'StatefulSet', 'Job', 'Deployment', 'Ingress', 'CronJob']) | list }}

- name: Validate the actual preissued leaf certificate owner before any resource changes
  ansible.builtin.include_tasks: spinnaker-native-tls.yml
  when: delivery_platform_spinnaker_certificate_mode == 'preissued'
