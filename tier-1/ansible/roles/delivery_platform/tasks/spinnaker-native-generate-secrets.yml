---
- name: Prepare the private stable-password cache
  ansible.builtin.file:
    path: "{{ spinnaker_native_credentials_directory }}"
    state: directory
    mode: '0700'

- name: Inspect the independent stable Flux credential cache before generating any missing value
  ansible.builtin.stat:
    path: "{{ spinnaker_native_credentials_directory }}/{{ item.0.name }}-{{ item.1 }}"
  loop: >-
    {{ delivery_platform_spinnaker_spec.required_secrets
       | rejectattr('name', 'in', ['spinnaker-oidc', 'spinnaker-backup'] +
          (['spinnaker-keystore'] if delivery_platform_spinnaker_certificate_mode == 'preissued' else []))
       | subelements('keys') }}
  register: spinnaker_native_cached_credentials
  when: delivery_platform_owner == 'flux'
  no_log: true

- name: Reject a lost credential cache outside an explicitly selected first initialization
  ansible.builtin.assert:
    that:
      - >-
        item.stat.exists or item.item.1 in delivery_platform_secrets.get(secret_id, {}) or
        (delivery_platform_spinnaker_lifecycle == 'fresh' and delivery_platform_flux_initialize_credentials | bool)
    fail_msg: Restore the retained credential cache. First generation requires explicit fresh initialization.
  vars:
    secret_id: "{{ delivery_platform_spinnaker_namespace }}/{{ item.item.0.name }}"
  loop: "{{ spinnaker_native_cached_credentials.results | default([]) }}"
  when: delivery_platform_owner == 'flux'
  no_log: true

- name: Reuse provided or stable generated native dependency credentials
  ansible.builtin.set_fact:
    spinnaker_native_generated_secrets: >-
      {{ spinnaker_native_generated_secrets | combine({secret_id: {item.1:
        delivery_platform_secrets[secret_id][item.1]
        if item.1 in delivery_platform_secrets.get(secret_id, {}) else
        lookup('ansible.builtin.password', spinnaker_native_credentials_directory ~ '/' ~ item.0.name ~ '-' ~ item.1,
               length=48, chars=['ascii_letters', 'digits'])}}, recursive=true) }}
  vars:
    secret_id: "{{ delivery_platform_spinnaker_namespace }}/{{ item.0.name }}"
  loop: >-
    {{ delivery_platform_spinnaker_spec.required_secrets
       | rejectattr('name', 'in', ['spinnaker-oidc', 'spinnaker-backup'] +
          (['spinnaker-keystore'] if delivery_platform_spinnaker_certificate_mode == 'preissued' else []))
       | subelements('keys') }}
  no_log: true
