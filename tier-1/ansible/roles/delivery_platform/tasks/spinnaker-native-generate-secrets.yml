---
- name: Prepare the private stable-password cache
  ansible.builtin.file:
    path: "{{ delivery_platform_output }}/credentials"
    state: directory
    mode: '0700'

- name: Reuse provided or stable generated native dependency credentials
  ansible.builtin.set_fact:
    spinnaker_native_generated_secrets: >-
      {{ spinnaker_native_generated_secrets | combine({secret_id: {item.1:
        delivery_platform_secrets[secret_id][item.1]
        if item.1 in delivery_platform_secrets.get(secret_id, {}) else
        lookup('ansible.builtin.password', delivery_platform_output ~ '/credentials/' ~ item.0.name ~ '-' ~ item.1,
               length=48, chars=['ascii_letters', 'digits'])}}, recursive=true) }}
  vars:
    secret_id: "{{ delivery_platform_spinnaker_namespace }}/{{ item.0.name }}"
  loop: >-
    {{ delivery_platform_spinnaker_spec.required_secrets
       | rejectattr('name', 'in', ['spinnaker-oidc', 'spinnaker-backup'] +
          (['spinnaker-keystore'] if delivery_platform_spinnaker_certificate_mode == 'preissued' else []))
       | subelements('keys') }}
  no_log: true
