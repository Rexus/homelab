---
- name: Prepare the custom-overlay Spinnaker namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ delivery_platform_spinnaker_namespace }}"

- name: Prepare explicitly owned native Spinnaker secrets
  kubernetes.core.k8s:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        namespace: "{{ delivery_platform_spinnaker_namespace }}"
        name: "{{ item.name }}"
      type: "{{ item.type | default('Opaque') }}"
      stringData: "{{ delivery_platform_secrets[delivery_platform_spinnaker_namespace ~ '/' ~ item.name] }}"
  loop: "{{ delivery_platform_spinnaker_spec.required_secrets }}"
  when: delivery_platform_manage_secrets | bool
  no_log: true

- name: Apply the complete reviewed native resource set
  kubernetes.core.k8s:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
    definition: "{{ delivery_platform_spinnaker_documents }}"
    state: present
  no_log: true

- name: Wait for every configured deployment after all dependencies have been submitted
  kubernetes.core.k8s_info:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ delivery_platform_spinnaker_namespace }}"
    name: "{{ item.metadata.name }}"
    wait: true
    wait_timeout: 900
    wait_condition: {type: Available, status: 'True'}
  loop: "{{ delivery_platform_spinnaker_workloads | selectattr('kind', 'equalto', 'Deployment') | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Wait for selected native migration jobs
  kubernetes.core.k8s_info:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
    api_version: batch/v1
    kind: Job
    namespace: "{{ delivery_platform_spinnaker_namespace }}"
    name: "{{ item.metadata.name }}"
    wait: true
    wait_timeout: 900
    wait_condition: {type: Complete, status: 'True'}
  loop: "{{ delivery_platform_spinnaker_workloads | selectattr('kind', 'equalto', 'Job') | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Wait for persistent database and cache replicas
  kubernetes.core.k8s_info:
    kubeconfig: "{{ delivery_platform_kubeconfig }}"
    context: "{{ delivery_platform_context }}"
    validate_certs: true
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ delivery_platform_spinnaker_namespace }}"
    name: "{{ item.metadata.name }}"
  register: delivery_platform_stateful_health
  until: >-
    delivery_platform_stateful_health.resources | length == 1 and
    delivery_platform_stateful_health.resources[0].get('status', {}).get('readyReplicas', 0)
    == item.spec.replicas | default(1)
  retries: 90
  delay: 10
  loop: "{{ delivery_platform_spinnaker_workloads | selectattr('kind', 'equalto', 'StatefulSet') | list }}"
  loop_control:
    label: "{{ item.metadata.name }}"
