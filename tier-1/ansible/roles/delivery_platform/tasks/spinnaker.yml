---
- name: Require an explicit supported native or custom-overlay path
  ansible.builtin.assert:
    that:
      - delivery_platform_spinnaker_mode in ['native', 'overlay']
      - delivery_platform_spinnaker_mode != 'native' or delivery_platform_spinnaker_overlay | length == 0

- name: Render the supplied native Spinnaker reference
  ansible.builtin.include_tasks: spinnaker-native.yml
  when: delivery_platform_spinnaker_mode == 'native'

- name: Render a separately maintained custom Spinnaker integration
  ansible.builtin.include_tasks: spinnaker-overlay.yml
  when: delivery_platform_spinnaker_mode == 'overlay'
