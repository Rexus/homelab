---
delivery_promotion_action: render
delivery_promotion_output: "{{ playbook_dir }}/../../../secrets/delivery-promotion"
delivery_promotion_repository_root: "{{ playbook_dir }}/../../.."
delivery_promotion_worker_image: ""
delivery_promotion_repository: ""
delivery_promotion_platform_repositories: []
delivery_promotion_branch: delivery
delivery_promotion_manifest_path: clusters/tier1/applications/example/helmrelease.json
delivery_promotion_kustomization_path: ./clusters/tier1/applications
delivery_promotion_application_namespaces: []
delivery_promotion_application_source_output: "{{ delivery_promotion_output }}/application-source"
delivery_promotion_target: {kind: HelmRelease, namespace: example, name: example}
delivery_promotion_image_repository: ""
delivery_promotion_container: app
delivery_promotion_chart_source: {kind: HelmRepository, name: application-charts, namespace: example}
delivery_promotion_chart_repository: ""
delivery_promotion_chart: ""
delivery_promotion_chart_version: ""
delivery_promotion_chart_values: {}
delivery_promotion_initial_image_digest: ""
delivery_promotion_commit_email: ""
delivery_promotion_timeout_seconds: 900
delivery_promotion_application: tier1promotions
delivery_promotion_owner_email: ""
delivery_promotion_requester_role: tier1-promotion-requesters
delivery_promotion_approver_role: tier1-promotion-approvers
delivery_promotion_executor_role: tier1-promotion-executors
delivery_promotion_admin_role: tier1-delivery-admins
delivery_promotion_pipeline_ids:
  promote: >-
    {{ (delivery_promotion_application ~ ':' ~ delivery_promotion_target.namespace ~ '/' ~
        delivery_promotion_target.name ~ ':promote') | to_uuid }}
  rollback: >-
    {{ (delivery_promotion_application ~ ':' ~ delivery_promotion_target.namespace ~ '/' ~
        delivery_promotion_target.name ~ ':rollback') | to_uuid }}
# Record approval trust-limit acceptance. Live API/Git commissioning supplies separate evidence.
delivery_promotion_controls_accepted:
  single_judgment_and_possible_self_approval: false
  executor_api_job_and_credential_bypass: false
  pipeline_fiat_gitlab_and_cluster_admin_bypass: false
  gitlab_ce_separate_project_bot_maintainer: false
delivery_promotion_gate_url: ""
delivery_promotion_gate_headers: {}
delivery_promotion_gate_ca_path: ""
# Flux publishes this artifact. Its Secrets are provisioned separately through the chosen secret owner.
delivery_promotion_git_secret: delivery-promotion-git
delivery_promotion_signing_secret: delivery-promotion-signing
# Default-deny egress requires the site to provide API, Git and DNS destinations explicitly.
delivery_promotion_egress: []
# Optional publication through the shared renderer into an existing private platform checkout.
delivery_promotion_flux_output: ""
delivery_promotion_flux_component: platform/delivery-promotion
delivery_promotion_flux_sops_age_recipients: []
delivery_promotion_flux_dependencies: [{name: platform-delivery}]
