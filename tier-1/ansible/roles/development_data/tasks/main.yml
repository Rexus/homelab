---
- name: Validate development data inputs
  ansible.builtin.import_tasks: preflight.yml

- name: Render private native configuration and client handoff
  ansible.builtin.import_tasks: render.yml

- name: Provision the existing Ceph S3 interface
  ansible.builtin.include_tasks: object-storage.yml
  when:
    - development_data_action == 'apply'
    - development_data_s3_mode == 'ceph-rgw'

- name: Validate approved existing tenant interfaces without storage administration
  ansible.builtin.include_tasks: s3-qualification.yml
  when:
    - development_data_action == 'apply'
    - development_data_s3_mode == 'preprovisioned'
