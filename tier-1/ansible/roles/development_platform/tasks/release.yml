---
# Shared supplies stateless native Helm execution; Tier 1 owns values and secrets.
- name: Render or install through the shared native Helm executor
  ansible.builtin.include_role:
    name: helm_release
  vars:
    helm_release_action: "{{ development_platform_action }}"
    helm_release_kubeconfig: "{{ development_platform_kubeconfig }}"
    helm_release_output: "{{ development_platform_output }}"
    helm_release_spec: >-
      {{ development_platform_release | combine({'repository': development_platform_chart_repository}) }}
