---
- name: Ensure the selected application namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ development_platform_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ development_platform_release.namespace }}"
  when: development_platform_action == 'apply'

- name: Validate explicitly managed secret input fields
  ansible.builtin.assert:
    that:
      - item.name in development_platform_secrets
      - item['keys'] | difference(development_platform_secrets.get(item.name, {}).keys() | list) | length == 0
      - item['keys'] | map('extract', development_platform_secrets.get(item.name, {})) | select('equalto', '') | list | length == 0
    fail_msg: Supply all required nonempty secret fields through protected local inputs.
  loop: "{{ development_platform_required_secrets }}"
  when: development_platform_manage_secrets | bool
  no_log: true

- name: Apply explicitly managed application secrets
  kubernetes.core.k8s:
    kubeconfig: "{{ development_platform_kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ development_platform_release.namespace }}"
      type: "{{ item.type | default('Opaque') }}"
      stringData: "{{ development_platform_secrets[item.name] }}"
  loop: "{{ development_platform_required_secrets }}"
  when:
    - development_platform_action == 'apply'
    - development_platform_manage_secrets | bool
  no_log: true

- name: Read required pre-existing secrets without exposing their values
  kubernetes.core.k8s_info:
    kubeconfig: "{{ development_platform_kubeconfig }}"
    api_version: v1
    kind: Secret
    name: "{{ item.name }}"
    namespace: "{{ development_platform_release.namespace }}"
  register: development_platform_secret_checks
  loop: "{{ development_platform_required_secrets }}"
  when: development_platform_action == 'apply'
  no_log: true

- name: Reject missing or incomplete secrets before Helm
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.item['keys'] | difference((item.resources | first | default({})).get('data', {}).keys() | list) | length == 0
      - item.item['keys'] | map('extract', (item.resources | first | default({})).get('data', {})) | select('equalto', '') | list | length == 0
    fail_msg: A required application secret is missing or incomplete; no Helm release was applied.
  loop: "{{ development_platform_secret_checks.results | default([]) }}"
  when: development_platform_action == 'apply'
  no_log: true
