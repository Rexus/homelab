---
gitlab_container_image: ""
gitlab_container_name: gitlab
gitlab_home: /srv/gitlab

gitlab_hostname: "git.{{ platform_domain | default('corp.example.com') }}"
gitlab_external_url: "https://{{ gitlab_hostname }}"
gitlab_http_host_port: 80
gitlab_https_host_port: 443
gitlab_ssh_host_port: 2222
gitlab_ssh_container_port: 22
gitlab_container_shm_size: 256m

gitlab_letsencrypt_enabled: false
gitlab_redirect_http_to_https: true
gitlab_tls_cert_src: ""
gitlab_tls_key_src: ""
gitlab_omnibus_extra_config: []

gitlab_packages:
  - podman

gitlab_systemd_unit_path: /etc/systemd/system/gitlab-container.service

# Optional dedicated Proxmox disk; empty preserves the existing OS-disk layout.
gitlab_data_device: ""
gitlab_data_expected_uuid: ""
gitlab_data_min_free_bytes: 10737418240
gitlab_trusted_ca_sources: []
gitlab_ready_retries: 90

# Existing accepted confidential Keycloak client; this role owns only the consumer.
gitlab_oidc_enabled: false
gitlab_oidc_client_accepted: false
gitlab_oidc_issuer: ""
gitlab_oidc_client_id: ""
gitlab_oidc_client_secret: ""
gitlab_oidc_label: Keycloak
gitlab_oidc_block_auto_created_users: true

gitlab_backup_enabled: false
gitlab_backup_transport: sftp
gitlab_backup_repository: ""
gitlab_backup_filesystem: {}
gitlab_backup_password_src: ""
gitlab_backup_ssh_key_src: ""
gitlab_backup_known_hosts_src: ""
gitlab_backup_custody_accepted: false
gitlab_backup_initialize: false
gitlab_backup_calendar: "*-*-* 02:00:00"
gitlab_backup_timeout_seconds: 7200
gitlab_backup_min_free_bytes: 10737418240
gitlab_initial_password_dest: ""
gitlab_restore_confirm: false
gitlab_restore_target_empty_accepted: false
gitlab_restore_snapshot: ""
gitlab_restore_set: ""
gitlab_restore_source_home: "{{ gitlab_home }}"
