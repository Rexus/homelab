---
- name: Validate GitLab container inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - gitlab_hostname | length > 0
      - gitlab_external_url | length > 0
      - gitlab_container_image is match('^docker[.]io/gitlab/gitlab-ce:(?:[0-9]+[.][0-9]+[.][0-9]+-ce[.]0|[0-9]+[.][0-9]+[.][0-9]+-ce[.]0@sha256:[a-f0-9]{64})$') or gitlab_container_image is match('^docker[.]io/gitlab/gitlab-ce@sha256:[a-f0-9]{64}$')
      - >-
        not gitlab_external_url.startswith('https://')
        or gitlab_letsencrypt_enabled | bool
        or (gitlab_tls_cert_src | length > 0 and gitlab_tls_key_src | length > 0)
    fail_msg: >-
      The gitlab_container role targets Fedora or Enterprise Linux-like hosts.
      HTTPS requires either GitLab Let's Encrypt or local certificate and key
      files from the shared PKI.
      Select an approved explicit GitLab CE version or immutable digest; latest is not accepted.

- name: Validate managed integration inputs before changing the guest
  ansible.builtin.import_tasks: preflight.yml

- name: Install GitLab container host packages
  ansible.builtin.dnf:
    name: "{{ gitlab_packages }}"
    state: present
    update_cache: true

- name: Prepare guarded local persistent storage
  ansible.builtin.import_tasks: storage.yml

- name: Install public CA chains into the container's native trust directory
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ gitlab_home }}/config/trusted-certs/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ gitlab_trusted_ca_sources }}"
  notify: Restart GitLab container

- name: Install GitLab TLS certificate
  ansible.builtin.copy:
    src: "{{ gitlab_tls_cert_src }}"
    dest: "{{ gitlab_home }}/config/ssl/{{ gitlab_hostname }}.crt"
    owner: root
    group: root
    mode: "0644"
  when: gitlab_tls_cert_src | length > 0
  notify: Restart GitLab container

- name: Install GitLab TLS private key
  ansible.builtin.copy:
    src: "{{ gitlab_tls_key_src }}"
    dest: "{{ gitlab_home }}/config/ssl/{{ gitlab_hostname }}.key"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  when: gitlab_tls_key_src | length > 0
  notify: Restart GitLab container

- name: Render GitLab Omnibus configuration
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: "{{ gitlab_home }}/config/gitlab.rb"
    owner: root
    group: root
    mode: "0600"
  notify: Restart GitLab container
  no_log: true
  diff: false

- name: Render GitLab container systemd unit
  ansible.builtin.template:
    src: gitlab-container.service.j2
    dest: "{{ gitlab_systemd_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart GitLab container

- name: Start and enable GitLab container
  ansible.builtin.systemd:
    name: gitlab-container.service
    enabled: true
    state: started
    daemon_reload: true

- name: Apply GitLab configuration before readiness and backup commissioning
  ansible.builtin.meta: flush_handlers

- name: Wait for native GitLab readiness over verified HTTPS
  ansible.builtin.uri:
    url: "{{ gitlab_external_url }}/-/readiness"
    status_code: 200
    validate_certs: true
    use_proxy: false
  register: gitlab_readiness
  until: gitlab_readiness.status | default(0) == 200
  retries: "{{ gitlab_ready_retries }}"
  delay: 10

- name: Commission scheduled independent native backups
  ansible.builtin.include_tasks: backup.yml
  when: gitlab_backup_enabled | bool

- name: Inspect the optional installed schedule when backups are deselected
  ansible.builtin.stat:
    path: /etc/systemd/system/gitlab-vm-backup.timer
  register: gitlab_backup_timer_file
  when: not gitlab_backup_enabled | bool

- name: Disable a previously installed schedule when backups are deselected
  ansible.builtin.systemd_service:
    name: gitlab-vm-backup.timer
    state: stopped
    enabled: false
  when:
    - not gitlab_backup_enabled | bool
    - gitlab_backup_timer_file.stat.exists
