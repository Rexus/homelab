---
- name: Resolve explicitly supplied private ingestion identities
  ansible.builtin.set_fact:
    observability_prepper_auth: "{{ observability_secrets.get(observability_namespace ~ '/prepper-auth', observability_prepper_auth) }}"
    observability_prepper_search_auth: "{{ observability_secrets.get(observability_namespace ~ '/prepper-search-auth', observability_prepper_search_auth) }}"
    observability_search_users_checksum: "{{ observability_secrets.get(observability_namespace ~ '/search-users', {}).get('internal_users.yml', 'render-only') | hash('sha256') }}"
  no_log: true

- name: Read externally owned native ingestion identities before generating private pipelines
  kubernetes.core.k8s_info:
    kubeconfig: "{{ observability_kubeconfig }}"
    context: "{{ observability_context | default(omit, true) }}"
    validate_certs: true
    kind: Secret
    namespace: "{{ observability_namespace }}"
    name: "{{ item }}"
  loop: [prepper-auth, prepper-search-auth, search-users]
  register: observability_prepper_existing
  when:
    - observability_action == 'apply'
    - not observability_manage_secrets | bool
  no_log: true

- name: Require complete externally owned ingestion identities
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - required_keys | difference(item.resources[0].data.keys()) | length == 0
  vars:
    required_keys: "{{ ['internal_users.yml'] if item.item == 'search-users' else ['username', 'password'] }}"
  loop: "{{ observability_prepper_existing.results | default([]) }}"
  when:
    - observability_action == 'apply'
    - not observability_manage_secrets | bool
  no_log: true

- name: Decode private native identities without exporting them as environment expressions
  ansible.builtin.set_fact:
    observability_prepper_auth:
      username: "{{ observability_prepper_existing.results[0].resources[0].data.username | b64decode }}"
      password: "{{ observability_prepper_existing.results[0].resources[0].data.password | b64decode }}"
    observability_prepper_search_auth:
      username: "{{ observability_prepper_existing.results[1].resources[0].data.username | b64decode }}"
      password: "{{ observability_prepper_existing.results[1].resources[0].data.password | b64decode }}"
    observability_search_users_checksum: "{{ observability_prepper_existing.results[2].resources[0].data['internal_users.yml'] | b64decode | hash('sha256') }}"
  when:
    - observability_action == 'apply'
    - not observability_manage_secrets | bool
  no_log: true

- name: Reject render placeholders and unexpected indexing principals on apply
  ansible.builtin.assert:
    that:
      - observability_prepper_auth.username | length > 0
      - observability_prepper_auth.password | length >= 16
      - observability_prepper_search_auth.username == 'data-prepper'
      - observability_prepper_search_auth.password | length >= 16
      - "'render-only' not in [observability_prepper_auth.password, observability_prepper_search_auth.password]"
  when: observability_action == 'apply'
  no_log: true
