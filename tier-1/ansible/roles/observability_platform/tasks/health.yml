---
- name: Wait for the native Grafana database cluster
  kubernetes.core.k8s_info:
    kubeconfig: "{{ observability_kubeconfig }}"
    context: "{{ observability_context | default(omit, true) }}"
    validate_certs: true
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    namespace: "{{ observability_namespace }}"
    name: grafana-db
    wait: true
    wait_timeout: 900
    wait_condition: {type: Ready, status: 'True'}
  register: observability_database

- name: Require all configured PostgreSQL instances
  ansible.builtin.assert:
    that:
      - observability_database.resources[0].status.readyInstances | int == 3

- name: Wait for at least one completed native object-store backup
  kubernetes.core.k8s_info:
    kubeconfig: "{{ observability_kubeconfig }}"
    context: "{{ observability_context | default(omit, true) }}"
    validate_certs: true
    api_version: postgresql.cnpg.io/v1
    kind: Backup
    namespace: "{{ observability_namespace }}"
    label_selectors: [cnpg.io/cluster=grafana-db]
  register: observability_database_backups
  until: observability_database_backups.resources | selectattr('status.phase', 'defined') | selectattr('status.phase', 'equalto', 'completed') | list | length > 0
  retries: 60
  delay: 10

- name: Check independent stateful workloads after Helm convergence
  kubernetes.core.k8s_info:
    kubeconfig: "{{ observability_kubeconfig }}"
    context: "{{ observability_context | default(omit, true) }}"
    validate_certs: true
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ observability_namespace }}"
    name: "{{ item.name }}"
  loop:
    - {name: metrics-1, replicas: 1}
    - {name: metrics-2, replicas: 1}
    - {name: otel-gateway, replicas: "{{ observability_gateway_replicas }}"}
    - {name: opensearch, replicas: "{{ observability_search_replicas }}"}
  register: observability_stateful
  until:
    - observability_stateful.resources | length == 1
    - observability_stateful.resources[0].status.readyReplicas | default(0) | int == item.replicas | int
    - observability_stateful.resources[0].status.currentRevision == observability_stateful.resources[0].status.updateRevision
  retries: 30
  delay: 10

- name: Check required diagnostic parents and frontends
  kubernetes.core.k8s_info:
    kubeconfig: "{{ observability_kubeconfig }}"
    context: "{{ observability_context | default(omit, true) }}"
    validate_certs: true
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ item.namespace | default(observability_namespace) }}"
    name: "{{ item.name }}"
  loop:
    - {name: data-prepper, replicas: "{{ observability_prepper_replicas }}"}
    - {name: metrics-query, replicas: "{{ observability_ui_replicas }}"}
    - {name: dashboards, replicas: "{{ observability_ui_replicas }}"}
    - {name: grafana, replicas: "{{ observability_ui_replicas }}"}
    - {name: netdata-1-parent, namespace: "{{ observability_netdata_namespace }}-1", replicas: 1}
    - {name: netdata-2-parent, namespace: "{{ observability_netdata_namespace }}-2", replicas: 1}
  register: observability_deployment
  until:
    - observability_deployment.resources | length == 1
    - observability_deployment.resources[0].status.availableReplicas | default(0) | int == item.replicas | int
    - observability_deployment.resources[0].status.observedGeneration == observability_deployment.resources[0].metadata.generation
  retries: 30
  delay: 10
