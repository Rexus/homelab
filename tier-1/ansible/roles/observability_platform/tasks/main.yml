---
- name: Require one explicit ongoing deployment owner
  ansible.builtin.assert:
    that:
      - observability_owner in ['ansible', 'flux']
      - observability_owner != 'flux' or observability_action == 'render'
      - observability_owner != 'flux' or observability_flux_migration in ['fresh', 'adopt']
      - observability_owner != 'flux' or observability_flux_migration != 'adopt' or observability_previous_writer_disabled | bool
    fail_msg: Flux mode renders only. Select fresh or acknowledge adoption after disabling the previous writer.

- name: Render the reviewed Flux-owned component
  ansible.builtin.include_tasks: flux.yml
  when: observability_owner == 'flux'

- name: Run the retained legacy Ansible lifecycle
  ansible.builtin.include_tasks: legacy.yml
  when: observability_owner == 'ansible'
