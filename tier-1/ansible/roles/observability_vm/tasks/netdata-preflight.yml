---
- name: Require private, distinct Netdata streaming credentials
  ansible.builtin.assert:
    that:
      - observability_vm_netdata_child_key is match(uuid_pattern)
      - observability_vm_netdata_peer_key is match(uuid_pattern)
      - observability_vm_netdata_child_key != observability_vm_netdata_peer_key
      - observability_vm_netdata_child_key != '00000000-0000-0000-0000-000000000000'
      - observability_vm_netdata_peer_key != '00000000-0000-0000-0000-000000000000'
  vars:
    uuid_pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'
  no_log: true

- name: Require explicit diagnostic access and bounded resources
  ansible.builtin.assert:
    that:
      - observability_vm_netdata_admin_allow_from | length > 0
      - observability_vm_netdata_diagnostics_port | int >= 20000
      - observability_vm_netdata_diagnostics_port | int <= 21000
      - observability_vm_netdata_uid | int > 0
      - observability_vm_netdata_gid | int > 0
      - observability_vm_netdata_parent_history_mib | int >= 256
      - observability_vm_netdata_child_history_mib | int >= 64
      - observability_vm_netdata_scrape_parent in observability_vm_gateway_hosts
    fail_msg: Select diagnostic administrator sources, storage budgets and exactly one parent for the metric bridge.

- name: Keep diagnostics restricted to explicit IPv4 addresses or narrow native patterns
  ansible.builtin.assert:
    that: item is match('^([0-9]{1,3}[.]){3}([0-9]{1,3}|[*])$')
    fail_msg: Use exact administrator IPv4 addresses or a final-octet wildcard; broad wildcards and tenant routes are invalid.
  loop: "{{ observability_vm_netdata_admin_allow_from }}"

- name: Require the static inventory addresses used by native streaming access lists
  ansible.builtin.assert:
    that: platform_host_ips[item] | default('') is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
    fail_msg: Give each dedicated VM its actual static IPv4 address in platform_host_ips; preserve the observed source without SNAT.
  loop: "{{ observability_vm_gateway_hosts + observability_vm_metrics_hosts + observability_vm_search_hosts }}"

- name: Require exact approved Prometheus metric names
  ansible.builtin.assert:
    that: item is match('^[A-Za-z_:][A-Za-z0-9_:]*$')
    fail_msg: Select actual Netdata Prometheus metric names; regular expressions and blanket export are not accepted.
  loop: "{{ observability_vm_netdata_scrape_metrics }}"
