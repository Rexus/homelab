---
- name: Inspect the exact selected control-product claim
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ recovery_control_claim }}"
    namespace: "{{ recovery_product.namespace }}"
  register: recovery_control_claim_observed

- name: Require a new plan-owned PVC or its retained explicit identity
  ansible.builtin.assert:
    that:
      - recovery_control_claim_observed.resources | length == 1
      - recovery_product.claim_uids[recovery_control_claim] == 'new' or recovery_product.claim_uids[recovery_control_claim] == recovery_control_claim_observed.resources[0].metadata.uid
      - recovery_control_claim_observed.resources[0].metadata.annotations.get('recovery.homelab/plan-sha256', '') == platform_recovery.plan_sha256

- name: Select the exact native control restore and claim receipt
  ansible.builtin.set_fact:
    recovery_control_claim_receipt: "{{ platform_recovery.workspace }}/receipts/{{ recovery_product.name }}-{{ recovery_control_claim }}-claim.json"
    recovery_control_guard_name: "guard-{{ recovery_product.name }}-{{ (recovery_control_claim | hash('sha256'))[:12] }}-{{ platform_recovery.plan_sha256[:12] }}"

- name: Inspect the original native claim checkpoint
  ansible.builtin.stat:
    path: "{{ recovery_control_claim_receipt }}"
  register: recovery_control_claim_checkpoint

- name: Inspect any previous native operation before binding a clean target
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: batch/v1
    kind: Job
    namespace: "{{ recovery_product.namespace }}"
    name: "{{ recovery_control_guard_name if recovery_product.kind == 'vault-raft' else 'restore-' ~ recovery_product.name ~ '-' ~ platform_recovery.plan_sha256[:12] }}"
  register: recovery_control_previous_job

- name: Refuse reuse of an operation whose original claim receipt was lost
  ansible.builtin.assert:
    that:
      - recovery_control_claim_checkpoint.stat.exists or recovery_control_previous_job.resources | length == 0

- name: Require the same native claim and namespace after any interruption
  ansible.builtin.assert:
    that:
      - recorded.plan_sha256 == platform_recovery.plan_sha256
      - recorded.uid == recovery_control_claim_observed.resources[0].metadata.uid
      - recorded.namespace_uid == recovery_namespace.resources[0].metadata.uid
  vars:
    recorded: "{{ lookup('ansible.builtin.file', recovery_control_claim_receipt) | from_json }}"
  when: recovery_control_claim_checkpoint.stat.exists

- name: Bind the observed clean claim before starting native work
  ansible.builtin.copy:
    dest: "{{ recovery_control_claim_receipt }}"
    force: false
    mode: '0600'
    content: >-
      {{ {'plan_sha256': platform_recovery.plan_sha256,
          'uid': recovery_control_claim_observed.resources[0].metadata.uid,
          'namespace_uid': recovery_namespace.resources[0].metadata.uid} | to_nice_json }}

- name: Collect actual control-product claim UIDs
  ansible.builtin.set_fact:
    recovery_control_claim_uids: "{{ recovery_control_claim_uids | combine({recovery_control_claim: recovery_control_claim_observed.resources[0].metadata.uid}) }}"

- name: Render one empty-volume guard for one Vault RWO claim
  ansible.builtin.set_fact:
    recovery_job: "{{ lookup('ansible.builtin.template', 'vault-claim-guard.yml.j2') | from_yaml }}"
  when: recovery_product.kind == 'vault-raft'

- name: Execute the original UID-bound empty-volume guard
  ansible.builtin.include_tasks: native-job.yml
  when: recovery_product.kind == 'vault-raft'

- name: Release the completed guard Pod before starting a Vault member
  kubernetes.core.k8s:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: v1
    kind: Pod
    namespace: "{{ recovery_product.namespace }}"
    label_selectors: ["batch.kubernetes.io/controller-uid={{ recovery_native_receipt.uid }}"]
    state: absent
    wait: true
    wait_timeout: 300
  when: recovery_product.kind == 'vault-raft'
