---
- name: Select this cluster's independent source and cutover contracts
  ansible.builtin.set_fact:
    recovery_scope_package: "{{ recovery_cutover_cluster.package | default(platform_recovery.package) }}"
    recovery_scope_cutover: "{{ recovery_cutover_cluster.cutover | default(platform_recovery.cutover) }}"

- name: Require only this cluster's actual product verification identities
  ansible.builtin.assert:
    that:
      - >-
        recovery_verification_jobs | selectattr('tier', 'equalto', recovery_cutover_cluster.tier) | list | length ==
        platform_recovery.products | selectattr('tier', 'equalto', recovery_cutover_cluster.tier) | list | length

- name: Reestablish this cluster's normal native Git ownership while its roots remain paused
  ansible.builtin.include_tasks: source-handoff.yml
  loop: "{{ recovery_scope_cutover.sources | dict2items }}"
  loop_control:
    loop_var: recovery_source_handoff

- name: Resume this cluster's accepted scope through the retained UID-bound Flux receipts
  ansible.builtin.include_role:
    name: flux_maintenance
  vars:
    flux_maintenance_action: apply
    flux_maintenance_operation: resume
    flux_maintenance_approved: true
    flux_maintenance_source: "{{ recovery_resume_root }}"
    flux_maintenance_revision: "{{ recovery_scope_package.sources[recovery_resume_root] }}"
    flux_maintenance_application_branch: "{{ recovery_scope_cutover.sources.get('tier1-applications', {}).get('ref', 'refs/heads/delivery') | regex_replace('^refs/heads/', '') }}"
    flux_maintenance_kubeconfig: "{{ platform_recovery.workspace }}/{{ recovery_cutover_cluster.kubeconfig }}"
    flux_maintenance_context: "{{ recovery_cutover_cluster.context }}"
    flux_maintenance_output: "{{ platform_recovery.workspace }}/receipts/flux-{{ recovery_cutover_cluster.tier }}-{{ recovery_resume_root }}"
    flux_maintenance_resume_checks: "{{ recovery_verification_jobs | selectattr('tier', 'equalto', recovery_cutover_cluster.tier) | list }}"
    flux_maintenance_resume_suspended_uids: >-
      {{ (lookup('ansible.builtin.file', platform_recovery.workspace ~ '/receipts/flux-' ~ (recovery_cutover_cluster.tier | string) ~ '-' ~ recovery_resume_root ~ '/scope-receipt.json')
          | from_json).resources.values() | selectattr('kind', 'equalto', 'Kustomization')
          | selectattr('namespace', 'equalto', 'flux-system')
          | selectattr('name', 'in', recovery_scope_cutover.resume_roots) | map(attribute='uid') | list }}
    flux_maintenance_canary_sha256: "{{ recovery_cutover_cluster.canary_sha256 }}"
    flux_maintenance_health_checks: "{{ recovery_scope_cutover.health_checks }}"
    flux_maintenance_recovery_directory: "{{ recovery_scope_package.directory }}"
    flux_maintenance_artifact_lock_sha256: "{{ recovery_scope_package.artifact_lock_sha256 }}"
    flux_maintenance_custody_accepted: true
  loop: "{{ recovery_scope_cutover.resume_roots }}"
  loop_control:
    loop_var: recovery_resume_root

- name: Verify operating consumers and normal source ownership before reconnecting NICs
  ansible.builtin.include_tasks: operating-health.yml
