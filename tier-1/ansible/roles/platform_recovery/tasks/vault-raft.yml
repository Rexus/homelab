---
- name: Require a retained Shamir Raft identity and all selected data claims
  ansible.builtin.assert:
    that:
      - recovery_product.tier == 0
      - recovery_product.vault.seal == 'shamir'
      - recovery_product.vault.custody.mode in ['ephemeral-file', 'physical-custodians']
      - recovery_product.data_claims | length > 0
      - recovery_product.claim_uids.keys() | list | sort == recovery_product.data_claims | sort
      - recovery_product.vault.members | map(attribute='data_claim') | list | difference(recovery_product.data_claims) | length == 0
    fail_msg: Supply the original Shamir identity, explicit data and audit claims, and the retained native control_backup set.

- name: Show the selected human custody path before unattended Vault recovery
  ansible.builtin.debug:
    msg: >-
      Shamir recovery requires the original keyholders. For physical custody, attending custodians run
      vault_recovery.py --collect-custody <private-file> --shares <original-quorum> on the independent controller.
      Accept its SHA256 in vault.custody with mode ephemeral-file before the unattended restore.
      The private file and temporary bootstrap credentials remain in the owner-only local custody directory.

- name: Require independently furnished original shares before any Vault target mutation
  ansible.builtin.assert:
    that: recovery_product.vault.custody.mode == 'ephemeral-file'
    fail_msg: Complete the attending-custodian collection step and accept the resulting file checksum first.

- name: Inspect the retained stopped Vault server template
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ recovery_product.namespace }}"
    name: "{{ recovery_product.vault.statefulset }}"
  register: recovery_vault_statefulset

- name: Require the original server image and fenced initialization
  ansible.builtin.assert:
    that:
      - recovery_vault_statefulset.resources | length == 1
      - recovery_vault_statefulset.resources[0].spec.replicas | int == 0
      - recovery_vault_statefulset.resources[0].spec.template.spec.containers | selectattr('name', 'equalto', recovery_product.vault.container) | map(attribute='image') | list == [recovery_product.vault.image]
      - recovery_vault_statefulset.resources[0].spec.template.spec.initContainers | default([]) | length == 0
    fail_msg: Hold the original Vault StatefulSet at zero with the retained digest and no fresh initializer.

- name: Prepare the private controller-only native restore inputs
  ansible.builtin.set_fact:
    recovery_vault_config_path: "{{ platform_recovery.workspace }}/receipts/{{ recovery_product.name }}-vault-inputs.json"
    recovery_control_claim_uids: {}

- name: Write the checksum-bound Vault product contract without embedding its shares
  ansible.builtin.copy:
    dest: "{{ recovery_vault_config_path }}"
    mode: '0600'
    content: >-
      {{ {'workspace': platform_recovery.workspace, 'plan_sha256': platform_recovery.plan_sha256,
          'product': recovery_product, 'kubeconfig': recovery_kubeconfig, 'context': recovery_context,
          'namespace_uid': recovery_namespace.resources[0].metadata.uid,
          'statefulset_uid': recovery_vault_statefulset.resources[0].metadata.uid} | to_nice_json }}
  no_log: true

- name: Validate local custody and read back the exact independently retained native snapshot
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/vault_recovery.py"
      - --config
      - "{{ recovery_vault_config_path }}"
      - --control-tools
      - "{{ platform_recovery.workspace }}/tier-0/ansible/roles/control_backup/files"
      - --operation
      - prepare
  changed_when: false
  no_log: true

- name: Bind and guard each original Vault data and audit claim separately
  ansible.builtin.include_tasks: control-claim.yml
  loop: "{{ recovery_product.data_claims }}"
  loop_control:
    loop_var: recovery_control_claim

- name: Add the observed claim identities to the local operation contract
  ansible.builtin.copy:
    dest: "{{ recovery_vault_config_path }}"
    mode: '0600'
    content: >-
      {{ (lookup('ansible.builtin.file', recovery_vault_config_path) | from_json)
         | combine({'claim_uids': recovery_control_claim_uids}) | to_nice_json }}
  no_log: true

- name: Start only the isolated first native Raft member
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ recovery_product.namespace }}"
    name: "{{ recovery_product.vault.statefulset }}"
    replicas: 1
    wait: false

- name: Wait for the sealed first member to run without requiring unsealed readiness
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: v1
    kind: Pod
    namespace: "{{ recovery_product.namespace }}"
    name: "{{ recovery_product.vault.members[0].pod }}"
  register: recovery_vault_first_pod
  until: >-
    recovery_vault_first_pod.resources | length == 1 and
    recovery_vault_first_pod.resources[0].status.phase | default('') == 'Running'
  retries: 180
  delay: 5

- name: Restore the single isolated leader and verify its original identity and secret content
  ansible.builtin.command:
    argv: ["{{ ansible_playbook_python }}", "{{ role_path }}/files/vault_recovery.py",
           --config, "{{ recovery_vault_config_path }}", --control-tools,
           "{{ platform_recovery.workspace }}/tier-0/ansible/roles/control_backup/files", --operation, leader]
  changed_when: true
  no_log: true

- name: Start the remaining accepted Raft voters after original leader verification
  kubernetes.core.k8s_scale:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ recovery_product.namespace }}"
    name: "{{ recovery_product.vault.statefulset }}"
    replicas: "{{ recovery_product.vault.members | length }}"
    wait: false

- name: Join native Raft voters with the original shares and reverify retained content
  ansible.builtin.command:
    argv: ["{{ ansible_playbook_python }}", "{{ role_path }}/files/vault_recovery.py",
           --config, "{{ recovery_vault_config_path }}", --control-tools,
           "{{ platform_recovery.workspace }}/tier-0/ansible/roles/control_backup/files", --operation, members]
  changed_when: true
  no_log: true

- name: Render the native unsealed original-cluster proof without a Vault token
  ansible.builtin.set_fact:
    recovery_job: "{{ lookup('ansible.builtin.template', 'vault-verified.yml.j2') | from_yaml }}"

- name: Journal the actual verified original Vault cluster as a native completed Job
  ansible.builtin.include_tasks: native-job.yml
