---
- name: Inspect the independently retained native backup catalog
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: velero.io/v1
    kind: Backup
    namespace: "{{ recovery_product.velero_namespace | default('velero') }}"
    name: "{{ recovery_product.backup_id }}"
  register: recovery_velero_backup
  until: recovery_velero_backup.resources | length == 1 and recovery_velero_backup.resources[0].status.phase | default('') == 'Completed'
  retries: 180
  delay: 5

- name: Require a complete native backup with the retained UID and dataset scope
  ansible.builtin.assert:
    that:
      - recovery_velero_backup.resources | length == 1
      - recovery_product.backup_uid == 'new' or recovery_velero_backup.resources[0].metadata.uid == recovery_product.backup_uid
      - recovery_velero_backup.resources[0].spec | to_json(sort_keys=True) | hash('sha256') == recovery_product.backup_spec_sha256
      - recovery_velero_backup.resources[0].status.phase == 'Completed'
      - recovery_product.namespace in recovery_velero_backup.resources[0].spec.includedNamespaces
      - recovery_velero_backup.resources[0].status.errors | default(0) | int == 0
      - recovery_velero_backup.resources[0].status.csiVolumeSnapshotsCompleted | default(0) | int > 0
      - recovery_velero_backup.resources[0].status.csiVolumeSnapshotsCompleted | int == recovery_velero_backup.resources[0].status.csiVolumeSnapshotsAttempted | int
    fail_msg: This fenced restore adapter requires complete independently retained CSI snapshots. Pod filesystem restores need a separate native restore path.

- name: Inspect a previous native restore before creating another operation
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: velero.io/v1
    kind: Restore
    namespace: "{{ recovery_product.velero_namespace | default('velero') }}"
    name: "{{ recovery_product.name }}-{{ platform_recovery.recovery_id }}"
  register: recovery_velero_previous

- name: Reject a changed or failed native restore
  ansible.builtin.assert:
    that:
      - >-
        recovery_velero_previous.resources | length == 0 or
        (recovery_velero_previous.resources[0].spec.backupName == recovery_product.backup_id and
         recovery_velero_previous.resources[0].metadata.annotations['recovery.homelab/plan-sha256'] == platform_recovery.plan_sha256 and
         recovery_velero_previous.resources[0].status.phase | default('') not in ['Failed', 'FailedValidation', 'PartiallyFailed'])
    fail_msg: Preserve the failed restore and use a new isolated target after inspecting native errors.

- name: Inspect target claims before the first snapshot restore
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ recovery_product.namespace }}"
  register: recovery_velero_target_claims

- name: Prevent a native restore from silently skipping existing live claims
  ansible.builtin.assert:
    that:
      - recovery_velero_previous.resources | length > 0 or recovery_velero_target_claims.resources | length == 0
    fail_msg: Select a clean isolated target namespace. Existing claims are never overwritten or accepted as restored by a skipped Velero operation.

- name: Restore complete selected data while excluding application writers and external ingress
  kubernetes.core.k8s:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    state: present
    definition:
      apiVersion: velero.io/v1
      kind: Restore
      metadata:
        name: "{{ recovery_product.name }}-{{ platform_recovery.recovery_id }}"
        namespace: "{{ recovery_product.velero_namespace | default('velero') }}"
        annotations: {recovery.homelab/plan-sha256: "{{ platform_recovery.plan_sha256 }}"}
      spec:
        backupName: "{{ recovery_product.backup_id }}"
        includedNamespaces: ["{{ recovery_product.namespace }}"]
        excludedResources: [pods, deployments.apps, statefulsets.apps, daemonsets.apps, jobs.batch, cronjobs.batch, ingresses.networking.k8s.io]
        existingResourcePolicy: none
        restorePVs: true
  when: recovery_velero_previous.resources | length == 0

- name: Require the actual native restore to complete without errors
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: velero.io/v1
    kind: Restore
    namespace: "{{ recovery_product.velero_namespace | default('velero') }}"
    name: "{{ recovery_product.name }}-{{ platform_recovery.recovery_id }}"
  register: recovery_velero_result
  until: >-
    recovery_velero_result.resources | length == 1 and
    recovery_velero_result.resources[0].status.phase | default('') in
      ['Completed', 'Failed', 'FailedValidation', 'PartiallyFailed']
  retries: 720
  delay: 5

- name: Require a complete dataset before recording native recovery
  ansible.builtin.assert:
    that:
      - recovery_velero_result.resources[0].status.phase == 'Completed'
      - recovery_velero_result.resources[0].status.errors | default(0) | int == 0

- name: Inspect the actual claims produced by the completed native snapshot restore
  kubernetes.core.k8s_info:
    kubeconfig: "{{ recovery_kubeconfig }}"
    context: "{{ recovery_context }}"
    validate_certs: true
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ recovery_product.namespace }}"
  register: recovery_velero_restored_claims

- name: Refuse source resumption with missing or unexpected restored data claims
  ansible.builtin.assert:
    that:
      - recovery_velero_restored_claims.resources | map(attribute='metadata.name') | sort | list == recovery_product.data_claims | sort
      - recovery_velero_restored_claims.resources | rejectattr('status.phase', 'equalto', 'Bound') | list | length == 0
    fail_msg: The native restore did not produce the complete selected PVC set. Keep consumers stopped; normal Helm installation must not initialize missing data.

- name: Bind native restored claim generations to their original operation
  ansible.builtin.set_fact:
    recovery_velero_claim_uids: "{{ dict(recovery_velero_restored_claims.resources | map(attribute='metadata.name') | zip(recovery_velero_restored_claims.resources | map(attribute='metadata.uid'))) }}"
    recovery_velero_checkpoint_path: "{{ platform_recovery.workspace }}/receipts/{{ recovery_product.name }}-velero.json"

- name: Inspect the original native snapshot restore identity checkpoint
  ansible.builtin.stat:
    path: "{{ recovery_velero_checkpoint_path }}"
  register: recovery_velero_checkpoint

- name: Reject replaced native restore or PVC identities during a retry
  ansible.builtin.assert:
    that:
      - recorded.plan_sha256 == platform_recovery.plan_sha256
      - recorded.restore_uid == recovery_velero_result.resources[0].metadata.uid
      - recorded.backup_uid == recovery_velero_backup.resources[0].metadata.uid
      - recorded.claims == recovery_velero_claim_uids
  vars:
    recorded: "{{ lookup('ansible.builtin.file', recovery_velero_checkpoint_path) | from_json }}"
  when: recovery_velero_checkpoint.stat.exists

- name: Retain the completed native snapshot and exact data-claim identities
  ansible.builtin.copy:
    dest: "{{ recovery_velero_checkpoint_path }}"
    force: false
    mode: '0600'
    content: "{{ {'plan_sha256': platform_recovery.plan_sha256, 'restore_uid': recovery_velero_result.resources[0].metadata.uid, 'backup_uid': recovery_velero_backup.resources[0].metadata.uid, 'claims': recovery_velero_claim_uids} | to_nice_json }}"

- name: Retain the native restore UID and accepted backup identity
  ansible.builtin.set_fact:
    recovery_native_receipt:
      kind: Restore
      uid: "{{ recovery_velero_result.resources[0].metadata.uid }}"
      backup: "{{ recovery_product.backup_id }}"
      backup_uid: "{{ recovery_velero_backup.resources[0].metadata.uid }}"
