---
- name: Validate Podman runner registration inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - not podman_runner_register | bool or podman_runner_gitlab_url | length > 0
      - not podman_runner_register | bool or podman_runner_authentication_token | length > 0
    fail_msg: >-
      Use a RedHat-family runner host with an approved GitLab Runner package repository.
      Set podman_runner_gitlab_url and podman_runner_authentication_token when
      podman_runner_register is true.
  no_log: "{{ podman_runner_register | bool }}"

- name: Install private CA certificate for runner traffic
  ansible.builtin.copy:
    src: "{{ podman_runner_trust_ca_src }}"
    dest: "{{ podman_runner_trust_ca_dest }}"
    owner: root
    group: root
    mode: "0644"
  register: podman_runner_trust_ca
  when: podman_runner_trust_ca_src | length > 0

- name: Update system CA trust
  ansible.builtin.command:
    argv:
      - update-ca-trust
  changed_when: true
  when:
    - podman_runner_trust_ca_src | length > 0
    - podman_runner_trust_ca.changed

- name: Install Podman build packages
  ansible.builtin.dnf:
    name: "{{ podman_runner_packages }}"
    state: present
    update_cache: true

- name: Install GitLab Runner package
  ansible.builtin.dnf:
    name: "{{ podman_runner_gitlab_runner_package }}"
    state: present
    update_cache: true
  when: podman_runner_install_gitlab_runner | bool

- name: Check GitLab Runner user
  ansible.builtin.getent:
    database: passwd
    key: "{{ podman_runner_user }}"
    fail_key: false
  when: podman_runner_configure_subuids | bool

- name: Configure subuid range for rootless Podman builds
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^{{ podman_runner_user }}:"
    line: "{{ podman_runner_user }}:{{ podman_runner_subid_start }}:{{ podman_runner_subid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when:
    - podman_runner_configure_subuids | bool
    - podman_runner_user in (ansible_facts.getent_passwd | default({}))

- name: Configure subgid range for rootless Podman builds
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^{{ podman_runner_user }}:"
    line: "{{ podman_runner_user }}:{{ podman_runner_subid_start }}:{{ podman_runner_subid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when:
    - podman_runner_configure_subuids | bool
    - podman_runner_user in (ansible_facts.getent_passwd | default({}))

- name: Ensure GitLab Runner service is enabled
  ansible.builtin.service:
    name: "{{ podman_runner_service_name }}"
    enabled: true
    state: started
  when:
    - podman_runner_install_gitlab_runner | bool
    - podman_runner_manage_service | bool

- name: Check GitLab Runner configuration
  ansible.builtin.stat:
    path: "{{ podman_runner_config_file }}"
  register: podman_runner_config
  when:
    - podman_runner_install_gitlab_runner | bool
    - podman_runner_register | bool

- name: List configured runners through the native read-only CLI
  ansible.builtin.command:
    argv: [gitlab-runner, --log-format, json, list, --config, "{{ podman_runner_config_file }}"]
  changed_when: false
  check_mode: false
  register: podman_runner_existing
  when:
    - podman_runner_install_gitlab_runner | bool
    - podman_runner_register | bool
    - podman_runner_config.stat.exists
  no_log: true

- name: Decode private runner records without exposing authentication tokens
  ansible.builtin.set_fact:
    podman_runner_records: >-
      {{ ((podman_runner_existing.stdout_lines | default([])) +
          (podman_runner_existing.stderr_lines | default([]))) |
         select('match', '^\{') | map('from_json') | list }}
  when:
    - podman_runner_install_gitlab_runner | bool
    - podman_runner_register | bool
  no_log: true

- name: Reject unreadable runner configuration before registration
  ansible.builtin.assert:
    that:
      - >-
        podman_runner_records | selectattr('msg', 'defined') |
        selectattr('msg', 'equalto', 'Listing configured runners') | list | length == 1
    fail_msg: The native runner CLI could not read the existing config; repair it before registering.
  when:
    - podman_runner_install_gitlab_runner | bool
    - podman_runner_register | bool
    - podman_runner_config.stat.exists
  no_log: true

- name: Require a modern authentication token for a new runner registration
  ansible.builtin.assert:
    that:
      - podman_runner_authentication_token is match('^glrt-[^\s]+$')
      - podman_runner_gitlab_url is match('^https://')
    fail_msg: Create a runner in GitLab first and supply its glrt- authentication token and HTTPS URL.
  when:
    - podman_runner_install_gitlab_runner | bool
    - podman_runner_register | bool
    - podman_runner_records | selectattr('Executor', 'defined') | list | length == 0
  no_log: true

- name: Register an unconfigured GitLab Runner
  ansible.builtin.command:
    argv:
      - gitlab-runner
      - register
      - --config
      - "{{ podman_runner_config_file }}"
      - --non-interactive
      - --url
      - "{{ podman_runner_gitlab_url }}"
      - --token
      - "{{ podman_runner_authentication_token }}"
      - --executor
      - "{{ podman_runner_executor }}"
      - --description
      - "{{ podman_runner_description }}"
  no_log: true
  when:
    - podman_runner_install_gitlab_runner | bool
    - podman_runner_register | bool
    - podman_runner_records | selectattr('Executor', 'defined') | list | length == 0
