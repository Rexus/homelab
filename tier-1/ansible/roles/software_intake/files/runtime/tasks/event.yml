---
- name: Emit the decision independently of the search interface
  community.general.syslogger:
    ident: software-intake
    facility: local6
    priority: "{{ 'info' if intake_verdict == 'approved' else 'err' }}"
    msg: >-
      {{ {'event.type': 'software_intake.decision', 'source.name': intake_source.name,
          'source.kind': intake_source.kind, 'source.host': intake_source.url | urlsplit('hostname'),
          'policy.sha256': intake_policy_sha256, 'stage': intake_phase,
          'verdict': intake_verdict,
          'reason': '' if intake_verdict == 'approved' else intake_rejection_reason,
          'artifact.version': intake_version if intake_committed | bool else '',
          'publication.published': intake_published | default(false) | bool,
          'publication.selected': intake_committed | bool,
          'scanner.version': intake_scanner_version.stdout | default('') | trim
              | regex_findall('^ClamAV [0-9][0-9A-Za-z.+_-]*(?:/[0-9]+/[A-Za-z0-9 :,._+-]+)?$') | first | default(''),
          'definition.max_age_days': intake_max_definition_age_days | int,
          'timestamp': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')} | to_json }}
  when: intake_emit_events | bool
