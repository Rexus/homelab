---
- name: Reload intake service units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload intake publisher
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Restart intake publisher
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted

- name: Restart enabled intake definition updater
  ansible.builtin.systemd_service:
    name: clamav-freshclam.service
    state: restarted
  when: software_intake_freshclam_enabled
