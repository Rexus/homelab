---
- name: Validate intake policy and trusted inputs
  ansible.builtin.import_tasks: preflight.yml

- name: Validate optional controller-local scanner definitions before host changes
  ansible.builtin.import_tasks: definitions-preflight.yml

- name: Provision the attached intake data volume
  ansible.builtin.include_role:
    name: data_volume
  vars:
    data_volume_device: "{{ software_intake_data_device }}"
    data_volume_path: "{{ software_intake_data_dir }}"
    data_volume_fstype: "{{ software_intake_data_fstype }}"
    data_volume_label: intake-data
    data_volume_expected_uuid: "{{ software_intake_data_uuid }}"
    data_volume_uuid_input: software_intake_data_uuid
    data_volume_min_free_bytes: "{{ software_intake_min_free_bytes }}"
    data_volume_environment: "{{ software_intake_environment }}"

- name: Install native tools and approved controller collections
  ansible.builtin.import_tasks: install.yml

- name: Prepare isolated identities and managed data storage
  ansible.builtin.import_tasks: storage.yml

- name: Verify and install only pinned public publisher keys
  ansible.builtin.import_tasks: keys.yml

- name: Configure the read-only publisher and serialized worker
  ansible.builtin.import_tasks: services.yml
