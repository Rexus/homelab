---
# Tier 2 selects inputs; Shared owns no cluster inventory, releases or state.
- name: Prepare selected deployment tooling
  ansible.builtin.import_playbook: ../control-node.yml
  vars:
    control_node_setup: cluster-platform
    control_node_require_terraform: false

- name: Establish the Tier 2 Kubernetes basic platform
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Run the selected deployment after tooling preparation
      ansible.builtin.include_role:
        name: cluster_platform
