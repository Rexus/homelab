---
- name: Wait for managed guest bootstrap before configuration
  ansible.builtin.import_playbook: ../../../../shared/ansible/playbooks/guest-ready.yml
  vars:
    guest_ready_group: edge_load_balancers

# Access: Tier 2 public edge proxy; no Tier 0 administrative or signing backends.
# Recipe mapping: docs/05-operations/01-hosting/ansible-recipes.md
- name: Apply edge load-balancer host baseline
  hosts: edge_load_balancers
  become: true
  roles:
    - baseline
    - edge_load_balancer
