---
- name: Prepare selected deployment tooling
  ansible.builtin.import_playbook: ../control-node.yml
  vars:
    control_node_setup: public-certificate-schedule
    control_node_require_terraform: false

- name: Schedule public certificate renewal on the authorized Tier 2 controller
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Run the selected deployment after tooling preparation
      ansible.builtin.include_role:
        name: public_certificate_schedule
