---
- name: Prepare selected deployment tooling
  ansible.builtin.import_playbook: ../control-node.yml
  vars:
    control_node_setup: workload-telemetry
    control_node_require_terraform: false

- name: Render or install scoped application telemetry
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Run the selected deployment after tooling preparation
      ansible.builtin.include_role:
        name: workload_telemetry
