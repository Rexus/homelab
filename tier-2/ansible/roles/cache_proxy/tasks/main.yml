---
- name: Run cache proxy preflight tasks
  ansible.builtin.import_tasks: preflight.yml

- name: Configure cache host tuning
  ansible.builtin.import_tasks: tuning.yml

- name: Configure cache firewall rules
  ansible.builtin.import_tasks: firewall.yml

- name: Configure Squid cache storage
  ansible.builtin.import_tasks: storage.yml

- name: Configure cache health check assets
  ansible.builtin.import_tasks: healthcheck.yml

- name: Configure Squid
  ansible.builtin.import_tasks: squid.yml

- name: Configure keepalived
  ansible.builtin.import_tasks: keepalived.yml

- name: Start and validate cache services
  ansible.builtin.import_tasks: services.yml
