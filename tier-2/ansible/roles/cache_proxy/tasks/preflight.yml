---
- name: Validate cache proxy inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family in cache_proxy_supported_os_families
      - cache_keepalived_vip_cidr is defined
      - cache_keepalived_vip_cidr | length > 0
      - cache_squid_http_port is defined
      - cache_squid_allowed_cidrs | length > 0
      - cache_squid_allowed_domains | map('trim') | reject('equalto', '') | list | length > 0
      - groups.get(cache_keepalived_group | default(''), []) | length >= 1
      - not cache_squid_data_disk_enabled | bool or cache_squid_data_device | length > 0
      - >-
        groups.get(cache_keepalived_group | default(''), [])
        | difference((platform_host_ips | default({})).keys() | list)
        | length == 0
    fail_msg: >-
      The cache proxy role supports {{ cache_proxy_supported_os_families | join(', ') }}
      guests and requires a keepalived VIP, allowed CIDRs, non-empty software-source domains, and static
      platform_host_ips for every cache host.

- name: Require an explicit valid IPv4 VIP prefix
  ansible.builtin.assert:
    that:
      - cache_keepalived_vip_cidr is match('^[0-9.]+/[1-9][0-9]?$')
      - cache_keepalived_vip_cidr | ansible.utils.ipv4('host/prefix') == cache_keepalived_vip_cidr
    fail_msg: >-
      Set cache_proxy_vip_cidr/cache_keepalived_vip_cidr to the selected IPv4 VIP and explicit
      prefix, for example 192.0.2.22/27. A missing or /0 prefix is not accepted.

- name: Require explicit software-source hostnames
  ansible.builtin.assert:
    that:
      - item | trim | length <= 253
      - >-
        item | trim | lower is match(
          '^\.?([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
    fail_msg: Use a source hostname or .domain suffix, without URL, wildcard, path or port.
  loop: "{{ cache_squid_allowed_domains }}"

- name: Require scoped client networks
  ansible.builtin.assert:
    that:
      - item | ansible.utils.ipaddr('net') != false
      - item | ansible.utils.ipaddr('prefix') | int > 0
    fail_msg: Select explicit permitted client CIDRs; an all-address network is not an intake policy.
  loop: "{{ cache_squid_allowed_cidrs }}"

- name: Preserve HTTP freshness and private responses
  ansible.builtin.assert:
    that:
      - >-
        cache_squid_refresh_patterns | join(' ') is not search(
          '(?i)(override-expire|override-lastmod|ignore-no-cache|ignore-no-store|ignore-private|ignore-reload|reload-into-ims)')
    fail_msg: >-
      Remove forced-cache refresh options. Preserve source expiry/privacy and client revalidation;
      review preserved local cache.yml inputs after refresh.

- name: Install cache proxy packages
  ansible.builtin.include_role:
    name: shared
    tasks_from: packages
  vars:
    shared_packages: "{{ cache_proxy_packages }}"
    shared_package_state: "{{ cache_squid_package_state }}"
    shared_package_update_cache: "{{ cache_package_update_cache }}"
