---
- name: Prepare the dedicated Squid cache volume
  when: cache_squid_data_disk_enabled | bool
  vars:
    data_volume_device: "{{ cache_squid_data_device }}"
    data_volume_path: "{{ cache_squid_cache_dir }}"
    data_volume_fstype: "{{ cache_squid_data_fstype }}"
    data_volume_label: cache-data
    data_volume_expected_uuid: "{{ cache_squid_data_uuid }}"
    data_volume_uuid_input: cache_squid_data_uuid
    data_volume_min_free_bytes: "{{ cache_squid_data_min_free_bytes }}"
    data_volume_wait_timeout: "{{ cache_squid_data_device_wait_timeout }}"
    data_volume_mount_options: >-
      {{ (cache_squid_data_mount_opts.split(',') + ['nodev', 'nosuid', 'noexec']) | unique | join(',') }}
  block:
    - name: Inspect the selected cache volume without changing storage
      ansible.builtin.include_role:
        name: data_volume
        tasks_from: inspect

    - name: Refuse unsafe cache storage before stopping Squid
      ansible.builtin.include_role:
        name: data_volume
        tasks_from: validate

    - name: Install additional cache filesystem tooling
      ansible.builtin.include_role:
        name: shared
        tasks_from: packages
      vars:
        shared_packages:
          - "{{ cache_squid_data_fstype_package }}"
        shared_package_update_cache: "{{ cache_package_update_cache }}"
      when: cache_squid_data_fstype_package | length > 0

    - name: Stop Squid before mounting the verified cache volume
      ansible.builtin.service:
        name: squid
        state: stopped
      when: data_volume_target_mounts | length == 0

    - name: Prepare and persist the verified cache volume by UUID
      ansible.builtin.include_role:
        name: data_volume
        tasks_from: prepare

- name: Ensure Squid owns the mounted cache directory
  ansible.builtin.file:
    path: "{{ cache_squid_cache_dir }}"
    state: directory
    owner: "{{ cache_squid_user }}"
    group: "{{ cache_squid_group }}"
    mode: "0750"
